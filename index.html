<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b2440" />
  <meta name="description" content="A Pokémon Black/White-style RPG: beat the Elite Four, catch Darmanitan, master every HM, and cross over through the Entralink into the Dream World." />
  <title>Pokémon Unova — Dream Journey</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%B4%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <a id="carddex-link" href="pokedex/" target="_blank" rel="noopener"
     title="Open the Card Dex in a new tab — scan your real Pokémon cards">📇 Card&nbsp;Dex ↗</a>
  <a id="editor-link" href="editor/" target="_blank" rel="noopener"
     title="Open FeatherCut — a zero-install, zero-storage video editor">🎬 Video&nbsp;Editor ↗</a>
  <div id="game-root">
    <div id="hud" style="display:none">
      <span class="hud-loc">Unova</span>
      <span class="hud-badges">◇◇◇◇</span>
      <span class="hud-money">¥0</span>
    </div>
    <div id="stage">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="touch-controls">
      <div class="dpad">
        <button id="btn-up" class="tc-btn tc-up" aria-label="Up">▲</button>
        <button id="btn-left" class="tc-btn tc-left" aria-label="Left">◀</button>
        <button id="btn-right" class="tc-btn tc-right" aria-label="Right">▶</button>
        <button id="btn-down" class="tc-btn tc-down" aria-label="Down">▼</button>
      </div>
      <div class="face-btns">
        <button id="btn-start" class="tc-btn tc-start" aria-label="Menu">☰</button>
        <div class="ab">
          <button id="btn-b" class="tc-btn tc-b" aria-label="B">B</button>
          <button id="btn-a" class="tc-btn tc-a" aria-label="A">A</button>
        </div>
      </div>
    </div>
  </div>
  <div id="game-ui"></div>

  <script src="game/spritedata.js"></script>
  <script src="game/data.js"></script>
  <script src="game/party.js"></script>
  <script src="game/battle.js"></script>
  <script src="game/tiles.js"></script>
  <script src="game/sprites.js"></script>
  <script src="game/maps.js"></script>
  <script src="game/audio.js"></script>
  <script src="game/gameui.js"></script>
  <script src="game/save.js"></script>
  <script src="game/input.js"></script>
  <script src="game/world.js"></script>
  <script src="game/battlescene.js"></script>
  <script src="game/menu.js"></script>
  <script src="game/entralink.js"></script>
  <script src="game/link.js"></script>
  <script src="game/main.js"></script>
</body>
</html>

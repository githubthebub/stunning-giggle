<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Compass — self-reflection coaching</title>
</head>
<body>
<style>
:root {
  --bg: #12151b;
  --surface: #1b1f27;
  --surface-alt: #232833;
  --border: #2c323d;
  --primary: #5b8def;
  --primary-muted: #33415c;
  --accent: #6fb59a;
  --text: #eef1f6;
  --muted: #a7b0be;
  --faint: #6f7887;
  --danger: #c26a6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#root { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

.screen { flex: 1; padding: 20px 18px 96px; overflow-y: auto; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 25px; margin: 6px 0 4px; }
h2 { font-size: 19px; margin: 20px 0 8px; }
h3 { font-size: 16px; margin: 14px 0 4px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 15px; }
.small { color: var(--faint); font-size: 13px; }
.accent { color: var(--accent); }
.danger { color: var(--danger); }
.spacer { height: 12px; } .spacer.lg { height: 22px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin: 12px 0;
}
.card.tappable { cursor: pointer; transition: border-color .15s, transform .05s; }
.card.tappable:hover { border-color: var(--primary-muted); }
.card.tappable:active { transform: scale(0.995); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; }

button {
  font: inherit; cursor: pointer; border: none; border-radius: 12px;
  padding: 13px 20px; color: #fff; background: var(--primary); font-weight: 600;
  margin-top: 8px; width: 100%;
}
button.secondary { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); }
button.ghost { background: transparent; color: var(--muted); }
button.inline { width: auto; padding: 10px 16px; }
button:disabled { opacity: .4; cursor: default; }
.btnrow { display: flex; gap: 8px; } .btnrow button { margin-top: 0; }

.chip {
  display: inline-block; border: 1px solid var(--border); background: var(--surface-alt);
  color: var(--muted); border-radius: 999px; padding: 8px 14px; margin: 0 8px 8px 0;
  font-size: 14px; cursor: pointer; user-select: none;
}
.chip.selected { background: var(--primary-muted); border-color: var(--primary); color: var(--text); }
.chip.static { cursor: default; }

textarea, input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; color: var(--text); font: inherit; resize: vertical;
}
textarea { min-height: 120px; }

.tabbar {
  position: sticky; bottom: 0; display: flex; background: var(--surface);
  border-top: 1px solid var(--border); max-width: 480px; margin: 0 auto; width: 100%;
}
.tabbar button {
  flex: 1; background: none; color: var(--faint); border: none; border-radius: 0;
  padding: 10px 4px; margin: 0; font-size: 12px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.tabbar button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.tabbar button.active { color: var(--primary); }
.tabbar button.active .dot { background: var(--primary); }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

.overlay {
  position: fixed; inset: 0; background: #161b22; z-index: 50; overflow-y: auto;
}
.overlay .inner { max-width: 480px; margin: 0 auto; padding: 24px 18px 48px; }
.line {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; margin: 12px 0;
}
.calltag {
  display: inline-block; background: var(--primary-muted); border-radius: 8px;
  padding: 6px 12px; margin: 4px 8px 0 0; color: var(--text); font-size: 14px;
}
.md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md p { color: var(--muted); }
.md li { color: var(--muted); margin-bottom: 4px; }
.pillbar { display:flex; gap:6px; flex-wrap:wrap; }
.pill { background: var(--surface-alt); border-radius: 999px; padding: 6px 12px; font-size: 14px; }

</style>
<div id="root"></div>

ife by your own compass, and having room to make decisions that are genuinely yours."},{id:"connection",label:"Connection",description:"Feeling close to people who know the real you, and being present for the ones who matter."},{id:"growth",label:"Growth",description:"Stretching past who you were yesterday and getting better at things you care about."},{id:"security",label:"Security",description:"Having enough stability and predictability to feel your feet under you."},{id:"contribution",label:"Contribution",description:"Doing work or offering care that makes a real difference beyond yourself."},{id:"health",label:"Health",description:"Tending to your body and mind so you have the energy to live the rest of it."},{id:"creativity",label:"Creativity",description:"Making, building, or expressing something that carries your fingerprint on it."},{id:"integrity",label:"Integrity",description:"Acting in line with what you believe, even when it costs you something."},{id:"adventure",label:"Adventure",description:"Seeking novelty, challenge, and experiences that make you feel awake."},{id:"recognition",label:"Recognition",description:"Being seen and valued for what you bring, and having your effort acknowledged."}],patternTags:[{id:"avoidance",label:"Avoidance",description:"Sidestepping the hard thing in the moment, even when a part of you knows it will cost more later.",supportiveNote:"Almost everyone avoids something; noticing the pattern is the first move toward loosening its grip."},{id:"people_pleasing",label:"People-Pleasing",description:"Managing other people's comfort at the expense of your own needs and honest opinions.",supportiveNote:"This usually starts as kindness turned all the way up, and it can be turned back down with practice."},{id:"perfectionism",label:"Perfectionism",description:"Holding a standard so high that finishing, shipping, or being seen feels unsafe.",supportiveNote:"The care underneath perfectionism is real; the goal is to keep the care and drop the tax it charges you."},{id:"self_criticism",label:"Self-Criticism",description:"Speaking to yourself with a harshness you would never aim at someone you love.",supportiveNote:"A loud inner critic is common and learnable to answer back; you are not stuck with the volume it came at."},{id:"rumination",label:"Rumination",description:"Replaying the same worry or regret in loops that feel like problem-solving but rarely resolve.",supportiveNote:"The mind loops when it cares; there are workable ways to give it an exit instead of another lap."},{id:"overcommitment",label:"Overcommitment",description:"Saying yes to more than any one person can carry, then running on fumes.",supportiveNote:"This often comes from being capable and generous, and it responds well to a few honest boundaries."},{id:"comparison",label:"Comparison",description:"Measuring your insides against other people's outsides and quietly coming up short.",supportiveNote:"Comparison is a near-universal reflex, and it loosens once you notice how rigged the measurement is."},{id:"black_and_white",label:"All-or-Nothing Thinking",description:"Seeing things as total success or total failure, with little room for the middle where most of life happens.",supportiveNote:"This is a common mental shortcut, and the gray area gets easier to see with a little practice."},{id:"fear_of_failure",label:"Fear of Failure",description:"Letting the possibility of getting it wrong shrink what you are willing to attempt.",supportiveNote:"Fear of failing usually means you care about the outcome, and courage is a muscle that grows with reps."},{id:"need_for_control",label:"Need for Control",description:"Feeling safe only when you are holding all the variables, and tense when you cannot.",supportiveNote:"Wanting control is a reasonable response to past uncertainty, and it can soften as trust gets rebuilt."}],questions:[{id:"vq1",prompt:"When you picture a version of the next year that actually feels good, what is at the center of it?",helpText:"Go with your gut, not the answer that sounds most impressive.",type:"single",options:[{id:"vq1a",label:"I am learning fast and becoming someone I respect more.",valueWeights:{growth:3,autonomy:1},patternWeights:{}},{id:"vq1b",label:"I feel close to my people and genuinely present with them.",valueWeights:{connection:3},patternWeights:{}},{id:"vq1c",label:"My life feels stable and I am not bracing for the next shock.",valueWeights:{security:3,health:1},patternWeights:{}},{id:"vq1d",label:"I am making or building something that carries my mark on it.",valueWeights:{creativity:3,contribution:1},patternWeights:{}},{id:"vq1e",label:"I am doing something new and a little bold that makes me feel alive.",valueWeights:{adventure:3,growth:1},patternWeights:{}}]},{id:"vq2",prompt:"You are facing a genuinely hard decision. What do you find yourself reaching for first?",helpText:"",type:"single",options:[{id:"vq2a",label:"The option that keeps me free to change course later.",valueWeights:{autonomy:3},patternWeights:{}},{id:"vq2b",label:"The safest option, the one least likely to blow up on me.",valueWeights:{security:3},patternWeights:{need_for_control:1,fear_of_failure:1}},{id:"vq2c",label:"The option that lets me look at myself honestly afterward.",valueWeights:{integrity:3},patternWeights:{}},{id:"vq2d",label:"The option that keeps everyone around me happy and settled.",valueWeights:{connection:2},patternWeights:{people_pleasing:2}},{id:"vq2e",label:"I stall. I gather more information until the moment almost passes.",valueWeights:{},patternWeights:{avoidance:2,need_for_control:1}}]},{id:"vq3",prompt:"Which of these actually drain you on a normal week? Pick all that ring true.",helpText:"Be honest about the ones you would rather not admit.",type:"multi",options:[{id:"vq3a",label:"Tasks I keep pushing to tomorrow that then haunt me all day.",valueWeights:{},patternWeights:{avoidance:2}},{id:"vq3b",label:"Commitments I said yes to and now quietly resent.",valueWeights:{},patternWeights:{overcommitment:2,people_pleasing:1}},{id:"vq3c",label:"Redoing things that were already fine because they were not perfect.",valueWeights:{},patternWeights:{perfectionism:2}},{id:"vq3d",label:"Running myself down on sleep, food, or movement.",valueWeights:{health:2},patternWeights:{}},{id:"vq3e",label:"Replaying conversations and decisions long after they are over.",valueWeights:{},patternWeights:{rumination:2}}]},{id:"vq4",prompt:'How true is this for you right now: "When something feels hard or uncomfortable, I find a reason to deal with it later."',helpText:"",type:"scale",options:[{id:"vq4a",label:"Strongly disagree",valueWeights:{},patternWeights:{}},{id:"vq4b",label:"Disagree",valueWeights:{},patternWeights:{}},{id:"vq4c",label:"Sometimes true",valueWeights:{},patternWeights:{avoidance:1}},{id:"vq4d",label:"Agree",valueWeights:{},patternWeights:{avoidance:2,fear_of_failure:1}},{id:"vq4e",label:"Strongly agree",valueWeights:{},patternWeights:{avoidance:3,fear_of_failure:1}}]},{id:"vq5",prompt:"Someone close to you does something that genuinely bothers you. What is your usual move?",helpText:"",type:"single",options:[{id:"vq5a",label:"I say something directly, even if it is awkward.",valueWeights:{integrity:2,connection:1},patternWeights:{}},{id:"vq5b",label:"I let it slide and tell myself it is not worth the friction.",valueWeights:{},patternWeights:{people_pleasing:2,avoidance:1}},{id:"vq5c",label:"I go quiet and stew on it for a while.",valueWeights:{},patternWeights:{rumination:2}},{id:"vq5d",label:"I try to manage or steer the situation so it does not happen again.",valueWeights:{},patternWeights:{need_for_control:2}}]},{id:"vq6",prompt:'How true is this: "Good enough rarely feels good enough. If it is not excellent, it barely counts."',helpText:"",type:"scale",options:[{id:"vq6a",label:"Strongly disagree",valueWeights:{},patternWeights:{}},{id:"vq6b",label:"Disagree",valueWeights:{},patternWeights:{}},{id:"vq6c",label:"Sometimes true",valueWeights:{},patternWeights:{perfectionism:1}},{id:"vq6d",label:"Agree",valueWeights:{},patternWeights:{perfectionism:2,black_and_white:1}},{id:"vq6e",label:"Strongly agree",valueWeights:{},patternWeights:{perfectionism:3,fear_of_failure:1,black_and_white:1}}]},{id:"vq7",prompt:"You just fell short at something that mattered. What does the voice in your head sound like?",helpText:"",type:"single",options:[{id:"vq7a",label:'"Of course you blew it. You always do."',valueWeights:{},patternWeights:{self_criticism:3}},{id:"vq7b",label:"It runs the same loop for days, dissecting every detail.",valueWeights:{},patternWeights:{rumination:3}},{id:"vq7c",label:'"Everyone else would have handled this fine."',valueWeights:{},patternWeights:{comparison:2,self_criticism:1}},{id:"vq7d",label:'"That stung. What is one thing I would do differently next time?"',valueWeights:{growth:2},patternWeights:{}}]},{id:"vq8",prompt:"Which of these would you fight to keep if life forced you to trade some away? Choose the few that are non-negotiable.",helpText:"Pick the ones you would defend, not the ones that sound good.",type:"multi",options:[{id:"vq8a",label:"Freedom to run my own life on my own terms.",valueWeights:{autonomy:2},patternWeights:{}},{id:"vq8b",label:"Deep, honest relationships.",valueWeights:{connection:2},patternWeights:{}},{id:"vq8c",label:"Work that helps people beyond me.",valueWeights:{contribution:2},patternWeights:{}},{id:"vq8d",label:"Living in a way I can stand behind.",valueWeights:{integrity:2},patternWeights:{}},{id:"vq8e",label:"Being recognized for what I bring.",valueWeights:{recognition:2},patternWeights:{}},{id:"vq8f",label:"A body and mind I actually take care of.",valueWeights:{health:2},patternWeights:{}}]},{id:"vq9",prompt:"You open your phone and see someone from your world crushing it publicly. What happens inside?",helpText:"",type:"single",options:[{id:"vq9a",label:'A quick sink of "why not me" that lingers longer than I would like.',valueWeights:{},patternWeights:{comparison:3}},{id:"vq9b",label:"I want that visible acknowledgment for my own work too.",valueWeights:{recognition:2},patternWeights:{}},{id:"vq9c",label:"It lights a fire; I want to go build something.",valueWeights:{growth:1,creativity:1},patternWeights:{}},{id:"vq9d",label:"Genuinely happy for them, and it barely touches me.",valueWeights:{},patternWeights:{}}]},{id:"vq10",prompt:'How true is this: "I say yes to more than I can realistically handle."',helpText:"",type:"scale",options:[{id:"vq10a",label:"Strongly disagree",valueWeights:{},patternWeights:{}},{id:"vq10b",label:"Disagree",valueWeights:{},patternWeights:{}},{id:"vq10c",label:"Sometimes true",valueWeights:{},patternWeights:{overcommitment:1}},{id:"vq10d",label:"Agree",valueWeights:{},patternWeights:{overcommitment:2,people_pleasing:1}},{id:"vq10e",label:"Strongly agree",valueWeights:{},patternWeights:{overcommitment:3,people_pleasing:1}}]},{id:"vq11",prompt:"Think about how you judge a day, a project, or yourself. Which is closest to how you actually operate?",helpText:"",type:"single",options:[{id:"vq11a",label:"It either went well or it was a write-off. There is not much in between.",valueWeights:{},patternWeights:{black_and_white:3}},{id:"vq11b",label:"One slip and the whole thing feels ruined.",valueWeights:{},patternWeights:{black_and_white:2,self_criticism:1}},{id:"vq11c",label:"I need to feel in control of the outcome or I cannot relax.",valueWeights:{security:1},patternWeights:{need_for_control:2}},{id:"vq11d",label:"I can usually hold the good and the rough parts of the same day at once.",valueWeights:{growth:1},patternWeights:{}}]}]};var tm={id:"career-clarity",topic:"career",title:"Career clarity",description:"A branching, honest walk through why your next career move feels stuck and one small step to unstick it.",estMinutes:8,startNodeId:"n1",nodes:[{id:"n1",type:"prompt",text:"Let's cut through it. 'Career clarity' usually isn't a knowledge problem \u2014 it's a courage problem wearing a thinking cap. Most people know more than they admit; they just don't like the answer. So before we map anything, let's find out what's actually keeping you stuck. Be honest with me here. Nobody's grading this.",next:"n2"},{id:"n2",type:"choice",text:"Which of these is closest to the truth right now?",options:[{id:"n2a",label:"I keep telling myself I'll leave, but I never actually move.",next:"n3",effects:{patternTags:["avoidance"],note:"stalling on a decision they've half-made"}},{id:"n2b",label:"Honestly? I don't even know what I want anymore.",next:"n5",effects:{note:"reports a blank, may be not-knowing on purpose"}},{id:"n2c",label:"I know what I'd rather be doing \u2014 I'm just scared to go for it.",next:"n7",effects:{patternTags:["fear_of_failure"],note:"has clarity, blocked at the first step"}}]},{id:"n3",type:"prompt",text:"Okay. So the exit door isn't locked \u2014 you keep walking up to it and turning around. Give yourself a little credit: part of you is genuinely weighing something real. But part of you is also just... waiting. And waiting rarely decides in your favor. It just lets the calendar decide for you.",next:"n4"},{id:"n4",type:"reflection",text:"Finish this sentence as honestly as you can: 'I haven't left yet because ___.' Don't give me the polished version \u2014 give me the one you'd only say out loud to a close friend.",capture:{field:"career_stall_reason",placeholder:"The real reason, not the resume reason."},next:"n9"},{id:"n5",type:"prompt",text:"Fair. 'I don't know what I want' is where a lot of people park for years \u2014 because it feels safer than picking. But not-knowing is often not-knowing on purpose: if you never name it, you never risk it. Let's test whether it's actually as blank as it feels.",next:"n6"},{id:"n6",type:"reflection",text:"Think back to the last time work \u2014 any work, paid or not \u2014 made you lose track of time. What were you actually doing in that moment? Get specific: the task, not the job title.",capture:{field:"career_aliveness",placeholder:"The moment, the task, who you were with."},next:"n9"},{id:"n7",type:"prompt",text:"Now we're getting somewhere. You know. That's the whole game \u2014 plenty of people would give a lot for the clarity you're sitting on, and you're calling it indecision. So let's stop pretending the problem is the map. The problem is the first step.",next:"n8"},{id:"n8",type:"reflection",text:"Name the thing you already know you want to move toward \u2014 say it plainly, no hedging. Then write down what you're most afraid happens if you actually go for it.",capture:{field:"career_fear_named",placeholder:"What you want, and what scares you about wanting it."},next:"n9"},{id:"n9",type:"reframe",text:"Here's the reframe: clarity isn't a feeling that arrives before you act \u2014 it's something you earn by acting. You will not think your way to certainty from the couch. The people who look decisive to you mostly just moved sooner and corrected faster. So let's find what's actually in the way.",next:"n10"},{id:"n10",type:"choice",text:"When you imagine actually making a move, what's the first thing that tightens in your chest?",options:[{id:"n10a",label:"Money and security \u2014 I can't just gamble with my life.",next:"n11",effects:{note:"frames change as financial risk"}},{id:"n10b",label:"What people would think \u2014 family, colleagues, the story they have of me.",next:"n12",effects:{patternTags:["people_pleasing"],note:"steering by an external audience"}},{id:"n10c",label:"That I'll try, fail, and it'll confirm I was never good enough.",next:"n13",effects:{patternTags:["fear_of_failure","self_criticism"],note:"ties outcome to self-worth"}}]},{id:"n11",type:"reframe",text:"Money is a real constraint \u2014 I'm not going to wave it away. But notice the word you used: 'gamble.' You've cast staying as the safe bet and leaving as the reckless one. Is that actually true? Staying in something that's draining you has a cost too \u2014 it's just quieter, and paid in years instead of dollars. Security isn't the same thing as certainty. Let's price out the real risk instead of the imagined one.",next:"n14"},{id:"n12",type:"reframe",text:"So the job might be yours, but the steering wheel is being held by an audience \u2014 some of whom aren't even watching that closely. Here's the hard part: you cannot build a life you want on the foundation of not disappointing people. Someone will always be disappointed. The only real question is whether it's them or you. Whose approval are you still auditioning for?",next:"n14"},{id:"n13",type:"reframe",text:"Read that back. You've already decided that one failure equals a verdict on your worth. That's not analysis \u2014 that's a story, and a brutal one you'd never hand to someone you loved. Everyone competent you admire has a trail of things that didn't work behind them; they just refused to let one outcome define the whole of them. A failed attempt is data. It is not a verdict on who you are.",next:"n14"},{id:"n14",type:"choice",text:"Enough naming. What's actually true about where you are right now?",options:[{id:"n14a",label:"I'm ready. I don't need more insight \u2014 I need a move.",next:"n15"},{id:"n14b",label:"I'm close, but I genuinely don't have enough real information yet.",next:"n16"},{id:"n14c",label:"Honestly, I'm overwhelmed and can't see straight.",next:"n17",effects:{note:"signals overload, needs the frame shrunk"}}]},{id:"n15",type:"action",text:"Then let's not let this be another reflection you felt good about and forgot by Friday. Momentum beats mood. One real move, this week, while the honesty is still warm.",action:{title:"Reach out to one person this week.",description:"Pick one person who's already doing something close to what you want \u2014 or who's one step ahead of you. Send a short message today asking for 20 minutes to hear how they got there. Not a favor, not a job ask \u2014 just a conversation. Send it before you overthink it into next month.",suggestQuestId:null}},{id:"n16",type:"action",text:"Good \u2014 wanting more information is legitimate, as long as 'research' doesn't quietly become the new hiding place. There's a difference between gathering data and stalling in a spreadsheet. So make it real-world, and put a deadline on it.",action:{title:"Run one reality-test this week.",description:"Choose one concrete question you can't answer from inside your own head \u2014 'What's the day-to-day actually like?' or 'Could I make the money work?' \u2014 and get the answer from outside yourself this week. One conversation, one hour of shadowing, one honest budget on paper. Real contact with reality, not another late-night search spiral.",suggestQuestId:null}},{id:"n17",type:"action",text:"Okay. When it all feels like too much, the answer isn't to push harder \u2014 it's to shrink the frame until it's carryable. You don't have to solve your whole career today. You have to do one small, honest thing. And if the overwhelm is heavy and sticking around, that's worth talking through with someone you trust or a mental-health professional \u2014 you were never meant to carry this solo.",action:{title:"Give it one honest hour.",description:"Block a single 60-minute window this week \u2014 put it in your calendar right now. In it, do nothing but write two lists: what you actually know about what you want, and what you're only guessing at. No decisions required. Just get it out of your head and onto paper where you can look at it. One hour. That's the whole ask.",suggestQuestId:null}}]};var nm={id:"burnout",topic:"burnout",title:"Running on empty",description:"A branching walk through what's actually draining you, ending in one small boundary or block of rest you can protect this week.",estMinutes:8,startNodeId:"n1",nodes:[{id:"n1",type:"prompt",text:"Let's be straight with each other. If you're here, something has been running you down for a while now, and you've probably been pushing through it instead of looking at it. Pushing through takes real effort. So does this. Give me a few honest minutes and we'll find one thing you can actually change.",next:"n2"},{id:"n2",type:"reflection",text:"Name it plainly. What's been draining you lately? Don't tidy it up or make it reasonable. Just the raw list.",capture:{field:"burnout_reflection_1",placeholder:"The work, the people who need things, the constant low hum of dread..."},next:"n3"},{id:"n3",type:"choice",text:"When you notice how wiped out you are, what's the story you tell yourself about it?",options:[{id:"n3_self",label:"I should be able to handle this. I'm being soft.",next:"n4",effects:{patternTags:["self_criticism"]}},{id:"n3_load",label:"There's just too much on me right now.",next:"n4"},{id:"n3_nostop",label:"Honestly? I never slow down long enough to think about it.",next:"n4"}]},{id:"n4",type:"reframe",text:"Read this slowly. Exhaustion is not a character flaw. You cannot out-discipline a load that's genuinely too heavy, and failing to is not weakness, it's physics. The tiredness isn't the enemy to beat. It's information about a load that needs to change. So let's stop arguing with the tiredness and look at the load.",next:"n5"},{id:"n5",type:"choice",text:"Be honest about what's actually filling your plate. Which of these lands hardest?",options:[{id:"n5_overcommit",label:"I keep saying yes to things I don't have room for.",next:"a1",effects:{patternTags:["overcommitment","people_pleasing"]}},{id:"n5_perfect",label:"Nothing feels finished unless it's flawless.",next:"b1",effects:{patternTags:["perfectionism"]}},{id:"n5_control",label:"If I don't do it myself, it won't get done right.",next:"c1",effects:{patternTags:["need_for_control"]}},{id:"n5_nochoice",label:"None of that. It's all genuinely non-negotiable.",next:"d1"}]},{id:"a1",type:"reframe",text:"There it is. Every yes you hand out is a quiet no to your own rest, you're just not around to hear it. Saying yes to be liked, or to dodge the flicker of someone's disappointment, feels generous. But a version of you running on fumes isn't much good to any of them. This isn't about becoming cold. It's about making your yes mean something again.",next:"a2"},{id:"a2",type:"choice",text:"Picture telling one person, 'I can't take this on right now.' What actually stops you?",options:[{id:"a2_letdown",label:"They'd be let down. They might think less of me.",next:"a3",effects:{patternTags:["people_pleasing"]}},{id:"a2_nothing",label:"Honestly... probably nothing bad.",next:"act_boundary"}]},{id:"a3",type:"reframe",text:"Sit with the gap between disappointing someone and harming them. A person being briefly let down is not an emergency. It's the ordinary friction of being someone with limits. Right now you're the only one treating your limits as optional. Let one other person meet the real you: the one who can't actually do everything.",next:"act_boundary"},{id:"b1",type:"reframe",text:"Perfectionism dresses up as high standards, but look at what it actually costs you. The last twenty percent of polish eats most of your energy, and most of the time nobody notices it but you. 'Flawless' isn't a standard, it's a finish line you keep moving so you never let yourself cross it. That's not devotion to quality. It's a tax on your rest, and you've been paying it for a while.",next:"b2"},{id:"b2",type:"reflection",text:"Pick one thing on your plate where 'good enough' would genuinely be fine, where done beats perfect. Name it, and name what 'good enough' would actually look like.",capture:{field:"burnout_reflection_2",placeholder:"The update email. Good enough is three honest sentences, not a polished essay."},next:"act_goodenough"},{id:"c1",type:"reframe",text:"'It won't get done right.' Let's be precise, because precision is kind here. Usually that means 'it won't be done the way I'd do it.' Both can be true, but only one is a real problem. Being the only person who can carry something isn't a badge of honor. It's a bottleneck, and the bottleneck is you, running down.",next:"c2"},{id:"c2",type:"choice",text:"Take one thing on your list. Could someone else actually carry it, even if they did it differently than you would?",options:[{id:"c2_yes",label:"Yes, but I'd have to let go of how it gets done.",next:"act_delegate",effects:{patternTags:["need_for_control"]}},{id:"c2_no",label:"No. Truly, only I can do this one.",next:"c3"}]},{id:"c3",type:"reframe",text:"Maybe. But push on it once more, because you can take it. Is it that only you can, or that only you trust yourself to? From the inside those feel identical, and they are not the same thing. You don't have to hand off everything. You just have to loosen your grip on one thing enough to breathe.",next:"act_delegate"},{id:"d1",type:"reframe",text:"I'm going to push back gently, because you deserve honesty more than easy agreement. 'It's all non-negotiable' is rarely all true. It's usually a few things that genuinely can't move, wrapped in a lot of things you've quietly decided can't move. The trap is treating the whole pile as fixed, because then you never have to make a hard choice. So let's separate the pile.",next:"d2"},{id:"d2",type:"reflection",text:"List what is truly, actually non-negotiable this week, the things with real consequences if they slip. Then look at everything that didn't make that list. What's sitting underneath the cut line that you just assumed you had to carry?",capture:{field:"burnout_reflection_3",placeholder:"Non-negotiable: rent, the deadline Friday, the kids. Everything else I just assumed..."},next:"d3"},{id:"d3",type:"prompt",text:"Here's what 'no choice' keeps hiding from you: even when the load truly can't shrink, recovery is still a lever you control. Rest isn't the reward you get for finishing. It's what makes finishing possible in the first place. And you don't have to hold all of this alone. A trusted friend, a family member, or a mental-health professional can help you carry what feels immovable. Reaching out isn't quitting. It's how people last.",next:"act_rest"},{id:"act_boundary",type:"action",text:"One boundary you actually hold teaches you more than a hundred you only rehearse in your head. Here's the move.",action:{title:"Decline or renegotiate one commitment",description:"In the next 48 hours, pick one thing on your plate and give a real 'no,' 'not now,' or a smaller yes, out loud, to an actual person. Just one. Then notice that the sky stays up.",suggestQuestId:null}},{id:"act_goodenough",type:"action",text:"You don't need to lower your standards everywhere. You just need to prove to yourself, once, that done can beat perfect.",action:{title:"Ship one thing at 'good enough'",description:"Take the task you named and finish it at eighty percent. Send it, submit it, or close it without the final polishing pass. Let 'done' be today's win, and watch what actually happens next.",suggestQuestId:null}},{id:"act_delegate",type:"action",text:"Loosening your grip on one thing will not make everything collapse. The only way to know that is to test it.",action:{title:"Hand off one task, and don't correct it",description:"Give one thing on your list to someone else this week. Tell them the outcome you need, not every step to get there. Then let them do it their way, and sit on your hands instead of redoing it.",suggestQuestId:null}},{id:"act_rest",type:"action",text:"You can't pour from empty, and somewhere you already know it. So protect one real block of recovery, on purpose.",action:{title:"Guard one block of real rest",description:"Put one genuine block of rest on your calendar this week, an hour, an evening, a slow morning, and defend it like a meeting you can't miss. Don't let scrolling stand in for rest. And if the weight still feels immovable, tell one trusted person or a mental-health professional what you're carrying.",suggestQuestId:null}}]};var rm={id:"relationships",topic:"relationships",title:"The conversation you're avoiding",description:"A branching, honest walk through the relationship conversation you keep rehearsing but never having, and one small way to finally open it.",estMinutes:8,startNodeId:"n1",nodes:[{id:"n1",type:"prompt",text:"There's a conversation you keep having in your head and never out loud. You've rehearsed it in the shower, drafted it while you couldn't sleep, and then said 'not now' one more time. Here's the thing about the conversation you're avoiding: the avoiding is its own message. They can feel the distance even if they can't name it. So let's stop rehearsing and figure out what's actually going on. Honest answers only \u2014 nobody sees this but you.",next:"n2"},{id:"n2",type:"choice",text:"Think of the specific person and the specific tension. Which of these is closest to the truth?",options:[{id:"n2a",label:"I keep swallowing it to keep the peace.",next:"n3",effects:{patternTags:["people_pleasing"],note:"silencing a need to protect the other person's comfort"}},{id:"n2b",label:"I've gone quiet \u2014 more distance, fewer words, hoping it sorts itself out.",next:"n5",effects:{patternTags:["avoidance"],note:"withdrawing instead of addressing it"}},{id:"n2c",label:"I've replayed the whole argument in my head \u2014 I already know exactly how it'll go.",next:"n7",effects:{patternTags:["need_for_control"],note:"pre-scripting the exchange to control the outcome"}}]},{id:"n3",type:"prompt",text:"Okay. So you keep choosing their comfort over your own honesty, and calling it 'keeping the peace.' But let's be precise about what you're actually keeping: not peace \u2014 quiet. Peace is when something's resolved. Quiet is when it's just buried, still ticking. And the resentment you're swallowing doesn't disappear; it leaks out sideways \u2014 in the tone, the short answers, the slow pulling-back. Let's get the real thing out on the table.",next:"n4"},{id:"n4",type:"reflection",text:"Finish this honestly: 'I keep quiet about ___ because I'm afraid that if I said it, they would ___.' Give me the unpolished version \u2014 the one you'd only say to someone you fully trust.",capture:{field:"relationships_kept_quiet",placeholder:"What you swallow, and what you fear they'd do."},next:"n9"},{id:"n5",type:"prompt",text:"So you've gone quiet and you're hoping it sorts itself out. Let's be straight: distance isn't a strategy, it's a stall. Things left alone in a relationship don't heal \u2014 they harden. And 'hoping it blows over' usually means hoping they'll read your mind, notice you're upset, and fix it without you ever having to be the one who says the hard thing. That's a lot to ask of someone you're not talking to.",next:"n6"},{id:"n6",type:"reflection",text:"Be specific: what exactly have you gone quiet about? And what are you secretly hoping they'll figure out and do \u2014 without you having to ask?",capture:{field:"relationships_gone_quiet",placeholder:"The thing you've withdrawn over, and what you wish they'd just know."},next:"n9"},{id:"n7",type:"prompt",text:"So you've run the whole scene already \u2014 what you'll say, what they'll fire back, how it ends. And on that private stage, you know exactly who they are and exactly how it goes. Here's the trap: you've been arguing with a character you wrote. You've cast them, given them their lines, and lost the fight before it happened. But that person in your head isn't the real one \u2014 and the script is doing your avoiding for you.",next:"n8"},{id:"n8",type:"reflection",text:"Write down the line you're most sure they'll say when you bring this up. Then, next to it, one honest word: how sure are you, really \u2014 a fact you've heard them say, or a story you're bracing for?",capture:{field:"relationships_scripted_line",placeholder:"Their imagined reply \u2014 and whether it's evidence or fear."},next:"n9"},{id:"n9",type:"reframe",text:"Here's the reframe, and it's the whole game: you've been having this conversation with a version of them that lives in your head. And that version is always a little colder, a little more dismissive, a little less on your side than the real person might be \u2014 because fear writes a worse ending than reality usually delivers. You are mind-reading, and then reacting to the story as if it already happened. The only way to find out who they actually are in this conversation is to actually have it. Let's find what's really stopping you.",next:"n10"},{id:"n10",type:"choice",text:"When you imagine finally saying it out loud, what tightens first?",options:[{id:"n10a",label:"It'll blow up \u2014 they'll get defensive and it'll turn into a fight.",next:"n11",effects:{patternTags:["need_for_control"],note:"equates any conflict with disaster"}},{id:"n10b",label:"They'll pull away, and I'll have made everything worse.",next:"n12",effects:{patternTags:["people_pleasing"],note:"managing their reaction before it happens"}},{id:"n10c",label:"That I'm overreacting \u2014 most people wouldn't even be bothered by this.",next:"n13",effects:{patternTags:["self_criticism","comparison"],note:"dismisses own need by measuring against imagined others"}}]},{id:"n11",type:"reframe",text:"Notice you've decided the conversation equals a fight \u2014 like there's no version where two people who care about each other disagree and stay standing. Conflict isn't the failure. The failure is the silent, drawn-out version you're already living in, where nothing gets said and the distance does the fighting for you. A hard conversation isn't the opposite of a good relationship. Avoiding every hard conversation is how good ones quietly die.",next:"n14"},{id:"n12",type:"reframe",text:"Look at what you just did: you're managing their reaction before they've even had one. You've appointed yourself in charge of their feelings, which sounds generous but is actually a way of staying in control \u2014 and of never having to risk hearing what they really think. Here's the harder truth: if this relationship can't survive you naming one honest need, that's information you need, not a disaster to prevent. You can't protect a connection by hiding from it.",next:"n14"},{id:"n13",type:"reframe",text:"Stop and read that back. You're deciding your own feeling is invalid by measuring it against some imaginary average person who 'wouldn't be bothered.' But that person isn't in your relationship \u2014 you are. 'Overreacting' is just the word we use to talk ourselves out of a need before anyone else even gets the chance to. Your reaction is information about what matters to you. It doesn't need to be the biggest problem in the world to be worth one honest sentence.",next:"n14"},{id:"n14",type:"reflection",text:"Underneath every complaint is a need. Not 'they always do X' \u2014 but what you're actually longing for. Finish this: 'What I really need here is to feel ___.' One word or two. Respected? Chosen? Trusted? Wanted? Get under the story to the need.",capture:{field:"relationships_real_need",placeholder:"The need under the complaint \u2014 say it plainly."},next:"n15"},{id:"n15",type:"choice",text:"You've named it. Now \u2014 honestly, where are you?",options:[{id:"n15a",label:"I'm ready. I just need to actually open my mouth.",next:"n16"},{id:"n15b",label:"I want to, but I don't know how to start it without it going sideways.",next:"n17"},{id:"n15c",label:"It's heavy \u2014 this has been building for a long time.",next:"n18"}]},{id:"n16",type:"action",text:"Then don't let this be one more rehearsal you felt good about and never used. The distance between the version in your head and the real one closes the second you speak. Keep it to one clean sentence \u2014 a feeling and a need, not a case for the prosecution.",action:{title:"Say one honest sentence this week.",description:"Go to them this week and say one true thing, in this shape: 'When ___ happens, I feel ___, and what I really need is ___.' Use the need you just named. No essay, no list of past crimes, no rehearsed monologue \u2014 just one honest sentence, and then let them respond. Say it while the clarity is still warm.",suggestQuestId:null}},{id:"n17",type:"action",text:"Good \u2014 wanting to start it well is fair, as long as 'preparing' doesn't quietly become another month of not doing it. You don't need the perfect words. You need a door that opens instead of a case that attacks. So open with an invitation, not an accusation.",action:{title:"Ask for the conversation before you have it.",description:"This week, send one low-pressure opener: 'There's something on my mind about us that I've been sitting on. Can we find twenty minutes to talk \u2014 no big deal, I just don't want to keep it in?' That's it. You're not solving it in the text; you're just opening the door so it happens on purpose instead of exploding by accident. Softens the start, keeps you honest.",suggestQuestId:null}},{id:"n18",type:"action",text:"Okay \u2014 when something's been building for a long time, the answer isn't to unload all of it at once and hope they can catch it. It's to shrink the first move until it's actually doable. You don't have to resolve years in one sitting. You have to say one honest thing and start the thaw. And if this one is heavy and tangled \u2014 really weighing on you \u2014 that's worth talking through with someone you trust, or a mental-health professional. You weren't meant to carry the whole of it alone.",action:{title:"Name one small piece out loud.",description:"Pick the single smallest true thing you could say \u2014 not the whole history, just one honest piece: 'I've been feeling distant from you lately, and I miss us.' Say that one line this week. It doesn't fix everything and it isn't supposed to; it just reopens a door that's been shut for a while. If the weight of it is a lot to hold, tell one trusted person what you're carrying before you carry it any further.",suggestQuestId:null}}]};var om={version:1,questions:[{id:"q1",text:"What is one work decision you keep telling yourself you'll make 'later,' and what does 'later' actually protect you from right now?",topics:["career"],patternTags:["avoidance"],weight:2},{id:"q2",text:"If you knew the next thing you tried at work would fail, but no one would ever find out, what would you attempt?",topics:["career"],patternTags:["fear_of_failure"],weight:2},{id:"q3",text:"Whose career are you quietly measuring yours against, and what do you think their life actually costs them that you can't see?",topics:["career"],patternTags:["comparison"],weight:2},{id:"q4",text:"When you imagine yourself five years into this line of work, what part of that picture makes you uneasy?",topics:["career"],patternTags:[],weight:1},{id:"q5",text:"What piece of work are you holding back because it isn't 'ready,' and who is waiting on it while you keep polishing?",topics:["career"],patternTags:["perfectionism"],weight:2},{id:"q6",text:"What at work would you have to trust someone else with in order to grow, and what are you afraid they'd do differently?",topics:["career"],patternTags:["need_for_control"],weight:2},{id:"q7",text:"You've called this job either your dream or a dead end. What's the more honest, in-between version of it?",topics:["career"],patternTags:["black_and_white"],weight:1},{id:"q8",text:"Think of a recent 'yes' you gave someone. If you're honest, what were you really afraid would happen if you'd said no?",topics:["relationships"],patternTags:["people_pleasing"],weight:3},{id:"q9",text:"Which conversation have you been putting off, and what do you imagine the silence is costing the other person?",topics:["relationships"],patternTags:["avoidance"],weight:2},{id:"q10",text:"Where in a relationship are you managing someone else's feelings that aren't actually yours to manage?",topics:["relationships"],patternTags:["need_for_control"],weight:2},{id:"q11",text:"When was the last time someone truly saw you, and what did they notice that you rarely let people see?",topics:["relationships"],patternTags:[],weight:1},{id:"q12",text:"After a hard conversation, what's the story you tell yourself about your part in it, and how much of that story is actually fair?",topics:["relationships"],patternTags:["self_criticism"],weight:2},{id:"q13",text:"You've decided this person is either with you or against you. What evidence are you leaving out to keep it that clean?",topics:["relationships"],patternTags:["black_and_white"],weight:1},{id:"q14",text:"What conversation do you keep replaying, and what are you hoping to find in it the hundredth time that wasn't there the first?",topics:["relationships"],patternTags:["rumination"],weight:2},{id:"q15",text:"What's the small daily thing you keep avoiding, and what feeling shows up in the moment right before you turn away from it?",topics:["habits"],patternTags:["avoidance"],weight:2},{id:"q16",text:"Which habit have you abandoned because you couldn't do it 'properly,' and what would 'good enough' have looked like instead?",topics:["habits"],patternTags:["perfectionism"],weight:1},{id:"q17",text:"When you miss one day of something you're building, what do you tell yourself the whole streak now means?",topics:["habits"],patternTags:["black_and_white"],weight:2},{id:"q18",text:"Which of your routines are you keeping out of genuine choice, and which are just momentum you never stopped to question?",topics:["habits"],patternTags:[],weight:1},{id:"q19",text:"When you slip on a habit, whose voice is it that criticizes you, and would you ever speak that way to someone you love?",topics:["habits"],patternTags:["self_criticism"],weight:3},{id:"q20",text:"What are you trying to hold together through your routines, and what happens inside you when one of them breaks?",topics:["habits"],patternTags:["need_for_control"],weight:2},{id:"q21",text:"You've committed to changing several things at once. Which one actually matters most, and which are you adding to avoid facing that one?",topics:["habits"],patternTags:["overcommitment"],weight:2},{id:"q22",text:"Look at everything you've said yes to this month. Which of these did you take on to feel needed rather than because it was yours to carry?",topics:["burnout"],patternTags:["overcommitment"],weight:3},{id:"q23",text:"Whose approval are you running on empty to keep, and what would it cost you to disappoint them just once?",topics:["burnout"],patternTags:["people_pleasing"],weight:2},{id:"q24",text:"What standard are you holding yourself to right now that no one else asked for, and who taught you it wasn't safe to lower it?",topics:["burnout"],patternTags:["perfectionism"],weight:3},{id:"q25",text:"When did you last rest without earning it first, and what makes rest feel like something you have to deserve?",topics:["burnout"],patternTags:[],weight:2},{id:"q26",text:"What would you have to let go badly for a while in order to stop running yourself into the ground?",topics:["burnout"],patternTags:["need_for_control"],weight:2},{id:"q27",text:"At night, what unfinished thing keeps looping in your head, and what would it take to set it down until morning?",topics:["burnout"],patternTags:["rumination"],weight:1},{id:"q28",text:"If you had to cut one commitment tomorrow, which would you protect the hardest, and what does that tell you about where your worth is tied up?",topics:["burnout"],patternTags:["overcommitment"],weight:3},{id:"q29",text:"What goal have you stopped talking about because it started to feel real, and what does that quiet tell you?",topics:["motivation"],patternTags:["avoidance"],weight:2},{id:"q30",text:"What would you begin this week if you fully accepted that you might be bad at it at first?",topics:["motivation"],patternTags:["fear_of_failure"],weight:2},{id:"q31",text:"Whose progress makes you feel behind, and what race did you agree to run that no one actually entered you in?",topics:["motivation"],patternTags:["comparison"],weight:2},{id:"q32",text:"Think back to the last time you felt genuinely driven. What was present then that's missing now?",topics:["motivation"],patternTags:[],weight:1},{id:"q33",text:"What plan are you endlessly refining instead of starting, and what would a rough first attempt actually risk?",topics:["motivation"],patternTags:["perfectionism"],weight:2},{id:"q34",text:"When your motivation dips, what do you conclude about yourself, and is that a fact or just a well-worn habit of thought?",topics:["motivation"],patternTags:["self_criticism"],weight:2},{id:"q35",text:"You've decided you're either 'on' or 'off,' disciplined or lazy. What does the messy middle of a real week actually look like for you?",topics:["motivation"],patternTags:["black_and_white"],weight:1},{id:"q36",text:"What's the harshest thing you've called yourself this week, and would you accept anyone else describing you that way?",topics:["self_worth"],patternTags:["self_criticism"],weight:3},{id:"q37",text:"Whose highlight reel are you comparing your behind-the-scenes to, and what would shift if you stopped?",topics:["self_worth"],patternTags:["comparison"],weight:2},{id:"q38",text:"How much of what you did today was for you, and how much was to be seen as good by someone else?",topics:["self_worth"],patternTags:["people_pleasing"],weight:2},{id:"q39",text:"If your worth had nothing to do with what you produce, what would you do differently tomorrow?",topics:["self_worth"],patternTags:[],weight:3},{id:"q40",text:"What would you stop apologizing for if you believed failing at it wouldn't make you any less worthy?",topics:["self_worth"],patternTags:["fear_of_failure"],weight:2},{id:"q41",text:"What old moment do you keep returning to as proof of something bad about you, and who decided it meant that?",topics:["self_worth"],patternTags:["rumination"],weight:2},{id:"q42",text:"At work, when you feel 'not enough,' whose standard are you failing \u2014 theirs, or one you inherited and never chose?",topics:["self_worth","career"],patternTags:["comparison"],weight:2},{id:"q43",text:"What's the first tiny step of the thing you keep meaning to start, and what makes even that step feel too big to take?",topics:["motivation","habits"],patternTags:["avoidance"],weight:2},{id:"q44",text:"Whose expectations shaped the path you're on, and what would you choose if their opinion genuinely didn't factor in?",topics:["career","relationships"],patternTags:[],weight:2},{id:"q45",text:"Who in your life gets your best energy, and who gets whatever's left, and how did you decide that order?",topics:["burnout","relationships"],patternTags:["people_pleasing"],weight:2},{id:"q46",text:"When you 'fall off,' do you rebuild slowly or wait to start over 'properly on Monday' \u2014 and where does that leave the days in between?",topics:["habits","motivation"],patternTags:["black_and_white"],weight:1},{id:"q47",text:"When someone gives you a compliment, what do you actually do with it, and what would it mean to just let it land?",topics:["self_worth","relationships"],patternTags:["self_criticism"],weight:2},{id:"q48",text:"What are you proving by staying the busiest person in the room, and who exactly are you proving it to?",topics:["career","burnout"],patternTags:["overcommitment"],weight:3},{id:"q49",text:"Where are you keeping the peace at the cost of telling the truth, and what does that peace actually preserve?",topics:["relationships","self_worth"],patternTags:["people_pleasing"],weight:3},{id:"q50",text:"What ambition have you quietly shrunk to a 'realistic' size so it couldn't hurt you if it didn't work out?",topics:["motivation","career"],patternTags:["fear_of_failure"],weight:2},{id:"q51",text:"Which of your daily habits genuinely restore you, and which just help you numb until tomorrow?",topics:["habits","burnout"],patternTags:[],weight:2},{id:"q52",text:"What would you attempt if you trusted that your value wouldn't rise or fall with the result?",topics:["self_worth","motivation"],patternTags:[],weight:2},{id:"q53",text:"If money were handled for the next year, what work would you still want to do, and what does that answer point to?",topics:["career"],patternTags:[],weight:1},{id:"q54",text:"Where do you try to run other people's routines or choices, and what fear sits underneath needing them to do it your way?",topics:["relationships","habits"],patternTags:["need_for_control"],weight:2},{id:"q55",text:"When you finally have a free hour, where does your mind go \u2014 to rest, or straight back to the thing you couldn't resolve?",topics:["burnout","motivation"],patternTags:["rumination"],weight:2},{id:"q56",text:"What would you have to believe about yourself to let a piece of work be 'done' rather than perfect?",topics:["self_worth"],patternTags:["perfectionism"],weight:2},{id:"q57",text:"Who have you been slowly pulling away from, and what would you have to feel if you moved back toward them?",topics:["relationships"],patternTags:["avoidance"],weight:2},{id:"q58",text:"When you see how someone else seems to live, what do you assume about their discipline, and what might that assumption be costing you?",topics:["habits","self_worth"],patternTags:["comparison"],weight:1},{id:"q59",text:"What part of your work makes you lose track of time, and how much of your actual week contains any of it?",topics:["career","motivation"],patternTags:[],weight:1},{id:"q60",text:"If your body could speak plainly right now, what do you think it's been trying to tell you that you keep overriding?",topics:["burnout"],patternTags:[],weight:2}]};var im={version:1,frameworkNote:"These thinking patterns are drawn from public cognitive behavioral frameworks (Aaron Beck and David Burns). This is educational self-reflection to help you notice your own thoughts, not therapy or any kind of diagnosis.",distortions:[{id:"all_or_nothing",name:"All-or-Nothing Thinking",description:"You see things in absolute, black-and-white terms. If it is not a total success, you count it as a total failure.",example:"I missed one week at the gym, so I have completely blown my whole fitness plan.",reframePrompts:["Where on the scale from 0 to 100 does this actually sit, if you are honest?","What would you tell a friend who described this exact situation to you?","Is 'ruined' really true, or did one part go worse than you wanted?"],reframeTemplate:"It is not all-or-nothing. The part that did not go well was ______, and the parts that still stand are ______. A more accurate line is: this was partly hard and partly fine, and I can pick it back up from here.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"overgeneralization",name:"Overgeneralization",description:"You treat a single event as a never-ending pattern, often using words like 'always' or 'never'.",example:"I got turned down for that role. I never get chosen for anything.",reframePrompts:["Is this one event, or a genuine pattern with several examples?","Can you name even one time the opposite was true?","What are the specific facts here, without the words 'always' or 'never'?"],reframeTemplate:"One thing happened: ______. That is a single event, not a rule about my whole life. A time it went differently was ______, which tells me this is not 'always'.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"mental_filter",name:"Mental Filter",description:"You lock onto one negative detail and let it color everything, filtering out the rest of the picture.",example:"One person gave critical feedback in the meeting, so the whole presentation was a disaster.",reframePrompts:["What are you leaving out of the frame right now?","If you listed everything that happened, how much of it was actually negative?","What would the full picture look like, not just the one detail?"],reframeTemplate:"I have been staring at ______ and letting it stand in for everything. Widening the lens, what else was true is ______. The one hard detail is real, and it is not the whole story.",citation:"Beck, A. T. (1979). Cognitive Therapy of Depression."},{id:"discounting_positive",name:"Discounting the Positive",description:"You dismiss good things as if they do not count, insisting they were luck, easy, or expected.",example:"They only praised my work to be polite. It was not really that good.",reframePrompts:["Why does this good thing 'not count' when a bad thing would?","If a peer had done this, would you brush it off the same way?","What are you doing to earn the good outcome that you are refusing to credit?"],reframeTemplate:"I am tempted to wave this away as ______, but the honest version is: I did ______, and that counts. Letting the good news land does not make me arrogant, it makes me accurate.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"jumping_to_conclusions",name:"Jumping to Conclusions",description:"You decide you know what will happen or what someone thinks, with no real evidence, then treat the guess as fact.",example:"She has not texted back, so she must be annoyed with me.",reframePrompts:["What is the actual evidence, versus the story you are filling in?","What are two other explanations that would also fit the facts?","Are you predicting the future or reading a mind here?"],reframeTemplate:"I am treating a guess as a fact. The evidence I actually have is ______. An equally likely explanation is ______. Until I know more, I can hold this as a maybe, not a verdict.",citation:"Beck, A. T. (1979). Cognitive Therapy of Depression."},{id:"magnification",name:"Magnification (Catastrophizing)",description:"You blow the importance of a problem out of proportion, or shrink things down until they seem trivial.",example:"If I mess up this one email, my whole reputation is finished.",reframePrompts:["How much will this actually matter in a week? In a year?","What is the realistic worst case, and could you handle it if it happened?","Are you sizing this by the facts, or by how anxious you feel right now?"],reframeTemplate:"Right now this feels enormous: ______. Sized realistically, the likely outcome is ______, and even the worst case I could handle by ______. It is a real problem, not a catastrophe.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"emotional_reasoning",name:"Emotional Reasoning",description:"You take how you feel as proof of how things are. If you feel it, you assume it must be true.",example:"I feel like a fraud, so I must actually be one.",reframePrompts:["Is this a feeling, or a fact? They are not the same thing.","What would the evidence say if you set the feeling aside for a moment?","Have you felt this way before about something that turned out fine?"],reframeTemplate:"I feel ______, and that feeling is real. But a feeling is not evidence. The facts on the ground say ______. I can feel this way and still act on what is actually true.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"should_statements",name:"Should Statements",description:"You beat yourself or others with rigid rules about how things ought to be, and feel guilt, pressure, or resentment when reality does not comply.",example:"I should be further along by now. I should never need help.",reframePrompts:["Whose rule is this, and is it one you would actually choose?","What happens to how you feel when you swap 'should' for 'I would like to'?","Is this standard fair, or one you would never hold anyone else to?"],reframeTemplate:"The rule running me is: I should ______. Restated as a preference: I would like to ______, and it is okay that I am not there yet. Dropping the whip does not drop the goal.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"labeling",name:"Labeling",description:"You pin a harsh, fixed label on yourself or someone else based on one action, instead of describing the specific behavior.",example:"I forgot the deadline. I am such a loser.",reframePrompts:["Are you describing what you did, or slapping a label on who you are?","Would you call a friend that word for the same mistake?","What specific behavior are you actually talking about?"],reframeTemplate:"The label I reached for was '______'. The accurate, specific version is: I did ______, once, in this situation. A mistake is something I made, not a name for who I am.",citation:"Burns, D. D. (1980). Feeling Good: The New Mood Therapy."},{id:"personalization",name:"Personalization",description:"You take responsibility for things that were not fully in your control, treating yourself as the cause of events that had many.",example:"The team missed the target, and it is entirely my fault.",reframePrompts:["What other factors and people shaped this outcome besides you?","What share of this was genuinely yours, honestly, as a percentage?","Are you confusing 'I was involved' with 'I caused all of it'?"],reframeTemplate:"I am carrying all of this as if it were mine alone. Realistically, my part was ______, and other factors were ______. I can own my share and put down the rest that was never mine to hold.",citation:"Beck, A. T. (1979). Cognitive Therapy of Depression."}]};var am={version:1,quests:[{id:"quest_two_minute_start",title:"The two-minute start",description:"Pick the task you've been circling and work on it for exactly two minutes, then stop. Starting is the whole job today; finishing is not required.",cadence:"once",linkedValues:["growth"],linkedPatterns:["avoidance"],topics:["habits","motivation"],estMinutes:2,encouragement:"You started, and starting was the hard part. That counts even if you didn't get far."},{id:"quest_good_enough_send",title:"Send it at 80 percent",description:"Take one message, email, or piece of work you keep polishing and send it while it's still 'good enough.' Notice what you were afraid would happen.",cadence:"once",linkedValues:["growth","autonomy"],linkedPatterns:["perfectionism","fear_of_failure"],topics:["career","habits"],estMinutes:10,encouragement:"Done and out in the world beats perfect and hidden. You let something be enough today."},{id:"quest_one_honest_no",title:"One honest no",description:"Say no to one small request you'd normally accept out of habit. No long apology, no over-explaining. A simple 'I can't take that on' is a full answer.",cadence:"once",linkedValues:["autonomy","integrity"],linkedPatterns:["people_pleasing","overcommitment"],topics:["relationships","burnout"],estMinutes:5,encouragement:"Turning something down isn't letting anyone down. You protected your yes by using your no."},{id:"quest_name_the_win",title:"Name one real win",description:"Write down one thing you handled today, however ordinary. Then read it back as if a friend had done it, and notice the gap in how you'd judge them.",cadence:"daily",linkedValues:["growth"],linkedPatterns:["self_criticism"],topics:["self_worth","motivation"],estMinutes:3,encouragement:"Missed a day? No harm done. The wins were still real, whether or not you wrote them down."},{id:"quest_worry_window",title:"A window for the worry",description:"When a thought starts looping, jot it on a note and tell yourself you'll think it through at a set time later. Then return to what you were doing.",cadence:"daily",linkedValues:["health"],linkedPatterns:["rumination"],topics:["burnout","self_worth"],estMinutes:5,encouragement:"Parking a thought isn't ignoring it. You gave your mind a break, and that's a skill, not avoidance."},{id:"quest_shrink_the_list",title:"Cut the list to three",description:"Look at today's to-do list and mark only the three things that actually matter. The rest can wait, move, or disappear. Choose on purpose.",cadence:"daily",linkedValues:["autonomy","health"],linkedPatterns:["overcommitment","need_for_control"],topics:["burnout","career"],estMinutes:5,encouragement:"Three real things beats twelve half-things. Fewer isn't lazy; it's honest about a day's size."},{id:"quest_reach_out_first",title:"Reach out first",description:"Message one person you've been meaning to talk to. No agenda, no waiting for the perfect words. 'Been thinking of you, how are you?' is plenty.",cadence:"once",linkedValues:["connection"],linkedPatterns:["avoidance"],topics:["relationships"],estMinutes:5,encouragement:"You closed a small distance today. Whatever they reply, reaching out was the part that was yours to do."},{id:"quest_ask_for_help",title:"Ask for one thing",description:"Ask someone for help with one task you'd usually white-knuckle alone. Notice that needing help isn't the same as being a burden.",cadence:"once",linkedValues:["connection","security"],linkedPatterns:["people_pleasing","need_for_control"],topics:["relationships","burnout"],estMinutes:10,encouragement:"Asking took nerve. Letting someone show up for you is how connection actually works."},{id:"quest_five_minute_move",title:"Five minutes of moving",description:"Move your body for five minutes in any way that doesn't feel like punishment. A walk, a stretch, stairs. The point is showing up, not the burn.",cadence:"daily",linkedValues:["health"],linkedPatterns:["black_and_white"],topics:["habits","burnout"],estMinutes:5,encouragement:"Five minutes is a real thing, not a failed workout. Something gentle beats an all-or-nothing plan you skip."},{id:"quest_reframe_one_thought",title:"Reframe one harsh thought",description:"Catch one thing you told yourself today that started with 'I always' or 'I never.' Write it down, then ask what a fairer, more exact version would be.",cadence:"daily",linkedValues:["growth"],linkedPatterns:["self_criticism","black_and_white"],topics:["self_worth","motivation"],estMinutes:7,encouragement:"Questioning a harsh thought isn't lying to yourself; it's aiming for accurate. One at a time is exactly right."},{id:"quest_one_small_choice",title:"One choice, just for you",description:"Make one small decision today based only on what you want, not what someone else would prefer. Where to eat, what to watch, how to spend an hour.",cadence:"once",linkedValues:["autonomy","integrity"],linkedPatterns:["people_pleasing"],topics:["self_worth","relationships"],estMinutes:3,encouragement:"You listened to your own preference today. That muscle gets stronger every time you use it, no pressure to be big."},{id:"quest_close_the_loop",title:"Finish one open loop",description:"Pick one lingering little task you keep half-doing and take it fully to done. Reply, cancel, book, throw out. Feel the quiet of one loop closed.",cadence:"weekly",linkedValues:["growth","security"],linkedPatterns:["avoidance","perfectionism"],topics:["habits","career"],estMinutes:15,encouragement:"One loop closed is real relief, not a drop in a bucket. The open ones will still be there when you're ready."}]};var sm={version:1,prompts:[{id:"jp1",text:"Write down the last thing you told yourself you 'should' be doing but aren't. Now drop the word 'should' and ask honestly: do you actually want this, or did you inherit it from someone else? Get specific about whose voice it is.",topics:["motivation"],patternTags:["self_criticism"],weight:3},{id:"jp2",text:"There's a work decision you keep circling but not making. Name it plainly. Then finish this sentence three times without editing: 'I haven't decided because...' The third answer is usually the honest one.",topics:["career"],patternTags:["avoidance"],weight:3},{id:"jp3",text:"Think of a recent moment you said yes when your gut said no. What were you afraid would happen if you'd been honest? Write the actual feared outcome, then ask whether it has ever really happened.",topics:["relationships"],patternTags:["people_pleasing"],weight:3},{id:"jp4",text:"You've broken a habit streak and been tempted to scrap the whole thing. Describe the exact moment it slipped. What's the smallest version of this habit you could not fail at tomorrow? Design for the bad day, not the good one.",topics:["habits"],patternTags:["perfectionism","black_and_white"],weight:2},{id:"jp5",text:"List everything currently sitting on your plate. Circle the three things that are genuinely yours to carry. Be honest about who handed you the rest, and why you took it. What would it cost to hand one back this week?",topics:["burnout"],patternTags:["overcommitment"],weight:3},{id:"jp6",text:"Whose life did you measure yourself against most recently? Write what you actually know about their day-to-day versus what you assumed. You're comparing your inside to their outside. What does that comparison cost you?",topics:["self_worth"],patternTags:["comparison"],weight:3},{id:"jp7",text:"There's something you want but keep 'not being ready' for. Name it. Then write the real sentence underneath 'not ready': is it 'I might fail,' 'I might look foolish,' or 'I might actually have to try'? Say which one.",topics:["motivation"],patternTags:["avoidance","fear_of_failure"],weight:2},{id:"jp8",text:"Picture a colleague or peer whose success stings a little. Underneath the sting, what are they doing that you wish you were doing? That envy is a compass. Where is it pointing, and what would it take to start walking there?",topics:["career"],patternTags:["comparison"],weight:2},{id:"jp9",text:"Recall a time you jumped in to manage how something would turn out because you didn't trust it to go well on its own. What were you protecting against? What did your grip cost the other person, and you?",topics:["relationships"],patternTags:["need_for_control"],weight:2},{id:"jp10",text:"You told yourself you 'always' quit or 'never' follow through. Find one counterexample from your own life, however small. Now write the more accurate sentence, the one with actual numbers instead of 'always' and 'never'.",topics:["habits"],patternTags:["black_and_white"],weight:2},{id:"jp11",text:"Think about the last time you were exhausted but kept going for someone else's sake. Whose approval were you buying with that effort? Write what you were afraid they'd think if you'd stopped. Would you ask a tired friend to keep going like that?",topics:["burnout"],patternTags:["people_pleasing"],weight:2},{id:"jp12",text:"Write down the harshest thing you said to yourself this week, word for word. Now read it as if a friend said it to you. Would you keep that friend? Rewrite the line as something true but not cruel.",topics:["self_worth"],patternTags:["self_criticism"],weight:3},{id:"jp13",text:"You've been replaying a conversation or mistake on a loop. Write it out once, fully, then answer: what is the loop trying to solve? If there's an action, name it. If there isn't, the replaying is a habit, not a solution.",topics:["motivation"],patternTags:["rumination"],weight:2},{id:"jp14",text:"Describe a career risk you've talked yourself out of. Now write the actual worst case, in concrete detail, and next to it write how you'd survive it. Fear shrinks when it has to be specific instead of just loud.",topics:["career"],patternTags:["fear_of_failure"],weight:3},{id:"jp15",text:"There's a conversation you've been avoiding with someone who matters. Write the first sentence you'd actually say if you weren't managing their reaction. What are you protecting by staying quiet, and is it worth the distance it's creating?",topics:["relationships"],patternTags:["avoidance"],weight:3},{id:"jp16",text:"Name a habit you keep 'starting Monday'. What does Monday-you believe today-you can't handle? Write one thing you could do in the next ten minutes that today-you actually can do. Momentum doesn't wait for a fresh week.",topics:["habits"],patternTags:["avoidance"],weight:2},{id:"jp17",text:"When did you last feel resentful about something you'd agreed to? Resentment is often a boundary you skipped. Write where the line should have been, and what you'll say differently next time you're asked.",topics:["burnout"],patternTags:["overcommitment","people_pleasing"],weight:3},{id:"jp18",text:"You've decided something about yourself based on one bad outcome. Write the story you've built, then the single event underneath it. Is the whole story really carried by that one moment? What would a fairer verdict sound like?",topics:["self_worth"],patternTags:["comparison","rumination"],weight:2},{id:"jp19",text:"You've framed something as 'do it perfectly or don't bother'. Name it. What would 'good enough to be useful' look like here? Write the version you'd actually finish, not the version you'd only ever admire.",topics:["motivation"],patternTags:["black_and_white","perfectionism"],weight:2},{id:"jp20",text:"Think of a piece of work you're holding back because it isn't ready. Who set the standard you're failing to meet, and did they ever actually state it? Write what 'finished' means to you, then ship a version toward it.",topics:["career"],patternTags:["perfectionism"],weight:2},{id:"jp21",text:"Recall a time you apologized for something that wasn't yours to carry. Why did you reach for the apology? Write what you actually wanted to say instead. Practice it here where it's safe.",topics:["relationships"],patternTags:["people_pleasing","self_criticism"],weight:2},{id:"jp22",text:"You slipped on something you were building and called yourself lazy or weak. Set the label aside. Describe what actually happened, hour by hour, on the day it fell apart. What was really in the way, and what would remove it?",topics:["habits"],patternTags:["self_criticism"],weight:2},{id:"jp23",text:"Write about a moment you were running on empty but couldn't let go of the reins. What did you believe would fall apart if you rested? Test it: what actually happens if you let one thing be imperfect this week?",topics:["burnout"],patternTags:["need_for_control"],weight:2},{id:"jp24",text:"Finish this sentence honestly: 'I would like myself more if I...' Now ask the harder question underneath it. Is that condition actually true, or is it a rule you never agreed to but keep enforcing?",topics:["self_worth"],patternTags:[],weight:3},{id:"jp25",text:"Think back to the last time you felt genuinely energized, not just relieved to be done. What were you doing, who were you with, and what did it ask of you? Write one small way to bring more of that into next week.",topics:["motivation"],patternTags:[],weight:2},{id:"jp26",text:"Describe Welcome to Compass. Take a moment to read this \u2014 it matters.

Compass is a self-reflection and coaching tool. It's here to help you think more clearly, notice your patterns, and move toward what matters to you. That's it. That's the whole job.

## What Compass Is Not

Compass is **not** therapy, and it is **not** medical or mental-health care. It is not a substitute for professional help of any kind. It does not diagnose anything, and it does not treat anything. There is no one on the other side of the screen \u2014 Compass offers curated prompts and reflections, not personalized care.

Think of it as a well-designed mirror and a pushy-but-caring notebook. Useful for reflection. Not a replacement for a real relationship with a qualified professional.

## When to Reach Out to Someone

Reflection has limits, and honesty about those limits is part of taking yourself seriously.

If something in your life feels heavier than a journaling prompt can hold \u2014 if you're struggling in a way that keeps coming back, or affecting your sleep, work, or relationships \u2014 please talk to a qualified mental-health professional. Reaching out is a strength, not a failure. You can also lean on the people you trust: a friend, a family member, a doctor, someone who knows you.

**If you are in crisis or worried about your safety or anyone else's, contact your local emergency services or a crisis line in your area right now.** Compass is not built for emergencies, and you deserve real, immediate support from a person who can help.

## Your Data Stays With You

Everything you write and reflect on in Compass stays on your device. Your thoughts are yours.

## Ready?

Use Compass as a place to be honest with yourself \u2014 and let it point you toward the real people and support that can carry what an app cannot.

_Last updated: placeholder date_

Compass is built around a simple promise: your reflections belong to you, and they stay on your device. This policy explains, in plain language, what that means in practice.

## The short version

- Everything you create in Compass \u2014 reflections, journal entries, mood check-ins, and answers to prompts \u2014 is stored **only on your device**.
- There is **no account** to create. We never ask for your name, email, or password.
- There is **no backend, no cloud sync, and no third-party analytics SDK**.
- The app **does not transmit your personal content over the network**. Your words never leave your phone unless you deliberately export or share them yourself.

## What we collect

Nothing leaves your device by default. Compass does not send your reflections, entries, moods, or answers to us or to anyone else, because there is no "us" on the other end of a network connection \u2014 there is no server that receives your content.

The only data Compass works with is the content you enter, and it lives in local storage on your device.

## Where your data is stored

All of your content is kept in the app's local storage on your device. It is **encrypted at rest** using the encryption facilities provided by your device's operating system, so that a stored file cannot be casually read outside the app.

Because your data lives only on your device:

- **Uninstalling the app deletes your data.** Removing Compass, or clearing its data through your device settings, erases the local content.
- **There is no server copy.** We do not hold a backup, so there is nothing on a server for us to delete and no server-side deletion request to make. Deleting locally is the whole story.
- **You are in control of exports.** If you choose to export or share an entry, that action is initiated by you and leaves the app under your direction. Once content leaves the app this way, this policy no longer governs it.

## Things outside the app's control

Your device's operating system, app store, and any crash-reporting built into the platform may collect their own diagnostic or crash data according to their own policies. That is a function of the OS and store you use, not of Compass, and it is outside the app's control. Compass itself does not attach your personal content to any such data \u2014 no reflections, entries, moods, or answers are sent by the app.

If Compass ever adds its own telemetry in the future, it will be **strictly opt-in** and **content-free**: it would never include the words you write, and it would be off unless you explicitly turn it on.

## Children and age

Compass is intended for adults and is configured for users **18 and older**. It is not directed at children, and it does not knowingly collect information from children. Because the app stores data only on the device and transmits no personal content, there is no server-side collection of any user's information, regardless of age.

## Questions

Because there is no account and no server, most privacy questions come down to your own device: what you keep, what you export, and what you delete. You remain in control of all of it.

      G.party.makeMon('Swanna', 52, { moves: ['bravebird', 'scald', 'airslash', 'fly_'] }),
    ];
    p.party.forEach((m) => { G.party.ownDex(p, m.species); });
    // fill a few dex 'seen' entries
    ['Krookodile', 'Chandelure', 'Conkeldurr', 'Volcarona', 'Zoroark'].forEach((n) => G.party.seeDex(p, n));
    p.map = 'nuvema'; p.x = 9; p.y = 11; p.dir = 'up';
    return p;
  }

  G.save = { save, load, hasSave, wipe, newAdventure, championStart, KEY };
})();
</script>
<script>/* input.js — unified keyboard + touch input. Movement uses held direction;
 * menus use edge-triggered press events. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  const held = { up: false, down: false, left: false, right: false, a: false, b: false, start: false };
  const dirStack = [];
  const listeners = {};
  let enabled = true;

  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'a', KeyZ: 'a', Enter: 'a', KeyJ: 'a',
    KeyX: 'b', Backspace: 'b', KeyK: 'b',
    Escape: 'start', ShiftLeft: 'start', Tab: 'start',
  };

  function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return () => off(evt, fn); }
  function off(evt, fn) { if (listeners[evt]) listeners[evt] = listeners[evt].filter((f) => f !== fn); }
  function emit(evt, arg) { (listeners[evt] || []).slice().forEach((f) => { try { f(arg); } catch (e) { console.error(e); } }); }

  function press(btn) {
    if (!enabled) return;
    if (held[btn]) return; // ignore key repeat
    held[btn] = true;
    if (btn === 'up' || btn === 'down' || btn === 'left' || btn === 'right') {
      dirStack.push(btn);
    }
    emit('press', btn);
    emit(btn, btn);
  }
  function release(btn) {
    held[btn] = false;
    const i = dirStack.lastIndexOf(btn);
    if (i >= 0) dirStack.splice(i, 1);
    emit('release', btn);
  }

  function currentDir() { return dirStack.length ? dirStack[dirStack.length - 1] : null; }
  function isHeld(btn) { return !!held[btn]; }
  function setEnabled(v) { enabled = v; if (!v) { Object.keys(held).forEach((k) => held[k] = false); dirStack.length = 0; } }

  function init() {
    window.addEventListener('keydown', (e) => {
      const btn = KEYMAP[e.code];
      if (btn) { e.preventDefault(); press(btn); }
    });
    window.addEventListener('keyup', (e) => {
      const btn = KEYMAP[e.code];
      if (btn) { e.preventDefault(); release(btn); }
    });
    window.addEventListener('blur', () => { Object.keys(held).forEach((k) => held[k] = false); dirStack.length = 0; });
  }

  // Bind an on-screen button element to a logical button.
  function bindButton(elm, btn) {
    const down = (e) => { e.preventDefault(); press(btn); elm.classList.add('pressed'); };
    const up = (e) => { if (e) e.preventDefault(); release(btn); elm.classList.remove('pressed'); };
    elm.addEventListener('touchstart', down, { passive: false });
    elm.addEventListener('touchend', up, { passive: false });
    elm.addEventListener('touchcancel', up, { passive: false });
    elm.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);
    elm.addEventListener('mouseleave', up);
  }

  G.input = { on, off, press, release, currentDir, isHeld, setEnabled, init, bindButton };
})();
</script>
<script>/* world.js — the overworld scene: rendering, grid movement, collision,
 * HM field mechanics, wild encounters, NPC interaction, and warps. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const TS = 16, VIEW_W = 16, VIEW_H = 12, MOVE_MS = 140, ENC_RATE = 0.12;
  const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let map = null, busy = false;
  let moving = false, moveT = 0, fromX = 0, fromY = 0, stepFrame = 0, animClock = 0;
  let bump = 0, stepDur = MOVE_MS;
  let dreamSpots = []; // Entree Forest: befriended Dream World Pokémon
  const P = () => G.game.player;

  function enter(mapId, x, y, dir, opts) {
    opts = opts || {};
    map = G.maps.build(mapId);
    const p = P();
    p.map = mapId; if (x != null) p.x = x; if (y != null) p.y = y; if (dir) p.dir = dir;
    moving = false; moveT = 0; busy = false;
    // Surf state based on tile.
    const t = G.maps.tileAt(map, p.x, p.y);
    G.game.surfing = (t.terrain === 'water' || t.terrain === 'waterfall');
    // Track visited towns / heal points.
    if (map.npcs && map.npcs.some((n) => n.type === 'heal')) { if (p.visitedTowns.indexOf(mapId) < 0) p.visitedTowns.push(mapId); p.lastHeal = { map: mapId, x: p.x, y: p.y }; }
    else if (p.visitedTowns.indexOf(mapId) < 0 && (mapId === 'nuvema')) p.visitedTowns.push(mapId);
    applyDefeatedNpcs();
    refreshDreamSpots();
    if (G.audio) G.audio.startMusic(map.music || 'route');
    if (!opts.noSave) G.save.save(p);
    G.game.updateHud && G.game.updateHud();
  }

  function refreshDreamSpots() {
    dreamSpots = (map && map.id === 'entralink' && G.entralink) ? G.entralink.assignSlots(map) : [];
  }
  function dreamSpotAt(x, y) { return dreamSpots.find((s) => s.x === x && s.y === y); }

  function applyDefeatedNpcs() {
    const p = P();
    // Everyone stays — the Elite Four and Champion accept rematches.
    map.activeNpcs = (map.npcs || []).slice();
    (map.npcs || []).forEach((n) => { n.beaten = !!p.flags['beat_' + n.id]; });
  }

  function npcAt(x, y) { return (map.activeNpcs || []).find((n) => n.x === x && n.y === y); }

  // Can the player stand on (x,y) given surf state?
  function passable(x, y) {
    const t = G.maps.tileAt(map, x, y);
    if (npcAt(x, y) || dreamSpotAt(x, y)) return false;
    if (t.terrain === 'water') return G.game.surfing || G.party.hasHM(P(), 'surf');
    if (t.terrain === 'waterfall') return G.game.surfing && G.party.hasHM(P(), 'waterfall');
    if (t.terrain === 'cut' || t.terrain === 'boulder' || t.terrain === 'sign') return false;
    if (t.solid) return false;
    return true;
  }

  function update(dt) {
    if (G.game.scene !== 'world' || !map) return;
    animClock += dt;
    if (moving) {
      moveT += dt / stepDur;
      if (moveT >= 1) { moving = false; moveT = 0; onArrive(); }
      stepFrame = moveT < 0.5 ? 1 : 2;
      return;
    }
    if (bump > 0) bump -= dt;
    if (busy || G.gui.isBusy()) return;
    const dir = G.input.currentDir();
    if (dir) tryStep(dir);
    else stepFrame = 0;
  }

  function tryStep(dir) {
    const p = P(); p.dir = dir;
    const [dx, dy] = DIRV[dir];
    const nx = p.x + dx, ny = p.y + dy;
    const t = G.maps.tileAt(map, nx, ny);
    // Ledge: only hop when moving down onto a ledge.
    if (t.terrain === 'water' && !G.game.surfing) {
      if (G.party.hasHM(p, 'surf')) { startSurfPrompt(nx, ny); return; }
      doBump(); return;
    }
    if (!passable(nx, ny)) { doBump(); return; }
    // begin move (hold B to run)
    stepDur = G.input.isHeld('b') ? Math.round(MOVE_MS * 0.55) : MOVE_MS;
    fromX = p.x; fromY = p.y; p.x = nx; p.y = ny; moving = true; moveT = 0;
  }

  function doBump() { bump = 180; if (G.audio) G.audio.play('bump'); }

  async function startSurfPrompt(nx, ny) {
    busy = true;
    const yes = await G.gui.confirm(null, { title: 'The water is deep and clear. Surf?', yes: 'Surf', no: 'No' });
    if (yes) {
      G.game.surfing = true; if (G.audio) G.audio.play('hm');
      await G.gui.dialogue(['You surfed onto the water!']);
      const p = P(); fromX = p.x; fromY = p.y; p.x = nx; p.y = ny; moving = true; moveT = 0;
    }
    busy = false;
  }

  function onArrive() {
    const p = P();
    const t = G.maps.tileAt(map, p.x, p.y);
    // update surf state
    if (G.game.surfing && t.terrain !== 'water' && t.terrain !== 'waterfall') G.game.surfing = false;
    if (G.audio) G.audio.play('step');
    // Entralink specials: warp pads home, bridges to a friend's world.
    if (map.id === 'entralink') {
      const ch = G.maps.charAt(map, p.x, p.y);
      if (ch === 'v') { busy = true; G.entralink.exitPrompt().then(() => { busy = false; }); return; }
      if (ch === 'b' && (p.x <= 0 || p.x >= map.w - 1)) {
        const backX = p.x <= 0 ? 1 : map.w - 2;
        busy = true;
        G.entralink.bridgePrompt().then(() => { p.x = backX; busy = false; G.save.save(p); });
        return;
      }
      G.save.save(p);
      return; // no warps or wild encounters inside the Entralink
    }
    // warp?
    const w = (map.warps || []).find((w) => w.x === p.x && w.y === p.y);
    if (w) { doWarp(w); return; }
    // a trainer spots you?
    const spotter = trainerSpotting();
    if (spotter) { startSpottedBattle(spotter); return; }
    // encounter?
    const onGrass = t.terrain === 'grass';
    const onWater = t.terrain === 'water' && G.game.surfing;
    if ((onGrass || onWater) && Math.random() < ENC_RATE) { startWildEncounter(onWater ? 'water' : 'grass'); return; }
    // keep walking if still holding a dir
    G.save.save(p);
  }

  // Trainers with line-of-sight challenge you as you cross their gaze.
  function trainerSpotting() {
    const p = P();
    return (map.activeNpcs || []).find((n) => {
      if (n.type !== 'trainer' || p.flags['beat_' + n.id]) return false;
      const sight = n.sight != null ? n.sight : 3;
      const [dx, dy] = DIRV[n.dir] || [0, 1];
      for (let i = 1; i <= sight; i++) {
        const tx = n.x + dx * i, ty = n.y + dy * i;
        if (tx === p.x && ty === p.y) return true;
        if (G.maps.tileAt(map, tx, ty).solid) return false;
        if (npcAt(tx, ty)) return false;
      }
      return false;
    });
  }
  async function startSpottedBattle(npc) {
    busy = true;
    try {
      if (G.audio) G.audio.play('select');
      const p = P();
      npc.dir = p.x > npc.x ? 'right' : p.x < npc.x ? 'left' : p.y > npc.y ? 'down' : 'up';
      p.dir = opp(npc.dir);
      await G.gui.dialogue(['! ' + npc.name + ' spotted you!']);
      await handleTrainer(npc);
    } finally { busy = false; }
  }

  async function doWarp(w) {
    busy = true;
    if (G.audio) G.audio.play('warp');
    await G.gui.fade('out', 260);
    enter(w.to, w.tx, w.ty, w.tdir, { noSave: false });
    await G.gui.fade('in', 260);
    busy = false;
  }

  // ---- wild encounter ----
  function pickEncounter(kind) {
    const table = (map.encounters && map.encounters[kind]) || null;
    if (!table || !table.length) return null;
    const total = table.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    for (const en of table) { if ((r -= en.weight) < 0) { const lv = en.min + Math.floor(Math.random() * (en.max - en.min + 1)); return G.party.makeMon(en.species, lv); } }
    return null;
  }
  async function startWildEncounter(kind) {
    const foe = pickEncounter(kind); if (!foe) return;
    busy = true;
    G.party.seeDex(P(), foe.species);
    const res = await G.game.startBattle({ kind: 'wild', foeParty: [foe] });
    afterBattle(res);
    busy = false;
  }

  // ---- interaction (A button) ----
  async function interact() {
    if (!map || moving || busy || G.gui.isBusy() || G.game.scene !== 'world') return;
    const p = P();
    const [dx, dy] = DIRV[p.dir];
    const fx = p.x + dx, fy = p.y + dy;
    const npc = npcAt(fx, fy);
    if (npc) { npc.dir = opp(p.dir); return interactNpc(npc); }
    const spot = dreamSpotAt(fx, fy);
    if (spot) { busy = true; return G.entralink.encounterDream(spot).finally(() => { busy = false; }); }
    const t = G.maps.tileAt(map, fx, fy);
    if (t.terrain === 'entree') { busy = true; return G.entralink.gameSyncMenu().finally(() => { busy = false; }); }
    if (t.terrain === 'sign') { const s = (map.signs || []).find((s) => s.x === fx && s.y === fy); if (s) return G.gui.dialogue(s.text.split('\n')); return; }
    if (t.terrain === 'cut') {
      if (G.party.hasHM(p, 'cut')) { busy = true; if (G.audio) G.audio.play('hm'); await G.gui.dialogue(['You used Cut!']); G.maps.setChar(map, fx, fy, '.'); busy = false; }
      else await G.gui.dialogue(['A slim tree blocks the way. It looks like Cut could clear it.']);
      return;
    }
    if (t.terrain === 'boulder') {
      if (G.party.hasHM(p, 'strength')) { busy = true; if (G.audio) G.audio.play('hm'); await G.gui.dialogue(['You used Strength! The boulder rolled away!']); G.maps.setChar(map, fx, fy, '.'); busy = false; }
      else await G.gui.dialogue(['A huge boulder. It won\'t budge without Strength.']);
      return;
    }
    if (t.terrain === 'water' && !G.game.surfing && G.party.hasHM(p, 'surf')) { return startSurfPrompt(fx, fy); }
  }
  function opp(d) { return { up: 'down', down: 'up', left: 'right', right: 'left' }[d]; }

  async function interactNpc(npc) {
    busy = true;
    try {
      if (npc.type === 'talk') { await G.gui.dialogue(npc.lines, { speaker: npc.name }); }
      else if (npc.type === 'heal') { await G.gui.dialogue(npc.lines || ['Let me heal your Pokémon.'], { speaker: npc.name }); G.party.healParty(P().party); if (G.audio) G.audio.play('heal'); await G.gui.dialogue(['Your Pokémon are full of energy!'], { speaker: npc.name }); G.game.updateHud && G.game.updateHud(); G.save.save(P()); }
      else if (npc.type === 'shop') { await G.menu.openShop(npc); }
      else if (npc.type === 'starter') { await handleStarter(npc); }
      else if (npc.type === 'giver') { await handleGiver(npc); }
      else if (npc.type === 'trainer' || npc.type === 'leader' || npc.type === 'e4' || npc.type === 'champion') { await handleTrainer(npc); }
    } finally { busy = false; }
  }

  async function handleStarter(npc) {
    const p = P();
    if (p.party.length > 0) { await G.gui.dialogue(['Look after your partner, ' + p.name + '!'], { speaker: npc.name }); return; }
    await G.gui.dialogue(['Hello, ' + p.name + '! Ready to choose your first partner?', 'Snivy the Grass type, Tepig the Fire type, or Oshawott the Water type?'], { speaker: npc.name });
    const choice = await G.gui.choice([
      { label: '🌱 Snivy (Grass)', value: 'Snivy' },
      { label: '🔥 Tepig (Fire)', value: 'Tepig' },
      { label: '💧 Oshawott (Water)', value: 'Oshawott' },
    ], { title: 'Choose your partner', cancelable: false });
    const mon = G.party.makeMon(choice, 5);
    G.party.addToParty(p, mon);
    G.party.ownDex(p, choice);
    if (G.audio) G.audio.play('select');
    await G.gui.dialogue([choice + ' is with you now!', 'Head north on Route 1 to begin your journey. Good luck!'], { speaker: npc.name });
    G.save.save(p);
    G.game.updateHud && G.game.updateHud();
  }

  async function handleGiver(npc) {
    const p = P();
    if (p.flags[npc.flag]) { await G.gui.dialogue(['Hope those come in handy!'], { speaker: npc.name }); return; }
    if (npc.require) {
      const [k, v] = npc.require.split(':');
      const ok = k === 'badge' ? p.badges.indexOf(v) >= 0 : true;
      if (!ok) { await G.gui.dialogue(npc.denyLines || ['Come back later.'], { speaker: npc.name }); return; }
    }
    await G.gui.dialogue(npc.lines, { speaker: npc.name });
    if (npc.give.item) { p.bag[npc.give.item] = (p.bag[npc.give.item] || 0) + (npc.give.n || 1); }
    if (npc.give.hm) { if (p.hms.indexOf(npc.give.hm) < 0) p.hms.push(npc.give.hm); if (G.audio) G.audio.play('hm'); }
    p.flags[npc.flag] = true;
    G.save.save(p);
  }

  async function handleTrainer(npc) {
    const p = P();
    const beaten = p.flags['beat_' + npc.id] || p.flags[npc.id];
    if (beaten && npc.type === 'trainer') { await G.gui.dialogue([npc.postLines ? npc.postLines[0] : 'Great battle earlier!'], { speaker: npc.name }); return; }
    if (beaten && npc.type === 'leader') { await G.gui.dialogue(['Your bond keeps growing. Well done!'], { speaker: npc.name }); return; }
    if (beaten && (npc.type === 'e4' || npc.type === 'champion')) {
      const again = await G.gui.confirm(null, { title: npc.name + ': "Back for a rematch?"', yes: 'Battle!', no: 'Not now' });
      if (!again) return;
    } else {
      await G.gui.dialogue(npc.preLines || npc.lines || ['Let\'s battle!'], { speaker: npc.name });
    }
    const foeParty = npc.team.map(([s, l]) => G.party.makeMon(s, l));
    const res = await G.game.startBattle({ kind: 'trainer', foeParty, foeName: npc.name });
    if (res.result === 'win') {
      p.flags['beat_' + npc.id] = true;
      p.money += npc.money || 0;
      if (G.audio) G.audio.play('coin');
      await G.gui.dialogue((npc.winLines || ['You won!']).concat(['You received ¥' + (npc.money || 0) + '!']), { speaker: npc.name });
      if (npc.type === 'leader') {
        if (p.badges.indexOf(npc.badge) < 0) p.badges.push(npc.badge);
        if (npc.hm && p.hms.indexOf(npc.hm) < 0) p.hms.push(npc.hm);
        if (G.audio) G.audio.play('win');
      }
      if (npc.type === 'e4' || npc.type === 'champion') {
        const firstWin = !p.flags[npc.id];
        p.flags[npc.id] = true;
        if (npc.type === 'champion') {
          p.champion = true; p.flags.champion = true;
          if (G.audio) G.audio.play('win');
          if (firstWin) await championEnding();
          else await G.gui.dialogue(['Still the strongest bond in Unova. Magnificent!'], { speaker: npc.name });
        }
        applyDefeatedNpcs();
      }
      G.game.updateHud && G.game.updateHud();
      G.save.save(p);
    } else {
      afterBattle(res);
    }
  }

  async function championEnding() {
    await G.gui.fade('out', 700);
    await G.gui.dialogue(['🎉  You are the Champion of Unova!  🎉', 'Your dream came true. Now visit the Entralink (press START) to enter the Dream World and cross over to other players!']);
    enter('nuvema', 9, 11, 'up');
    await G.gui.fade('in', 500);
  }

  function afterBattle(res) {
    const p = P();
    if (!res) return;
    if (res.result === 'caught' && res.caught) {
      const where = G.party.addToParty(p, res.caught);
      G.gui.toast((res.caught.nickname || res.caught.species) + ' joined your ' + (where === 'party' ? 'party' : 'PC') + '!', { kind: 'good' });
      G.game.updateHud && G.game.updateHud();
    } else if (res.result === 'lose') {
      whiteout();
    }
    G.save.save(p);
  }

  async function whiteout() {
    const p = P();
    await G.gui.dialogue(['You have no Pokémon left to fight...', 'You scurry back to safety.']);
    await G.gui.fade('out', 400);
    G.party.healParty(p.party);
    const h = p.lastHeal || { map: 'nuvema', x: 9, y: 11 };
    enter(h.map, h.x, h.y, 'down');
    await G.gui.fade('in', 400);
    G.game.updateHud && G.game.updateHud();
  }

  async function flyTo(mapId) {
    const target = G.maps.build(mapId);
    const w = (target.warps || [])[0];
    // land the player on the town corridor near a heal spot
    busy = true;
    await G.gui.fade('out', 300);
    const spot = flyLanding(mapId);
    enter(mapId, spot.x, spot.y, 'down');
    await G.gui.fade('in', 300);
    busy = false;
  }
  function flyLanding(mapId) {
    const m = G.maps.build(mapId);
    // stand just below the top corridor
    for (let y = 1; y < m.h; y++) { if (!G.tiles.get(m.grid[y][9]).solid) return { x: 9, y }; }
    return { x: 9, y: 1 };
  }

  // ---- rendering ----
  function render(ctx) {
    if (!map) return;
    const p = P();
    const px = p.x * TS + (moving ? (p.x - fromX) * 0 : 0);
    // interpolate pixel position
    let ppx = p.x * TS, ppy = p.y * TS;
    if (moving) { const t = moveT; ppx = (fromX + (p.x - fromX) * t) * TS; ppy = (fromY + (p.y - fromY) * t) * TS; }
    let camX = Math.round(ppx - VIEW_W * TS / 2 + TS / 2);
    let camY = Math.round(ppy - VIEW_H * TS / 2 + TS / 2);
    camX = Math.max(0, Math.min(camX, map.w * TS - VIEW_W * TS));
    camY = Math.max(0, Math.min(camY, map.h * TS - VIEW_H * TS));
    if (map.w * TS < VIEW_W * TS) camX = (map.w * TS - VIEW_W * TS) / 2;
    if (map.h * TS < VIEW_H * TS) camY = (map.h * TS - VIEW_H * TS) / 2;

    ctx.fillStyle = '#12131a'; ctx.fillRect(0, 0, VIEW_W * TS, VIEW_H * TS);
    const x0 = Math.floor(camX / TS), y0 = Math.floor(camY / TS);
    for (let y = y0 - 1; y <= y0 + VIEW_H + 1; y++) {
      for (let x = x0 - 1; x <= x0 + VIEW_W + 1; x++) {
        const ch = G.maps.charAt(map, x, y);
        const tile = G.tiles.get(ch);
        tile.draw(ctx, x * TS - camX, y * TS - camY, TS, animClock);
      }
    }
    // entities sorted by y
    const ents = [];
    (map.activeNpcs || []).forEach((n) => ents.push({ y: n.y, draw: (c) => G.sprites.drawCharacter(c, n.x * TS - camX, n.y * TS - camY, TS, { dir: n.dir, body: n.body, step: 0 }) }));
    dreamSpots.forEach((s) => ents.push({ y: s.y, draw: (c) => G.sprites.drawMonTile(c, s.dm.speciesId, s.dm.types, s.x * TS - camX, s.y * TS - camY, TS, animClock) }));
    ents.push({ y: p.y + 0.5, draw: (c) => {
      const dx = ppx - camX, dy = ppy - camY;
      if (G.game.surfing) { c.fillStyle = '#4d90d5'; c.beginPath(); c.ellipse(dx + TS / 2, dy + TS * 0.85, TS * 0.42, TS * 0.24, 0, 0, 7); c.fill(); }
      G.sprites.drawCharacter(c, dx, dy, TS, { dir: p.dir, body: p.gender === 'girl' ? '#e05a8a' : '#e05a6b', step: moving ? stepFrame : 0 });
    } });
    ents.sort((a, b) => a.y - b.y).forEach((en) => en.draw(ctx));
  }

  function init() {
    G.input.on('a', () => { if (G.game.scene === 'world') interact(); });
    G.input.on('start', () => { if (G.game.scene === 'world' && !busy && !G.gui.isBusy()) G.menu.openPause(); });
  }

  G.world = { init, enter, update, render, interact, flyTo, refreshDreamSpots, isBusy: () => busy, mapObj: () => map, TS, VIEW_W, VIEW_H };
})();
</script>
<script>/* battlescene.js — battle UI. Drives the battle engine and animates its
 * event stream. Returns a promise resolving to {result, caught, evolves}. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const el = (t, a, k) => G.gui.el(t, a, k);
  const P = () => G.game.player;

  let root, battle, foeSprite, plySprite, foeBar, plyBar, msgBox, resolveFn, evolves;

  function start(cfg) {
    return new Promise((resolve) => {
      resolveFn = resolve; evolves = [];
      battle = G.battle.create({ kind: cfg.kind, playerParty: G.game.player.party, foeParty: cfg.foeParty, foeName: cfg.foeName, money: cfg.money, dreamForest: cfg.dreamForest });
      // Lead with the first non-fainted party member.
      const lead = battle.player.party.findIndex((m) => m.hp > 0);
      if (lead > 0) battle.player.i = lead;
      buildDOM(cfg);
      if (G.audio) G.audio.startMusic(cfg.kind === 'trainer' ? (cfg.foeName && /Champion|Elite/.test(cfg.foeName) ? 'league' : 'battle') : 'battle');
      run(cfg);
    });
  }

  function buildDOM(cfg) {
    root = el('div', { class: 'battle-scene' });
    const field = el('div', { class: 'battle-field' });
    const foeArea = el('div', { class: 'foe-area' });
    foeBar = makeBar('foe');
    foeSprite = el('div', { class: 'foe-sprite' });
    foeArea.appendChild(foeBar.box); foeArea.appendChild(foeSprite);
    const plyArea = el('div', { class: 'ply-area' });
    plyBar = makeBar('ply');
    plySprite = el('div', { class: 'ply-sprite' });
    plyArea.appendChild(plySprite); plyArea.appendChild(plyBar.box);
    field.appendChild(foeArea); field.appendChild(plyArea);
    msgBox = el('div', { class: 'battle-msg' });
    root.appendChild(field); root.appendChild(msgBox);
    const layer = el('div', { class: 'ui-layer battle-layer' }, root);
    layer.id = 'battle-root';
    (document.getElementById('game-ui') || document.body).appendChild(layer);
    setSprite('foe', G.battle.active(battle.foe));
    setSprite('ply', G.battle.active(battle.player));
    updateBar('foe'); updateBar('ply');
  }

  function makeBar(side) {
    const name = el('span', { class: 'b-name' });
    const lv = el('span', { class: 'b-lv' });
    const status = el('span', { class: 'b-status' });
    const fill = el('div', { class: 'b-fill' });
    const bar = el('div', { class: 'b-bar' }, fill);
    const hpText = side === 'ply' ? el('span', { class: 'b-hptext' }) : null;
    const box = el('div', { class: 'battle-bar ' + side }, [
      el('div', { class: 'b-top' }, [name, lv, status]),
      bar, hpText,
    ]);
    return { box, name, lv, status, fill, hpText };
  }

  function setSprite(side, mon) {
    const wrap = side === 'foe' ? foeSprite : plySprite;
    wrap.innerHTML = '';
    const img = G.sprites.monImg(mon, side === 'foe' ? 108 : 128, { className: side, back: side === 'ply' });
    if (mon.shiny) img.classList.add('shiny');
    wrap.appendChild(img);
    if (mon.shiny) wrap.appendChild(el('span', { class: 'b-shiny' }, '✦'));
  }

  function updateBar(side, animateTo) {
    const s = side === 'foe' ? battle.foe : battle.player;
    const mon = G.battle.active(s);
    const bar = side === 'foe' ? foeBar : plyBar;
    bar.name.textContent = G.party.displayName(mon);
    bar.lv.textContent = 'Lv' + mon.level;
    bar.status.textContent = mon.status ? mon.status.toUpperCase() : '';
    bar.status.className = 'b-status' + (mon.status ? ' s-' + mon.status : '');
    const pct = Math.max(0, mon.hp / mon.stats.maxHp) * 100;
    bar.fill.style.width = pct + '%';
    bar.fill.className = 'b-fill ' + (pct > 50 ? 'ok' : pct > 20 ? 'warn' : 'low');
    if (bar.hpText) bar.hpText.textContent = mon.hp + ' / ' + mon.stats.maxHp;
  }

  function animHp(side, targetHp, max) {
    return new Promise((resolve) => {
      const bar = side === 'foe' ? foeBar : plyBar;
      const s = side === 'foe' ? battle.foe : battle.player;
      const mon = G.battle.active(s);
      const start = parseFloat(bar.fill.style.width) || (mon.hp / max * 100);
      const end = Math.max(0, targetHp / max) * 100;
      const dur = 420, t0 = performance.now();
      function frame(t) {
        const k = Math.min(1, (t - t0) / dur);
        const pct = start + (end - start) * k;
        bar.fill.style.width = pct + '%';
        bar.fill.className = 'b-fill ' + (pct > 50 ? 'ok' : pct > 20 ? 'warn' : 'low');
        if (bar.hpText) bar.hpText.textContent = Math.round(pct / 100 * max) + ' / ' + max;
        if (k < 1) requestAnimationFrame(frame); else { if (bar.hpText) bar.hpText.textContent = targetHp + ' / ' + max; resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function msg(text, wait) {
    return new Promise((resolve) => {
      msgBox.textContent = text;
      const t = wait == null ? 700 : wait;
      let done = false; const fin = () => { if (done) return; done = true; off(); resolve(); };
      const off = G.input.on('press', (b) => { if (b === 'a' || b === 'b') fin(); });
      setTimeout(fin, t);
    });
  }

  async function playEvents(events) {
    for (const ev of events) {
      if (ev.t === 'text') { await msg(ev.s, ev.level ? 900 : 700); }
      else if (ev.t === 'move') { flash(ev.side); if (G.audio) G.audio.play('hit'); }
      else if (ev.t === 'hp') { if (ev.dmg > 0) spawnDmg(ev.side, ev.dmg); await animHp(ev.side, ev.hp, ev.max); if (ev.dmg && G.audio) G.audio.play(ev.dmg > 0 ? 'hit' : 'weakhit'); }
      else if (ev.t === 'learnprompt') { await learnPrompt(ev.mon, ev.key); }
      else if (ev.t === 'status') { updateBar(ev.side); }
      else if (ev.t === 'stat') { flash(ev.side); }
      else if (ev.t === 'faint') { if (G.audio) G.audio.play('faint'); await faintAnim(ev.side); }
      else if (ev.t === 'switch') { if (ev.side === 'foe') { setSprite('foe', G.battle.active(battle.foe)); updateBar('foe'); } else { setSprite('ply', G.battle.active(battle.player)); updateBar('ply'); } await wait(250); }
      else if (ev.t === 'ballthrow') { if (G.audio) G.audio.play('ball'); await ballAnim(); }
      else if (ev.t === 'shakes') { await shakeAnim(ev.n); }
      else if (ev.t === 'evolve') { evolves.push(ev); }
      else if (ev.t === 'end') { /* handled by caller */ }
    }
  }
  function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }
  function spawnDmg(side, dmg) {
    const wrap = side === 'foe' ? foeSprite : plySprite;
    const d = el('div', { class: 'dmg-float' }, '−' + dmg);
    wrap.appendChild(d);
    setTimeout(() => d.remove(), 850);
  }
  async function learnPrompt(mon, key) {
    const nm = G.move(key).name;
    const items = mon.moves.map((mv, i) => ({ label: 'Forget ' + G.move(mv.key).name, value: i, hint: G.move(mv.key).type.slice(0, 3).toUpperCase() }));
    items.push({ label: 'Give up on ' + nm, value: -1 });
    const v = await G.gui.choice(items, { title: G.party.displayName(mon) + ' wants to learn ' + nm + '!', layerClass: 'battle-menu', cancelValue: -1 });
    if (v != null && v >= 0) {
      const old = G.move(mon.moves[v].key).name;
      mon.moves[v] = { key, pp: G.move(key).pp, ppMax: G.move(key).pp };
      await msg(G.party.displayName(mon) + ' forgot ' + old + ' and learned ' + nm + '!', 900);
    } else {
      await msg(G.party.displayName(mon) + ' did not learn ' + nm + '.', 700);
    }
  }
  function flash(side) { const w = side === 'foe' ? foeSprite : plySprite; w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  function faintAnim(side) { const w = side === 'foe' ? foeSprite : plySprite; w.classList.add('faint'); return wait(650).then(() => w.classList.remove('faint')); }
  function ballAnim() { foeSprite.classList.add('caught'); return wait(500); }
  function shakeAnim(n) { return wait(300 + n * 350); }

  async function chooseAction() {
    while (true) {
      const act = await G.gui.choice([
        { label: '⚔ Fight', value: 'fight' },
        { label: '🎒 Bag', value: 'bag' },
        { label: '🔄 Pokémon', value: 'party' },
        { label: battle.kind === 'trainer' ? '🏳 Run' : '🏃 Run', value: 'run' },
      ], { title: 'What will you do?', layerClass: 'battle-menu', cancelable: false });
      if (act === 'fight') { const m = await chooseMove(); if (m != null) return { type: 'move', index: m }; }
      else if (act === 'bag') { const a = await chooseItem(); if (a) return a; }
      else if (act === 'party') { const a = await chooseSwitch(false); if (a) return a; }
      else if (act === 'run') { return { type: 'run' }; }
    }
  }

  async function chooseMove() {
    const mon = G.battle.active(battle.player);
    const items = mon.moves.map((mv, i) => {
      const m = G.move(mv.key);
      return { label: m.name, value: i, hint: m.type.slice(0, 3).toUpperCase() + '·' + (m.power || '—') + '  ' + mv.pp + '/' + mv.ppMax, disabled: mv.pp <= 0 };
    });
    return G.gui.choice(items, { title: 'Choose a move', layerClass: 'battle-menu move-menu', cancelValue: null });
  }

  async function chooseItem() {
    const p = P();
    const keys = Object.keys(p.bag).filter((k) => p.bag[k] > 0);
    if (!keys.length) { await msg('Your Bag is empty!', 600); return null; }
    const items = keys.map((k) => ({ label: G.ITEMS[k].name, value: k, hint: '×' + p.bag[k] }));
    const chosen = await G.gui.choice(items, { title: 'Bag', layerClass: 'battle-menu', cancelValue: null });
    if (!chosen) return null;
    const it = G.ITEMS[chosen];
    if (it.kind === 'ball') {
      if (battle.kind === 'trainer') { await msg('You can\'t catch another Trainer\'s Pokémon!', 800); return null; }
      p.bag[chosen]--; return { type: 'ball', item: chosen };
    }
    if (it.kind === 'heal' || it.kind === 'revive' || it.kind === 'cure') {
      const target = await chooseTargetForItem(it);
      if (target == null) return null;
      p.bag[chosen]--; if (G.audio) G.audio.play('heal');
      return { type: 'item', item: chosen, targetIndex: target };
    }
    return null;
  }
  async function chooseTargetForItem(it) {
    const p = P();
    const items = p.party.map((m, i) => ({
      label: G.party.displayName(m), value: i,
      hint: m.hp + '/' + m.stats.maxHp + (m.status ? ' ' + m.status : ''),
      disabled: it.kind === 'revive' ? m.hp > 0 : m.hp <= 0,
    }));
    return G.gui.choice(items, { title: 'Use on which Pokémon?', layerClass: 'battle-menu', cancelValue: null });
  }

  async function chooseSwitch(forced) {
    const p = P();
    const items = p.party.map((m, i) => ({
      label: G.party.displayName(m), value: i,
      hint: 'Lv' + m.level + '  ' + m.hp + '/' + m.stats.maxHp,
      disabled: m.hp <= 0 || i === battle.player.i,
    }));
    const v = await G.gui.choice(items, { title: forced ? 'Choose your next Pokémon' : 'Switch to…', layerClass: 'battle-menu', cancelable: !forced, cancelValue: null });
    if (v == null) return null;
    return forced ? v : { type: 'switch', index: v };
  }

  async function run(cfg) {
    // intro
    if (battle.kind === 'trainer') {
      await msg((cfg.foeName || 'A Trainer') + ' wants to battle!', 900);
      await msg((cfg.foeName || 'The Trainer') + ' sent out ' + G.party.displayName(G.battle.active(battle.foe)) + '!', 800);
    } else {
      await msg('A wild ' + G.battle.active(battle.foe).species + ' appeared!', 900);
    }
    await msg('Go! ' + G.party.displayName(G.battle.active(battle.player)) + '!', 700);
    const entry = G.battle.entryEvents(battle);
    if (entry.length) await playEvents(entry);

    while (!battle.over) {
      const action = await chooseAction();
      const res = G.battle.doTurn(battle, action);
      await playEvents(res.events);
      if (battle.over) break;
      if (res.needsPlayerSwitch) {
        const idx = await chooseSwitch(true);
        if (idx != null) {
          G.battle.forceSwitch(battle, 'player', idx);
          setSprite('ply', G.battle.active(battle.player)); updateBar('ply');
          await msg('Go! ' + G.party.displayName(G.battle.active(battle.player)) + '!', 600);
          const e2 = G.battle.entryEvents(battle, 'player');
          if (e2.length) await playEvents(e2);
        }
      }
    }
    await finish();
  }

  async function finish() {
    const result = battle.result;
    if (result === 'win' && battle.kind === 'trainer') { /* messages already shown by engine text events */ }
    // process evolutions queued during the battle
    for (const ev of evolves) { await doEvolve(ev.mon, ev.to); }
    await wait(200);
    cleanup();
    resolveFn({ result, caught: battle.caught || null });
  }

  async function doEvolve(mon, toName) {
    await G.gui.dialogue(['Huh? ' + G.party.displayName(mon) + ' is evolving!']);
    if (G.audio) G.audio.play('evolve');
    G.party.evolve(mon, toName);
    G.party.ownDex(P(), toName);
    await G.gui.dialogue(['Congratulations! Your Pokémon evolved into ' + toName + '!']);
  }

  function cleanup() { const layer = document.getElementById('battle-root'); if (layer) layer.remove(); }

  G.battlescene = { start };
})();
</script>
<script>/* menu.js — field menus: pause, party, bag, shop, fly, trainer card, save,
 * and the Entralink entry point. Built on G.gui primitives. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const P = () => G.game.player;

  const TOWN_NAMES = {
    nuvema: 'Nuvema Town', striaton: 'Striaton City', nacrene: 'Nacrene City',
    castelia: 'Castelia City', opelucid: 'Opelucid City',
  };

  async function openPause() {
    const p = P();
    const boxCount = (p.boxes[0] || []).length;
    const items = [
      { label: '📕 Pokémon', value: 'party' },
      { label: '🎒 Bag', value: 'bag' },
      { label: '💻 PC Box', value: 'pc', hint: boxCount ? '×' + boxCount : '' },
    ];
    if (G.party.hasHM(p, 'fly')) items.push({ label: '🕊 Fly', value: 'fly' });
    items.push({ label: '↔ Entralink', value: 'entralink' });
    items.push({ label: '🧑 ' + p.name, value: 'card' });
    items.push({ label: (p.flags.muted ? '🔇 Sound: Off' : '🔊 Sound: On'), value: 'sound' });
    items.push({ label: '💾 Save', value: 'save' });
    items.push({ label: '✖ Close', value: 'close' });
    const v = await G.gui.choice(items, { title: 'MENU', layerClass: 'pause-menu', cancelValue: 'close' });
    if (v === 'party') await openParty();
    else if (v === 'bag') await openBag();
    else if (v === 'pc') await openPC();
    else if (v === 'fly') await openFly();
    else if (v === 'entralink') await G.entralink.warpIn();
    else if (v === 'card') await openCard();
    else if (v === 'sound') {
      p.flags.muted = !p.flags.muted;
      G.audio.setEnabled(!p.flags.muted);
      if (!p.flags.muted) { const m = G.world.mapObj(); G.audio.startMusic((m && m.music) || 'town'); }
      G.save.save(p);
      G.gui.toast(p.flags.muted ? 'Sound off.' : 'Sound on!', {});
    }
    else if (v === 'save') { G.save.save(p); G.gui.toast('Game saved!', { kind: 'good' }); }
  }

  // PC storage: withdraw from / deposit to Box 1.
  async function openPC() {
    const p = P();
    while (true) {
      const box = p.boxes[0] || (p.boxes[0] = []);
      const v = await G.gui.choice([
        { label: '⬇ Withdraw', value: 'w', hint: '×' + box.length, disabled: !box.length },
        { label: '⬆ Deposit', value: 'd', disabled: p.party.length <= 1 },
        { label: '‹ Back', value: -1 },
      ], { title: 'PC BOX  (' + box.length + ' stored)', layerClass: 'bag-menu', cancelValue: -1 });
      if (v === -1 || v == null) break;
      if (v === 'w') {
        const i = await G.gui.choice(box.map((m, idx) => ({
          label: (m.shiny ? '✦ ' : '') + G.party.displayName(m), value: idx, hint: 'Lv' + m.level,
        })).concat([{ label: '‹ Cancel', value: -1 }]), { title: 'Withdraw which Pokémon?', layerClass: 'bag-menu', cancelValue: -1 });
        if (i == null || i < 0) continue;
        if (p.party.length >= 6) { await G.gui.dialogue(['Your party is full. Deposit someone first.']); continue; }
        const mon = box.splice(i, 1)[0];
        p.party.push(mon);
        G.gui.toast(G.party.displayName(mon) + ' joined the party!', { kind: 'good' });
      } else if (v === 'd') {
        const i = await G.gui.choice(p.party.map((m, idx) => ({
          label: G.party.displayName(m), value: idx, hint: 'Lv' + m.level,
        })).concat([{ label: '‹ Cancel', value: -1 }]), { title: 'Deposit which Pokémon?', layerClass: 'bag-menu', cancelValue: -1 });
        if (i == null || i < 0) continue;
        if (p.party.length <= 1) { await G.gui.dialogue(['You need at least one Pokémon with you!']); continue; }
        const mon = p.party.splice(i, 1)[0];
        box.push(mon);
        G.gui.toast(G.party.displayName(mon) + ' was stored in the PC.', {});
      }
      G.save.save(p);
      G.game.updateHud && G.game.updateHud();
    }
  }

  async function openParty() {
    const p = P();
    while (true) {
      const items = p.party.map((m, i) => ({
        label: (m.shiny ? '✦ ' : '') + G.party.displayName(m),
        value: i, hint: 'Lv' + m.level + '  ' + m.hp + '/' + m.stats.maxHp,
      }));
      items.push({ label: '‹ Back', value: -1 });
      const v = await G.gui.choice(items, { title: 'PARTY', layerClass: 'party-menu', cancelValue: -1 });
      if (v === -1 || v == null) break;
      await showSummary(p.party[v]);
    }
  }

  function showSummary(mon) {
    const s = G.species(mon.species);
    const el = G.gui.el;
    const body = el('div', { class: 'summary' }, [
      el('div', { class: 'sum-head' }, [
        el('div', { class: 'sum-sprite' }, G.sprites.monImg(mon, 96)),
        el('div', {}, [
          el('div', { class: 'sum-name' }, (mon.nickname || mon.species) + (mon.shiny ? ' ✦' : '')),
          el('div', { class: 'sum-sub' }, 'No.' + String(mon.dex).padStart(3, '0') + '  ' + mon.species + '  Lv' + mon.level),
          el('div', { class: 'sum-types' }, mon.types.map((t) => el('span', { class: 'type-pill', style: 'background:' + G.TYPE_COLOR[t] }, t.toUpperCase()))),
          el('div', { class: 'sum-ability' }, 'Ability: ' + mon.ability),
        ]),
      ]),
      el('div', { class: 'sum-stats' }, [
        stat('HP', mon.hp + '/' + mon.stats.maxHp), stat('Attack', mon.stats.atk), stat('Defense', mon.stats.def),
        stat('Sp.Atk', mon.stats.spa), stat('Sp.Def', mon.stats.spd), stat('Speed', mon.stats.spe),
      ]),
      el('div', { class: 'sum-moves' }, mon.moves.map((mv) => {
        const m = G.move(mv.key);
        return el('div', { class: 'sum-move' }, [
          el('span', { class: 'type-pill sm', style: 'background:' + G.TYPE_COLOR[m.type] }, m.type.slice(0, 3).toUpperCase()),
          el('span', { class: 'sm-name' }, m.name),
          el('span', { class: 'sm-pp' }, 'PP ' + mv.pp + '/' + mv.ppMax),
        ]);
      })),
      el('div', { class: 'sum-hint' }, 'Press B to go back'),
    ]);
    function stat(label, val) { return el('div', { class: 'st-row' }, [el('span', {}, label), el('b', {}, String(val))]); }
    return new Promise((resolve) => {
      const layer = el('div', { class: 'ui-layer summary-layer' }, body);
      (document.getElementById('game-ui') || document.body).appendChild(layer);
      const off = G.input.on('press', (b) => { if (b === 'b' || b === 'a') { off(); layer.remove(); resolve(); } });
      layer.addEventListener('click', () => { off(); layer.remove(); resolve(); });
    });
  }

  async function openBag() {
    const p = P();
    while (true) {
      const keys = Object.keys(p.bag).filter((k) => p.bag[k] > 0);
      if (!keys.length) { await G.gui.dialogue(['Your Bag is empty.']); return; }
      const items = keys.map((k) => ({ label: G.ITEMS[k].name, value: k, hint: '×' + p.bag[k] }));
      items.push({ label: '‹ Back', value: -1 });
      const v = await G.gui.choice(items, { title: 'BAG', layerClass: 'bag-menu', cancelValue: -1 });
      if (v === -1 || v == null) break;
      const it = G.ITEMS[v];
      if (it.kind === 'ball') { await G.gui.dialogue([it.name + ': ' + it.desc, 'Use it in battle to catch wild Pokémon.']); continue; }
      // heal / revive / cure — choose a target
      const t = await G.gui.choice(p.party.map((m, i) => ({
        label: G.party.displayName(m), value: i, hint: m.hp + '/' + m.stats.maxHp + (m.status ? ' ' + m.status : ''),
        disabled: it.kind === 'revive' ? m.hp > 0 : (it.kind === 'heal' ? m.hp >= m.stats.maxHp && m.hp > 0 : !m.status),
      })).concat([{ label: '‹ Cancel', value: -1 }]), { title: 'Use ' + it.name + ' on…', layerClass: 'bag-menu', cancelValue: -1 });
      if (t === -1 || t == null) continue;
      const mon = p.party[t];
      if (it.kind === 'heal') { const before = mon.hp; mon.hp = Math.min(mon.stats.maxHp, mon.hp + it.amount); if (it.cure) { mon.status = null; mon.statusCounter = 0; } p.bag[v]--; if (G.audio) G.audio.play('heal'); await G.gui.dialogue([G.party.displayName(mon) + ' recovered ' + (mon.hp - before) + ' HP!']); }
      else if (it.kind === 'revive') { mon.hp = Math.max(1, Math.floor(mon.stats.maxHp * it.amount)); mon.status = null; p.bag[v]--; if (G.audio) G.audio.play('heal'); await G.gui.dialogue([G.party.displayName(mon) + ' was revived!']); }
      else if (it.kind === 'cure') { if (it.status.indexOf(mon.status) >= 0) { mon.status = null; mon.statusCounter = 0; p.bag[v]--; await G.gui.dialogue([G.party.displayName(mon) + ' was cured!']); } }
      G.save.save(p); G.game.updateHud && G.game.updateHud();
    }
  }

  async function openShop(npc) {
    const p = P();
    while (true) {
      const items = (npc.stock || []).map((k) => ({ label: G.ITEMS[k].name, value: k, hint: '¥' + G.ITEMS[k].price }));
      items.push({ label: '‹ Leave', value: -1 });
      const v = await G.gui.choice(items, { title: 'SHOP   ¥' + p.money, layerClass: 'shop-menu', cancelValue: -1 });
      if (v === -1 || v == null) break;
      const it = G.ITEMS[v];
      const qty = await G.gui.choice([1, 2, 5, 10].map((n) => ({ label: 'Buy ' + n + '  (¥' + it.price * n + ')', value: n, disabled: it.price * n > p.money })).concat([{ label: '‹ Cancel', value: 0 }]), { title: it.name, layerClass: 'shop-menu', cancelValue: 0 });
      if (!qty) continue;
      if (it.price * qty > p.money) { await G.gui.dialogue(['You don\'t have enough money.']); continue; }
      p.money -= it.price * qty; p.bag[v] = (p.bag[v] || 0) + qty; if (G.audio) G.audio.play('coin');
      await G.gui.dialogue(['Bought ' + qty + '× ' + it.name + '!']);
      G.save.save(p); G.game.updateHud && G.game.updateHud();
    }
  }

  async function openFly() {
    const p = P();
    const towns = p.visitedTowns.filter((t) => TOWN_NAMES[t] && t !== p.map);
    if (!towns.length) { await G.gui.dialogue(['Nowhere new to fly to right now.']); return; }
    const v = await G.gui.choice(towns.map((t) => ({ label: TOWN_NAMES[t], value: t })).concat([{ label: '‹ Cancel', value: -1 }]), { title: 'Fly where?', layerClass: 'fly-menu', cancelValue: -1 });
    if (v === -1 || v == null) return;
    if (G.audio) G.audio.play('hm');
    await G.world.flyTo(v);
  }

  async function openCard() {
    const p = P();
    const dex = Object.keys(p.pokedex).length;
    const own = Object.values(p.pokedex).filter((v) => v === 'own').length;
    await G.gui.dialogue([
      'TRAINER CARD',
      'Name: ' + p.name + (p.champion ? '  ★CHAMPION' : ''),
      'Badges: ' + p.badges.length + '/4   Money: ¥' + p.money,
      'Pokédex: ' + own + ' owned, ' + dex + ' seen',
      'HMs: ' + (p.hms.length ? p.hms.join(', ') : 'none yet'),
    ]);
  }

  G.menu = { openPause, openParty, openBag, openShop, openFly, openCard };
})();
</script>
<script>/* entralink.js — the Entralink, 1:1 with the Black/White loop:
 *  - The menu warps you INTO the Entralink map (like the C-Gear), from the
 *    very start of the game.
 *  - The glowing Entree tree = Game Sync: tuck in a Pokémon and enter the
 *    Dream World (opens as an overlay).
 *  - Pokémon befriended in the Dream World wake up in the ENTREE FOREST at
 *    the north of the map: battle them there and a ball NEVER fails; they
 *    join your party with their Dream World Hidden Ability.
 *  - The white bridges east/west lead to a friend's world (crossover).
 *  - The warp pads return you exactly where you were. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const el = (t, a, k) => G.gui.el(t, a, k);
  const P = () => G.game.player;
  const DW_SAVE_KEY = 'dreamworld_save_v1';

  // ---------- warp in / out ----------
  async function warpIn() {
    const p = P();
    if (p.map === 'entralink') { G.gui.toast('You are already in the Entralink.'); return; }
    p.entralinkReturn = { map: p.map, x: p.x, y: p.y, dir: p.dir };
    if (G.audio) G.audio.play('warp');
    await G.gui.fade('out', 350);
    G.world.enter('entralink', 9, 7, 'up');
    await G.gui.fade('in', 350);
    if (!p.flags.entralink_intro) {
      p.flags.entralink_intro = true;
      G.save.save(p);
      await G.gui.dialogue([
        'Whoa! You were pulled into the ENTRALINK — the mysterious realm at the heart of Unova!',
        'Touch the glowing Entree tree to Game Sync into the Dream World.',
        'Friends you make there will wake up in the Entree Forest, just north. In that forest, a Poké Ball never fails!',
      ]);
    }
  }

  async function exitPrompt() {
    const p = P();
    const yes = await G.gui.confirm(null, { title: 'Step on the warp pad and return to Unova?', yes: 'Return', no: 'Stay' });
    if (!yes) return false;
    const ret = p.entralinkReturn || { map: 'nuvema', x: 9, y: 11, dir: 'down' };
    if (G.audio) G.audio.play('warp');
    await G.gui.fade('out', 350);
    G.world.enter(ret.map, ret.x, ret.y, ret.dir || 'down');
    await G.gui.fade('in', 350);
    return true;
  }

  // ---------- Entree tree (Game Sync) ----------
  async function gameSyncMenu() {
    const v = await G.gui.choice([
      { label: '🌙 Game Sync — enter the Dream World', value: 'dream' },
      { label: '↔ Cross over to a friend\'s world', value: 'crossover' },
      { label: '✖ Not now', value: null },
    ], { title: 'The Entree shimmers softly...', cancelValue: null });
    if (v === 'dream') { await G.gui.dialogue(['A Pokémon is tucked in beside the Entree...', 'Sweet dreams. Game Sync, start!']); await open(); }
    else if (v === 'crossover') await open('crossover');
  }

  async function bridgePrompt() {
    const yes = await G.gui.confirm(null, { title: 'The white bridge stretches toward a friend\'s world. Cross over?', yes: 'Cross over', no: 'Not yet' });
    if (yes) await open('crossover');
  }

  // ---------- Dream World save bridge (the Entree Forest pipeline) ----------
  function readDreamSave() {
    try { const raw = localStorage.getItem(DW_SAVE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }

  // Befriended Dream World Pokémon not yet brought through the forest.
  function dreamMons() {
    const s = readDreamSave();
    if (!s || !Array.isArray(s.box)) return [];
    const p = P();
    return s.box.filter((m) => m && m.uid && !p.flags['dw_claim_' + m.uid]).slice(0, 8);
  }

  function assignSlots(map) {
    const mons = dreamMons();
    const out = [];
    (map.dreamSlots || []).forEach((s, i) => { if (mons[i]) out.push({ x: s.x, y: s.y, dm: mons[i] }); });
    return out;
  }

  // Gen-5 has no fairy type — map Dream World fairy-types back to normal.
  function bwTypes(types) {
    const t = (types || ['normal']).map((x) => (x === 'fairy' ? 'normal' : x));
    return [...new Set(t)];
  }

  const TYPE_MOVES = {
    normal: ['tackle', 'headbutt'], fire: ['ember', 'flamewheel'], water: ['watergun', 'bubblebeam'],
    grass: ['vinewhip', 'razorleaf'], electric: ['thundershock', 'spark'], ice: ['iceshard', 'aurorabeam'],
    fighting: ['lowkick', 'doublekick'], poison: ['poisonsting', 'headbutt'], ground: ['mudslap', 'dig_'],
    flying: ['peck', 'wingattack'], psychic: ['confusion', 'psybeam'], bug: ['bugbite', 'strugglebug'],
    rock: ['rockthrow', 'rocktomb'], ghost: ['lick', 'hex'], dragon: ['dragonbreath', 'dragonclaw'],
    dark: ['bite', 'suckerpunch'], steel: ['metalclaw', 'ironhead'],
  };

  // Make sure the species exists in the RPG data; synthesize an entry for
  // Dream-World-only species so they are fully usable in battle.
  function ensureSpecies(dm) {
    if (G.SPECIES[dm.name]) return dm.name;
    const types = bwTypes(dm.types);
    const tm = TYPE_MOVES[types[0]] || TYPE_MOVES.normal;
    const ls = [[1, 'tackle'], [1, tm[0]], [7, tm[1]], [13, 'quickattack']]
      .filter((e, i, arr) => arr.findIndex((x) => x[1] === e[1]) === i);
    G.SPECIES[dm.name] = {
      dex: dm.speciesId, name: dm.name, types,
      base: [55, 60, 55, 60, 55, 60], ability: dm.ability || 'Run Away',
      catchRate: 190, exp: 64, ls, evo: null,
    };
    return dm.name;
  }

  function makeDreamMon(dm) {
    const name = ensureSpecies(dm);
    const level = Math.max(5, dm.level || 5);
    const mon = G.party.makeMon(name, level, { shiny: !!dm.shiny, nickname: dm.nickname || '' });
    if (dm.ability) mon.ability = dm.ability; // the Dream World Hidden Ability
    return mon;
  }

  function markClaimed(dm) {
    const p = P();
    p.flags['dw_claim_' + dm.uid] = true;
    // 1:1 with BW: a tucked-in Pokémon leaves the Dream World for the forest.
    try {
      const raw = localStorage.getItem(DW_SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        s.box = (s.box || []).filter((m) => !m || m.uid !== dm.uid);
        if (s.gift && s.gift.uid === dm.uid) s.gift = null;
        localStorage.setItem(DW_SAVE_KEY, JSON.stringify(s));
      }
    } catch (e) { /* keep the flag as the source of truth */ }
    G.save.save(p);
  }

  // Battle a drowsy forest Pokémon — in the Entree Forest a ball never fails.
  async function encounterDream(spot) {
    const p = P();
    const dm = spot.dm;
    const dname = dm.nickname || dm.name;
    if (!p.party.length) { await G.gui.dialogue([dname + ' is dreaming peacefully...', 'You need a partner Pokémon of your own before it can join you!']); return; }
    await G.gui.dialogue(['A drowsy ' + dname + ' is dozing at the forest\'s edge...', 'It remembers you from the Dream World! It stirs awake!']);
    G.party.seeDex(p, dm.name);
    const foe = makeDreamMon(dm);
    const res = await G.game.startBattle({ kind: 'wild', foeParty: [foe], dreamForest: true });
    if (res.result === 'caught' && res.caught) {
      if (dm.ability) res.caught.ability = dm.ability;
      const where = G.party.addToParty(p, res.caught);
      markClaimed(dm);
      G.world.refreshDreamSpots();
      if (G.audio) G.audio.play('win');
      await G.gui.dialogue([
        dname + ' came through the Entree Forest to your world!',
        '✨ It kept its Dream World Hidden Ability: ' + (dm.ability || res.caught.ability) + '!',
        where === 'party' ? 'It joined your party!' : 'It was sent to your PC Box.',
      ]);
    } else if (res.result === 'win') {
      await G.gui.dialogue([dname + ' drifted back to sleep...', 'It will keep waiting for you here.']);
    } else if (res.result === 'ran') {
      await G.gui.dialogue([dname + ' curled back up under the Entree.']);
    }
    G.game.updateHud && G.game.updateHud();
  }

  // ---------- Dream World overlay (Game Sync) ----------
  let open_ = false;
  function open(view) {
    if (open_) return Promise.resolve();
    open_ = true;
    if (G.audio) G.audio.play('warp');
    return new Promise((resolve) => {
      const frame = el('iframe', { class: 'entralink-frame', title: 'Dream World' });
      // Bundled single-file build embeds the Dream World as srcdoc; otherwise
      // load the standalone dreamworld.html.
      if (window.DREAMWORLD_HTML_B64) { try { frame.srcdoc = decodeURIComponent(escape(atob(window.DREAMWORLD_HTML_B64))); } catch (e) { frame.src = 'dreamworld.html'; } }
      else frame.src = 'dreamworld.html';
      if (view) frame.addEventListener('load', () => {
        try { frame.contentWindow.postMessage({ dw: 'view', view }, '*'); } catch (e) {}
      });
      const header = el('div', { class: 'entralink-header' }, [
        el('div', { class: 'entralink-title' }, ['↔ ', el('b', {}, 'Entralink'), ' — Game Sync: Dream World']),
        el('button', { class: 'entralink-close', onclick: () => close() }, '✕ Wake up'),
      ]);
      const panel = el('div', { class: 'entralink-panel' }, [header, frame]);
      const overlay = el('div', { class: 'ui-layer entralink-layer' }, panel);
      overlay.id = 'entralink-overlay';
      (document.getElementById('game-ui') || document.body).appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      G.input.setEnabled(false);
      let done = false;
      function close() {
        if (done) return; done = true; open_ = false;
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 300);
        G.input.setEnabled(true);
        if (G.audio) { G.audio.play('warp'); G.audio.startMusic((G.world.mapObj() && G.world.mapObj().music) || 'town'); }
        // New dream friends may be waiting in the forest now.
        G.world.refreshDreamSpots();
        resolve();
      }
      const onKey = (e) => { if (e.key === 'Escape') { close(); window.removeEventListener('keydown', onKey); } };
      window.addEventListener('keydown', onKey);
    });
  }

  G.entralink = { warpIn, exitPrompt, gameSyncMenu, bridgePrompt, encounterDream, assignSlots, dreamMons, open };
})();
</script>
<script>/* main.js — boot, title screen, scene manager, game loop, HUD, touch controls. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const el = (t, a, k) => G.gui.el(t, a, k);

  const game = {
    player: null,
    scene: 'title',   // 'title' | 'world' | 'battle'
    surfing: false,
    ctx: null,
    async startBattle(cfg) {
      await G.gui.battleFlash();
      this.scene = 'battle';
      const res = await G.battlescene.start(cfg);
      this.scene = 'world';
      const m = G.world.mapObj(); if (m && G.audio) G.audio.startMusic(m.music || 'route');
      this.updateHud();
      return res;
    },
    updateHud() {
      const hud = document.getElementById('hud');
      if (!hud || !this.player) return;
      const p = this.player;
      const m = G.maps.MAPS[p.map];
      hud.querySelector('.hud-loc').textContent = (m ? m.name : p.map);
      hud.querySelector('.hud-money').textContent = '¥' + p.money;
      hud.querySelector('.hud-badges').textContent = '◆'.repeat(p.badges.length) + '◇'.repeat(Math.max(0, 4 - p.badges.length));
      hud.style.display = this.scene === 'world' ? '' : 'none';
    },
  };
  G.game = game;

  function boot() {
    const canvas = document.getElementById('game-canvas');
    canvas.width = G.world.VIEW_W * G.world.TS;
    canvas.height = G.world.VIEW_H * G.world.TS;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    game.ctx = ctx;

    G.input.init();
    G.world.init();
    bindTouch();

    // Unlock audio on first interaction.
    const unlock = () => { if (G.audio) G.audio.resume(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
    window.addEventListener('pointerdown', unlock); window.addEventListener('keydown', unlock);

    startLoop(ctx);
    showTitle();
  }

  let looping = false;
  function startLoop(ctx) {
    if (looping) return; looping = true;
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(60, now - last); last = now;
      try { if (game.scene === 'world') { G.world.update(dt); G.world.render(ctx); } }
      catch (e) { console.error('loop error', e); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---- Title ----
  function showTitle() {
    game.scene = 'title';
    if (G.audio) G.audio.startMusic('town');
    const hasSave = G.save.hasSave();
    const nameInput = el('input', { class: 'title-name', type: 'text', maxlength: 12, placeholder: 'Name (e.g. Hilbert)', value: 'Hilbert' });
    const menu = el('div', { class: 'title-menu' });
    const btns = [];
    if (hasSave) btns.push(el('button', { class: 'title-btn primary', onclick: () => continueSave() }, '▶ Continue'));
    btns.push(el('button', { class: 'title-btn', onclick: () => beginNew('new') }, '✦ New Adventure'));
    btns.push(el('button', { class: 'title-btn champ', onclick: () => beginNew('champ') }, '👑 Continue as Champion'));
    btns.forEach((b) => menu.appendChild(b));

    const panel = el('div', { class: 'title-panel' }, [
      el('div', { class: 'title-logo' }, [el('span', { class: 'tl-1' }, 'Pokémon'), el('span', { class: 'tl-2' }, 'UNOVA'), el('span', { class: 'tl-3' }, 'Dream Journey')]),
      el('div', { class: 'title-sub' }, 'A Black & White-style adventure — beat the Elite Four, catch Darmanitan, master every HM, and cross over through the Entralink.'),
      el('label', { class: 'title-label' }, 'Trainer name'),
      nameInput,
      menu,
      el('div', { class: 'title-tip' }, 'Move: Arrows / WASD · Interact: Z / Space · Hold X to run · Menu: Esc · (touch controls on mobile)'),
    ]);
    const overlay = el('div', { class: 'ui-layer title-layer' }, panel);
    overlay.id = 'title-overlay';
    (document.getElementById('game-ui') || document.body).appendChild(overlay);

    function nm() { return (nameInput.value || 'Hilbert').trim().slice(0, 12) || 'Hilbert'; }
    function beginNew(mode) {
      if (G.save.hasSave()) {
        // Confirm overwrite
        overlay.remove();
        G.gui.confirm(null, { title: 'Start a new game? Your current save will be replaced.', yes: 'Yes', no: 'No' }).then((ok) => {
          if (ok) launch(mode === 'champ' ? G.save.championStart(nm()) : G.save.newAdventure(nm()));
          else showTitle();
        });
        return;
      }
      launch(mode === 'champ' ? G.save.championStart(nm()) : G.save.newAdventure(nm()));
    }
    function continueSave() { const p = G.save.load(); if (p) launch(p); }
    function launch(p) { overlay.remove(); startGame(p); }
  }

  async function startGame(player) {
    game.player = player;
    game.scene = 'world';
    if (player.flags && player.flags.muted && G.audio) G.audio.setEnabled(false);
    document.getElementById('hud').style.display = '';
    await G.gui.fade('in', 200);
    G.world.enter(player.map, player.x, player.y, player.dir);
    game.updateHud();
    if (player.champion) {
      G.gui.toast('Welcome back, Champion! Open the menu (Esc) → Entralink to visit the realm of dreams.', { duration: 4200, kind: 'good' });
    } else if (player.party.length === 0) {
      setTimeout(() => G.gui.dialogue([
        'Talk to Prof. Juniper (green) to choose your first partner!',
        'Psst — the ENTRALINK is open from the very start: press Esc and choose Entralink to visit the realm of dreams.',
      ]), 400);
    }
  }

  // ---- touch controls ----
  function bindTouch() {
    const pairs = [['btn-up', 'up'], ['btn-down', 'down'], ['btn-left', 'left'], ['btn-right', 'right'], ['btn-a', 'a'], ['btn-b', 'b'], ['btn-start', 'start']];
    pairs.forEach(([id, btn]) => { const e = document.getElementById(id); if (e) G.input.bindButton(e, btn); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

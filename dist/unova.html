<title>Pokémon Unova — Dream Journey</title>
<style>/* game.css — Pokémon Unova Dream Journey (RPG). */
:root {
  --ink: #24304a; --panel: #ffffff; --panel-dk: #1b2440; --accent: #4a7ad0;
  --accent2: #e05a6b; --gold: #f2c94c; --good: #57b894; --warn: #e6a84a; --bad: #e0637a;
  --font: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
  --box: #12203f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font); background: #0c1224; color: #eaf0ff; overflow: hidden;
  user-select: none; touch-action: manipulation;
}
button { font-family: inherit; cursor: pointer; }

#game-root { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; }

/* HUD */
#hud {
  display: flex; align-items: center; gap: 14px; background: rgba(20,30,60,.9);
  border: 2px solid #35508c; border-radius: 12px; padding: 6px 16px; font-weight: 700; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4); max-width: 96vw;
}
.hud-loc { color: #fff; }
.hud-badges { color: var(--gold); letter-spacing: 2px; }
.hud-money { color: #bfe6a8; }

/* Stage / canvas */
#stage {
  width: min(92vw, 720px); max-height: 64vh; aspect-ratio: 4 / 3;
  border: 3px solid #35508c; border-radius: 10px; overflow: hidden; background: #12131a;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
#game-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Touch controls */
#touch-controls { width: min(94vw, 720px); display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
.dpad { position: relative; width: 132px; height: 132px; }
.tc-btn {
  background: linear-gradient(#3a4d80, #26365f); color: #dce6ff; border: 2px solid #45619c;
  border-radius: 12px; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 #1a2440; transition: transform .05s;
}
.tc-btn.pressed, .tc-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a2440; filter: brightness(1.2); }
.dpad .tc-btn { position: absolute; width: 44px; height: 44px; }
.tc-up { top: 0; left: 44px; } .tc-down { bottom: 0; left: 44px; }
.tc-left { left: 0; top: 44px; } .tc-right { right: 0; top: 44px; }
.face-btns { display: flex; align-items: center; gap: 14px; }
.ab { display: flex; align-items: flex-end; gap: 10px; }
.tc-a, .tc-b { width: 56px; height: 56px; border-radius: 50%; font-size: 20px; }
.tc-a { background: linear-gradient(#e0637a, #b23350); border-color: #e88; }
.tc-b { background: linear-gradient(#5aa0e0, #2a63a8); border-color: #8cf; width: 48px; height: 48px; }
.tc-start { width: 44px; height: 30px; border-radius: 8px; font-size: 15px; }

/* UI layers */
#game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.ui-layer { position: absolute; inset: 0; pointer-events: none; }
.ui-layer > * { pointer-events: auto; }
.fade-layer { position: absolute; inset: 0; background: #000; z-index: 200; pointer-events: none; }

/* Dialogue box */
.dlg-layer { display: flex; align-items: flex-end; justify-content: center; padding: 0 0 3vh; }
.dialogue {
  position: relative; width: min(92vw, 700px); min-height: 84px; background: linear-gradient(#f7fbff, #e3ecfb);
  color: #1b2440; border: 3px solid #3a5aa0; border-radius: 14px; padding: 14px 18px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 2px #fff; font-size: 17px; line-height: 1.45; font-weight: 600;
  margin-bottom: 8px; cursor: pointer;
}
.dlg-name { position: absolute; top: -14px; left: 14px; background: #3a5aa0; color: #fff; font-size: 13px; font-weight: 800; padding: 2px 12px; border-radius: 10px; }
.dlg-text { white-space: pre-wrap; min-height: 2.6em; }
.dlg-arrow { position: absolute; right: 14px; bottom: 8px; color: #3a5aa0; animation: bobArrow 1s infinite; }
@keyframes bobArrow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

/* Choice menus */
.choice-layer { display: flex; align-items: center; justify-content: center; }
.choice-box {
  background: linear-gradient(#f7fbff, #e3ecfb); color: #1b2440; border: 3px solid #3a5aa0; border-radius: 12px;
  min-width: 200px; max-width: 92vw; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 2px #fff; font-weight: 700;
}
.choice-title { font-size: 14px; color: #35508c; padding: 4px 10px 8px; border-bottom: 2px solid #cdd9f0; margin-bottom: 4px; }
.choice-list { max-height: 60vh; overflow: auto; }
.choice-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
.choice-cursor { opacity: 0; color: var(--accent2); }
.choice-item.sel { background: #d6e4ff; }
.choice-item.sel .choice-cursor { opacity: 1; }
.choice-item.disabled { opacity: .4; }
.choice-label { flex: 1; }
.choice-hint { font-size: 13px; color: #5a6b8c; font-weight: 700; }

.pause-menu { align-items: flex-start; justify-content: flex-end; padding: 4vh 3vw; }
.battle-menu { align-items: flex-end; justify-content: flex-end; padding: 0 4vw 14vh; }
.party-menu, .bag-menu, .shop-menu, .fly-menu { align-items: center; justify-content: center; }
.confirm-choice { }
.battle-menu.move-menu .choice-box { min-width: 260px; }

/* Toasts */
.toast-layer { display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
.game-toast { background: #1b2440; color: #fff; border: 2px solid #3a5aa0; border-radius: 12px; padding: 10px 18px; font-weight: 700; opacity: 0; transform: translateY(-10px); transition: all .3s; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.game-toast.show { opacity: 1; transform: none; }
.game-toast.good { border-color: var(--good); }

/* Battle scene */
.battle-layer { display: flex; align-items: center; justify-content: center; background: rgba(5,8,18,.4); }
.battle-scene { width: min(96vw, 760px); aspect-ratio: 4/3; max-height: 88vh; background: linear-gradient(#bfe0ff 0%, #dff0ff 55%, #cfe8b8 55%, #a9d488 100%); border: 3px solid #35508c; border-radius: 12px; position: relative; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.battle-field { position: absolute; inset: 0; }
.foe-area { position: absolute; top: 8%; right: 4%; display: flex; flex-direction: column; align-items: flex-end; }
.ply-area { position: absolute; bottom: 20%; left: 4%; display: flex; flex-direction: column; align-items: flex-start; }
.foe-sprite, .ply-sprite { position: relative; }
.foe-sprite { margin-right: 6%; }
.ply-sprite { margin-left: 6%; }
.foe-sprite img { width: clamp(90px, 18vw, 150px); }
.ply-sprite img { width: clamp(110px, 22vw, 185px); }
.mon-sprite { image-rendering: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); }
.mon-sprite.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
.mon-sprite.shiny { filter: hue-rotate(130deg) saturate(1.25) drop-shadow(0 6px 6px rgba(0,0,0,.3)); }

/* Floating damage numbers */
.dmg-float {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  font-weight: 900; font-size: 20px; color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,.65), 0 0 3px #c03a52;
  animation: dmgUp .8s ease forwards; pointer-events: none; z-index: 5;
}
@keyframes dmgUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -34px); } }

/* Encounter strobe into battle */
.battle-flash-layer { position: absolute; inset: 0; z-index: 300; pointer-events: none; background: #000; animation: battleFlash .56s steps(1) forwards; }
@keyframes battleFlash {
  0% { background: #fff; opacity: .95; } 16% { background: #05070f; opacity: .95; }
  32% { background: #fff; opacity: .95; } 48% { background: #05070f; opacity: .9; }
  100% { background: #05070f; opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .battle-flash-layer { animation: none; opacity: .92; }
  .dmg-float { animation-duration: .3s; }
}
.foe-sprite.flash, .ply-sprite.flash { animation: hitFlash .3s; }
@keyframes hitFlash { 0%,100% { filter: none; } 30% { filter: brightness(2) saturate(.3); transform: translateX(-4px); } 60% { transform: translateX(4px); } }
.foe-sprite.faint, .ply-sprite.faint { animation: faintDrop .6s forwards; }
@keyframes faintDrop { to { transform: translateY(40px); opacity: 0; } }
.foe-sprite.caught { animation: caughtAnim .5s forwards; }
@keyframes caughtAnim { to { transform: scale(.2); opacity: .2; } }
.b-shiny { position: absolute; top: 0; right: 10%; color: var(--gold); font-size: 20px; text-shadow: 0 0 8px #ffe08a; }

.battle-bar { background: rgba(20,30,60,.92); border: 2px solid #6f86bc; border-radius: 10px; padding: 6px 12px; min-width: 190px; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
.battle-bar.ply { min-width: 210px; }
.b-top { display: flex; align-items: center; gap: 8px; }
.b-name { font-weight: 800; font-size: 15px; }
.b-lv { font-size: 12px; color: #cdd9f0; }
.b-status { margin-left: auto; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
.b-status.s-brn { background: #e0637a; } .b-status.s-par { background: #f2c94c; color: #333; } .b-status.s-psn, .b-status.s-tox { background: #ab6ac8; } .b-status.s-slp { background: #8a94ad; } .b-status.s-frz { background: #74cec0; color: #333; }
.b-bar { height: 8px; background: #0c1428; border-radius: 6px; margin-top: 5px; overflow: hidden; border: 1px solid #0a1020; }
.b-fill { height: 100%; width: 100%; transition: none; border-radius: 6px; }
.b-fill.ok { background: linear-gradient(#7be08a, #4bbf6a); } .b-fill.warn { background: linear-gradient(#f5d76a, #e6a84a); } .b-fill.low { background: linear-gradient(#f08a9a, #e0637a); }
.b-hptext { display: block; text-align: right; font-size: 12px; font-weight: 700; color: #cdd9f0; margin-top: 2px; }
.battle-msg { position: absolute; left: 0; right: 0; bottom: 0; min-height: 64px; background: linear-gradient(#f7fbff, #e3ecfb); color: #1b2440; border-top: 3px solid #3a5aa0; padding: 14px 18px; font-size: 16px; font-weight: 700; display: flex; align-items: center; }

/* Summary */
.summary-layer { display: flex; align-items: center; justify-content: center; background: rgba(5,8,18,.5); }
.summary { width: min(94vw, 560px); background: linear-gradient(#f7fbff, #e6eefb); color: #1b2440; border: 3px solid #3a5aa0; border-radius: 14px; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.sum-head { display: flex; gap: 14px; align-items: center; }
.sum-sprite img { width: 96px; height: 96px; }
.sum-name { font-size: 20px; font-weight: 800; }
.sum-sub { font-size: 13px; color: #5a6b8c; }
.sum-types { display: flex; gap: 6px; margin: 4px 0; }
.type-pill { color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; }
.type-pill.sm { font-size: 10px; padding: 1px 6px; }
.sum-ability { font-size: 13px; font-weight: 700; color: #35508c; }
.sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 12px; margin: 12px 0; background: #eef3fc; padding: 10px; border-radius: 10px; }
.st-row { display: flex; justify-content: space-between; font-size: 13px; }
.sum-moves { display: grid; gap: 6px; }
.sum-move { display: flex; align-items: center; gap: 8px; background: #eef3fc; border-radius: 8px; padding: 6px 10px; }
.sm-name { flex: 1; font-weight: 700; } .sm-pp { font-size: 12px; color: #5a6b8c; }
.sum-hint { text-align: center; font-size: 12px; color: #5a6b8c; margin-top: 10px; }

/* Title */
.title-layer { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #26407a, #0c1224 75%); }
.title-panel { width: min(92vw, 520px); text-align: center; padding: 20px; }
.title-logo { display: flex; flex-direction: column; line-height: 1; margin-bottom: 10px; }
.tl-1 { font-size: 22px; font-weight: 800; color: #cfe0ff; letter-spacing: 3px; }
.tl-2 { font-size: 58px; font-weight: 900; color: var(--gold); letter-spacing: 4px; text-shadow: 0 3px 0 #a97e1a, 0 6px 16px rgba(0,0,0,.5); }
.tl-3 { font-size: 20px; font-weight: 800; color: #e05a6b; letter-spacing: 2px; }
.title-sub { color: #b7c6e6; font-size: 14px; line-height: 1.5; margin: 14px 0; }
.title-label { display: block; font-size: 12px; color: #8fa6d6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.title-name { font-family: inherit; font-size: 18px; text-align: center; padding: 10px; border-radius: 10px; border: 2px solid #3a5aa0; background: #101a34; color: #fff; width: min(80%, 280px); outline: none; }
.title-name:focus { border-color: var(--gold); }
.title-menu { display: flex; flex-direction: column; gap: 10px; margin: 18px auto 0; max-width: 320px; }
.title-btn { padding: 14px; border-radius: 12px; border: 2px solid #3a5aa0; background: linear-gradient(#26365f, #1a2748); color: #eaf0ff; font-size: 17px; font-weight: 800; box-shadow: 0 4px 0 #0f1830; transition: transform .06s; }
.title-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0f1830; }
.title-btn.primary { background: linear-gradient(#4a7ad0, #2f5aa8); border-color: #6f9be0; }
.title-btn.champ { background: linear-gradient(#e0a24a, #b97a1e); border-color: #f2c94c; color: #23180a; }
.title-tip { margin-top: 16px; font-size: 12px; color: #7c8db0; line-height: 1.5; }

/* Entralink overlay */
.entralink-layer { display: flex; align-items: center; justify-content: center; background: rgba(5,8,18,.85); opacity: 0; transition: opacity .3s; }
.entralink-layer.show { opacity: 1; }
.entralink-panel { width: min(98vw, 1000px); height: min(94vh, 900px); display: flex; flex-direction: column; background: #0c1224; border: 3px solid #6f7fd6; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
.entralink-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: linear-gradient(90deg, #4a3a8a, #6f5fc0); }
.entralink-title { font-weight: 700; }
.entralink-close { background: #fff; color: #3a2b6a; border: none; border-radius: 999px; padding: 8px 16px; font-weight: 800; }
.entralink-frame { flex: 1; width: 100%; border: 0; background: #b8a6e6; }

@media (max-width: 640px) {
  #stage { max-height: 52vh; }
  .tl-2 { font-size: 44px; }
  .foe-sprite img { width: 100px; } .ply-sprite img { width: 120px; }
}
@media (min-width: 800px) and (hover: hover) {
  /* keep touch controls visible but smaller on desktop */
  #touch-controls { opacity: .85; }
}
</style>

  <div id="hud" style="display:none">
    <span class="hud-loc">Unova</span>
    <span class="hud-badges">◇◇◇◇</span>

  </div>
</div>

<script>/* data.js — core game data: types, moves, species, items, trainers.
 * Pure data + lookups. Safe to load in Node (attaches to globalThis.G). */
(function (root) {
  'use strict';
  const G = (root.G = root.G || {});

  // ---------------- Types ----------------
  const TYPES = ['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel'];
  const TYPE_COLOR = {
    normal:'#9fa19f', fire:'#ff7a52', water:'#4d90d5', electric:'#f4d23c', grass:'#63bb5b',
    ice:'#74cec0', fighting:'#ce4069', poison:'#ab6ac8', ground:'#d97845', flying:'#8fa9de',
    psychic:'#f97176', bug:'#90c12c', rock:'#c7b78b', ghost:'#5269ac', dragon:'#0a6dc4',
    dark:'#5a5366', steel:'#5a8ea1',
  };
  // Effectiveness chart: CHART[attacker][defender] = multiplier (default 1).
  const X = {}; TYPES.forEach(t => X[t] = {});
  const set = (a, map) => Object.assign(X[a], map);
  set('normal',   { rock:.5, ghost:0, steel:.5 });
  set('fire',     { fire:.5, water:.5, grass:2, ice:2, bug:2, rock:.5, dragon:.5, steel:2 });
  set('water',    { fire:2, water:.5, grass:.5, ground:2, rock:2, dragon:.5 });
  set('electric', { water:2, electric:.5, grass:.5, ground:0, flying:2, dragon:.5 });
  set('grass',    { fire:.5, water:2, grass:.5, poison:.5, ground:2, flying:.5, bug:.5, rock:2, dragon:.5, steel:.5 });
  set('ice',      { fire:.5, water:.5, grass:2, ice:.5, ground:2, flying:2, dragon:2, steel:.5 });
  set('fighting', { normal:2, ice:2, poison:.5, flying:.5, psychic:.5, bug:.5, rock:2, ghost:0, dark:2, steel:2 });
  set('poison',   { grass:2, poison:.5, ground:.5, rock:.5, ghost:.5, steel:0 });
  set('ground',   { fire:2, electric:2, grass:.5, poison:2, flying:0, bug:.5, rock:2, steel:2 });
  set('flying',   { electric:.5, grass:2, fighting:2, bug:2, rock:.5, steel:.5 });
  set('psychic',  { fighting:2, poison:2, psychic:.5, dark:0, steel:.5 });
  set('bug',      { fire:.5, grass:2, fighting:.5, poison:.5, flying:.5, psychic:2, ghost:.5, dark:2, steel:.5 });
  set('rock',     { fire:2, ice:2, fighting:.5, ground:.5, flying:2, bug:2, steel:.5 });
  set('ghost',    { normal:0, psychic:2, ghost:2, dark:.5 });
  set('dragon',   { dragon:2, steel:.5 });
  set('dark',     { fighting:.5, psychic:2, ghost:2, dark:.5 });
  set('steel',    { fire:.5, water:.5, electric:.5, ice:2, rock:2, steel:.5 });

  function typeEff(atkType, defTypes) {
    let m = 1;
    (Array.isArray(defTypes) ? defTypes : [defTypes]).forEach(d => {
      const v = X[atkType] && X[atkType][d];
      m *= (v === undefined ? 1 : v);
    });
    return m;
  }

  // ---------------- Moves ----------------
  // cat: phys|spec|status. eff: optional {status,chance,stat,stage,target,recoil,drain,flinch,heal,highCrit,multi,priority}
  const mv = (name, type, cat, power, acc, pp, eff) => ({ name, type, cat, power, acc, pp: pp, eff: eff || null });
  const MOVES = {
    tackle:      mv('Tackle','normal','phys',40,100,35),
    scratch:     mv('Scratch','normal','phys',40,100,35),
    pound:       mv('Pound','normal','phys',40,100,35),
    quickattack: mv('Quick Attack','normal','phys',40,100,30,{priority:1}),
    headbutt:    mv('Headbutt','normal','phys',70,100,15,{flinch:30}),
    bodyslam:    mv('Body Slam','normal','phys',85,100,15,{status:'par',chance:30}),
    return_:     mv('Return','normal','phys',90,100,20),
    facade:      mv('Facade','normal','phys',70,100,20),
    hyperbeam:   mv('Hyper Beam','normal','spec',150,90,5,{recharge:true}),
    growl:       mv('Growl','normal','status',0,100,40,{stat:'atk',stage:-1,target:'foe'}),
    tailwhip:    mv('Tail Whip','normal','status',0,100,30,{stat:'def',stage:-1,target:'foe'}),
    leer:        mv('Leer','normal','status',0,100,30,{stat:'def',stage:-1,target:'foe'}),
    workup:      mv('Work Up','normal','status',0,100,30,{stat:'atk',stage:1,target:'self',also:{stat:'spa',stage:1}}),
    ember:       mv('Ember','fire','spec',40,100,25,{status:'brn',chance:10}),

<script>/* party.js — Pokémon instances, stats, XP/leveling, evolution, and the
 * player save-state (party, bag, badges, money, pokedex, boxes, flags). */
(function (root) {
  'use strict';
  const G = (root.G = root.G || {});
  const IV = 15; // flat IV for every stat (simple, consistent)

  let _uid = 1;
  function uid() { return 'm' + (_uid++) + '_' + Math.floor(Math.random() * 1e6).toString(36); }

  function expForLevel(l) { return l * l * l; } // medium-fast

  function statAt(base, level, isHP) {
    if (isHP) return Math.floor(((2 * base + IV) * level) / 100) + level + 10;
    return Math.floor(((2 * base + IV) * level) / 100) + 5;
  }

  function computeStats(speciesName, level) {
    const s = G.species(speciesName);
    const b = s.base;
    return {
      maxHp: statAt(b[0], level, true),
      atk: statAt(b[1], level),
      def: statAt(b[2], level),
      spa: statAt(b[3], level),
      spd: statAt(b[4], level),
      spe: statAt(b[5], level),
    };
  }

  function movesForLevel(speciesName, level) {
    const s = G.species(speciesName);
    const learned = s.ls.filter(([lv]) => lv <= level).map(([, m]) => m);
    // dedupe keep order, take last 4
    const seen = new Set(); const out = [];
    for (let i = learned.length - 1; i >= 0 && out.length < 4; i--) {
      if (!seen.has(learned[i])) { seen.add(learned[i]); out.unshift(learned[i]); }
    }
    return out.map((k) => ({ key: k, pp: G.move(k).pp, ppMax: G.move(k).pp }));
  }

  function makeMon(speciesName, level, opts) {
    opts = opts || {};
    const s = G.species(speciesName);
    if (!s) throw new Error('Unknown species ' + speciesName);
    const stats = computeStats(speciesName, level);
    const mon = {
      uid: uid(),
      species: speciesName,
      dex: s.dex,
      nickname: opts.nickname || '',
      level,
      exp: expForLevel(level),
      types: s.types.slice(),
      ability: s.ability,
      moves: opts.moves ? opts.moves.map((k) => ({ key: k, pp: G.move(k).pp, ppMax: G.move(k).pp })) : movesForLevel(speciesName, level),
      stats,
      hp: stats.maxHp,
      status: null,          // 'brn'|'par'|'psn'|'tox'|'slp'|'frz'
      statusCounter: 0,      // sleep turns / toxic counter
      shiny: opts.shiny || (Math.random() < 1 / 512),
      original: opts.original || null,
    };
    if (opts.moves) { mon.moves = opts.moves.map((k) => ({ key: k, pp: G.move(k).pp, ppMax: G.move(k).pp })); }
    return mon;
  }

  function displayName(mon) { return mon.nickname || mon.species; }
  function isFainted(mon) { return mon.hp <= 0; }

  function healMon(mon) {
    mon.hp = mon.stats.maxHp;
    mon.status = null; mon.statusCounter = 0;
    mon.moves.forEach((m) => { m.pp = m.ppMax; });
  }
  function healParty(party) { party.forEach(healMon); }

  // Recompute stats after a level change, preserving current HP ratio bonus.
  function recalc(mon) {
    const before = mon.stats.maxHp;
    mon.stats = computeStats(mon.species, mon.level);
    mon.hp += (mon.stats.maxHp - before); // level-up gives the HP delta
    if (mon.hp > mon.stats.maxHp) mon.hp = mon.stats.maxHp;
    if (mon.hp < 0) mon.hp = 0;
  }

  // Add experience; returns an array of event strings (level ups, moves, evo).
  function gainExp(mon, amount) {
    const events = [];
    mon.exp += amount;
    while (mon.level < 100 && mon.exp >= expForLevel(mon.level + 1)) {
      mon.level++;
      recalc(mon);
      events.push({ type: 'level', level: mon.level, mon });
      // learn moves at this level
      const s = G.species(mon.species);
      s.ls.filter(([lv]) => lv === mon.level).forEach(([, key]) => {
        if (mon.moves.find((m) => m.key === key)) return;
        if (mon.moves.length < 4) {
          mon.moves.push({ key, pp: G.move(key).pp, ppMax: G.move(key).pp });
          events.push({ type: 'learn', key, mon });
        } else {
          events.push({ type: 'learnFull', key, mon }); // UI offers to forget a move
        }
      });
      // evolution by level
      if (s.evo && mon.level >= s.evo.lvl) {
        events.push({ type: 'evolve', to: s.evo.to, mon });
      }
    }
    return events;
  }

  function evolve(mon, toName) {
    const ratio = mon.hp / mon.stats.maxHp;
    mon.species = toName;
    const ns = G.species(toName);
    mon.dex = ns.dex;
    mon.types = ns.types.slice();
    mon.ability = ns.ability;
    mon.stats = computeStats(toName, mon.level);
    mon.hp = Math.max(1, Math.round(mon.stats.maxHp * ratio));
    // learn any evolution/level moves it now qualifies for that it lacks
    ns.ls.filter(([lv]) => lv <= mon.level).forEach(([, key]) => {
      if (!mon.moves.find((m) => m.key === key) && mon.moves.length < 4) {
        mon.moves.push({ key, pp: G.move(key).pp, ppMax: G.move(key).pp });
      }
    });
  }

  // ---------------- Player state ----------------
  function newPlayer() {
    return {
      name: 'Hilbert',
      gender: 'boy',
      money: 3000,
      party: [],
      boxes: [[]],           // PC storage
      bag: { potion: 5, pokeball: 5 },
      badges: [],            // e.g. ['basic','toxic','insect','bolt']
      hms: [],               // ['cut','fly','surf','strength','waterfall']
      pokedex: {},           // speciesName -> 'seen'|'own'
      flags: {},             // arbitrary story/world flags
      visitedTowns: [],      // for Fly
      map: 'nuvema',
      x: 9, y: 11, dir: 'up',
      champion: false,
      playtime: 0,
    };
  }

  function seeDex(p, name) { if (p.pokedex[name] !== 'own') p.pokedex[name] = 'seen'; }
  function ownDex(p, name) { p.pokedex[name] = 'own'; }

  function addToParty(p, mon) {
    ownDex(p, mon.species);
    if (p.party.length < 6) { p.party.push(mon); return 'party'; }
    p.boxes[0].push(mon); return 'box';
  }

  function hasHM(p, hm) { return p.hms.indexOf(hm) >= 0; }

  G.party = {
    uid, expForLevel, computeStats, movesForLevel, makeMon, displayName, isFainted,
    healMon, healParty, recalc, gainExp, evolve, newPlayer, seeDex, ownDex,
    addToParty, hasHM, IV,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* battle.js — turn-based battle engine. Produces an ordered event stream the
 * UI plays out. Pure logic (Node-testable via globalThis.G). */
(function (root) {
  'use strict';
  const G = (root.G = root.G || {});
  const P = () => G.party;

  function rand(n) { return Math.floor(Math.random() * n); }
  function chance(pct) { return Math.random() * 100 < pct; }
  function stageMul(s) { s = Math.max(-6, Math.min(6, s)); return s >= 0 ? (2 + s) / 2 : 2 / (2 - s); }

  function newSide(party, isPlayer) {
    return { party, i: 0, isPlayer, stages: freshStages(), flinch: false };
  }
  function freshStages() { return { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 }; }

  function create(cfg) {
    const b = {
      player: newSide(cfg.playerParty, true),
      foe: newSide(cfg.foeParty, false),
      kind: cfg.kind || 'wild',       // 'wild' | 'trainer'
      foeName: cfg.foeName || '',
      trainerClass: cfg.trainerClass || '',
      canCatch: cfg.kind !== 'trainer',
      dreamForest: !!cfg.dreamForest, // Entree Forest: a ball never fails
      money: cfg.money || 0,          // prize for trainer
      over: false,
      result: null,
      runAttempts: 0,
      turn: 0,
    };
    return b;
  }

  const active = (side) => side.party[side.i];
  function firstHealthy(side) { return side.party.findIndex((m) => m.hp > 0); }
  function anyHealthy(side) { return side.party.some((m) => m.hp > 0); }

  function effStat(mon, side, key) {
    const base = key === 'atk' ? mon.stats.atk : key === 'def' ? mon.stats.def
      : key === 'spa' ? mon.stats.spa : key === 'spd' ? mon.stats.spd : mon.stats.spe;
    let v = base * stageMul(side.stages[key]);
    if (key === 'spe' && mon.status === 'par') v *= 0.25;
    return v;
  }

  // Abilities that boost same-type moves in a pinch (HP <= 1/3).
  const PINCH = { Blaze: 'fire', Overgrow: 'grass', Torrent: 'water', Swarm: 'bug' };

  function damage(attacker, aside, defender, dside, move) {
    const m = G.move(move);
    const isPhys = m.cat === 'phys';
    if (m.type === 'ground' && defender.ability === 'Levitate') return { dmg: 0, eff: 0, crit: false };
    let A = effStat(attacker, aside, isPhys ? 'atk' : 'spa');
    const D = effStat(defender, dside, isPhys ? 'def' : 'spd');
    if (isPhys && attacker.ability === 'Guts' && attacker.status) A *= 1.5;
    const eff = G.typeEff(m.type, defender.types);
    if (eff === 0) return { dmg: 0, eff, crit: false };
    const stab = attacker.types.indexOf(m.type) >= 0 ? 1.5 : 1;
    const critRate = m.eff && m.eff.highCrit ? 0.125 : 0.0625;
    const crit = Math.random() < critRate;
    const rnd = (85 + rand(16)) / 100;
    let base = Math.floor(Math.floor(Math.floor((2 * attacker.level / 5 + 2) * m.power * A / D) / 50) + 2);
    let mod = stab * eff * rnd * (crit ? 1.5 : 1);
    if (attacker.status === 'brn' && isPhys && attacker.ability !== 'Guts') mod *= 0.5;
    if (PINCH[attacker.ability] === m.type && attacker.hp <= attacker.stats.maxHp / 3) mod *= 1.5;
    return { dmg: Math.max(1, Math.floor(base * mod)), eff, crit };
  }

  // Switch-in abilities (Intimidate). Returns events; safe to call anytime.
  function entryFor(b, side, other, ev) {
    const mon = active(side);
    if (!mon || mon.hp <= 0) return;
    if (mon.ability === 'Intimidate' && active(other) && active(other).hp > 0) {
      const before = other.stages.atk;
      other.stages.atk = Math.max(-6, before - 1);
      if (other.stages.atk !== before) {
        const who = (side.isPlayer ? '' : 'Foe ') + P().displayName(mon);
        const tgt = (other.isPlayer ? '' : 'the foe\'s');
        ev.push({ t: 'stat', side: other.isPlayer ? 'player' : 'foe', stat: 'atk', delta: -1 });
        ev.push({ t: 'text', s: who + '\'s Intimidate lowered ' + (other.isPlayer ? 'your Pokémon\'s' : tgt) + ' Attack!' });
      }
    }
  }
  function entryEvents(b, which) {
    const ev = [];
    if (!which || which === 'foe') entryFor(b, b.foe, b.player, ev);
    if (!which || which === 'player') entryFor(b, b.player, b.foe, ev);
    return ev;
  }

  function accuracyHit(attacker, aside, defender, dside, move) {
    const m = G.move(move);
    if (m.acc == null || m.acc > 100) return true; // never-miss (e.g. Aerial Ace 101)
    const ratio = stageMul(aside.stages.acc) / stageMul(dside.stages.eva);
    return Math.random() * 100 < m.acc * ratio;
  }

  // Foe AI: score each move by expected effectiveness; pick the best.
  function aiChoose(b) {
    const foe = active(b.foe), ply = active(b.player);
    let best = -1, choice = 0;
    active(b.foe).moves.forEach((mv, idx) => {
      if (mv.pp <= 0) return;
      const m = G.move(mv.key);
      let score;
      if (m.cat === 'status') {
        score = (m.eff && m.eff.status && !ply.status) ? 25 + rand(15) : 8 + rand(10);
      } else {
        const eff = G.typeEff(m.type, ply.types);
        const stab = foe.types.indexOf(m.type) >= 0 ? 1.5 : 1;
        score = m.power * eff * stab * (0.85 + Math.random() * 0.3);
      }
      if (score > best) { best = score; choice = idx; }
    });
    return { type: 'move', index: choice };
  }

  function pushMoveEvents(b, aside, dside, moveIndex, ev) {
    const attacker = active(aside), defender = active(dside);
    const mvSlot = attacker.moves[moveIndex];
    if (!mvSlot) return;
    const m = G.move(mvSlot.key);
    const aname = (aside.isPlayer ? '' : (b.kind === 'trainer' ? 'Foe ' : 'Wild ')) + P().displayName(attacker);

    // Can it move? (status)
    if (attacker.status === 'slp') {
      if (attacker.statusCounter > 0) { attacker.statusCounter--; }
      if (attacker.statusCounter > 0) { ev.push({ t: 'text', s: aname + ' is fast asleep.' }); return; }
      ev.push({ t: 'text', s: aname + ' woke up!' }); attacker.status = null;
    }
    if (attacker.status === 'frz') {
      if (m.type === 'fire' || chance(20)) { ev.push({ t: 'text', s: aname + ' thawed out!' }); attacker.status = null; }
      else { ev.push({ t: 'text', s: aname + ' is frozen solid!' }); return; }
    }
    if (attacker.status === 'par' && chance(25)) { ev.push({ t: 'text', s: aname + ' is paralyzed! It can\'t move!' }); return; }
    if (aside.flinch) { ev.push({ t: 'text', s: aname + ' flinched!' }); return; }

    if (mvSlot.pp <= 0) { ev.push({ t: 'text', s: aname + ' has no PP left!' }); return; }
    mvSlot.pp--;
    ev.push({ t: 'move', side: aside.isPlayer ? 'player' : 'foe', move: mvSlot.key, name: m.name, user: aname });

    // Accuracy
    if (m.cat !== 'status' || (m.eff && (m.eff.status || m.eff.stat && m.eff.target === 'foe'))) {
      if (!accuracyHit(attacker, aside, defender, dside, mvSlot.key)) {
        ev.push({ t: 'text', s: aname + '\'s attack missed!' }); return;
      }
    }

    // Damage
    let dealt = 0;
    if (m.cat !== 'status' && m.power > 0) {
      if (m.eff && m.eff.needsSleep && defender.status !== 'slp') { ev.push({ t: 'text', s: 'But it failed!' }); return; }
      const hits = m.eff && m.eff.multi ? m.eff.multi : 1;
      let totalEff = 1, anyCrit = false, sturdy = false;
      for (let h = 0; h < hits; h++) {
        if (defender.hp <= 0) break;
        const r = damage(attacker, aside, defender, dside, mvSlot.key);
        totalEff = r.eff; anyCrit = anyCrit || r.crit;
        if (r.eff === 0) { ev.push({ t: 'text', s: 'It doesn\'t affect ' + P().displayName(defender) + '...' }); return; }
        let dmgVal = r.dmg;
        if (defender.ability === 'Sturdy' && defender.hp === defender.stats.maxHp && dmgVal >= defender.hp) { dmgVal = defender.hp - 1; sturdy = true; }
        const prevHp = defender.hp;
        defender.hp = Math.max(0, defender.hp - dmgVal);
        dealt += (prevHp - defender.hp); // actual HP lost (for recoil/drain)
        ev.push({ t: 'hp', side: dside.isPlayer ? 'player' : 'foe', hp: defender.hp, max: defender.stats.maxHp, dmg: dmgVal });
      }
      if (anyCrit) ev.push({ t: 'text', s: 'A critical hit!' });
      if (sturdy) ev.push({ t: 'text', s: P().displayName(defender) + ' endured the hit with Sturdy!' });
      if (totalEff > 1) ev.push({ t: 'text', s: 'It\'s super effective!' });
      else if (totalEff < 1) ev.push({ t: 'text', s: 'It\'s not very effective...' });
      if (m.eff && m.eff.multi) ev.push({ t: 'text', s: 'Hit ' + m.eff.multi + ' times!' });
    }

    // Faint check on defender before applying secondary effects.
    if (defender.hp <= 0) { applyEndOfMove(b, attacker, aside, dealt, m, ev); ev.push({ t: 'faint', side: dside.isPlayer ? 'player' : 'foe', name: P().displayName(defender) }); return; }

    // Secondary / status-move effects
    applyEffect(b, attacker, aside, defender, dside, m, dealt, ev);
    applyEndOfMove(b, attacker, aside, dealt, m, ev);
  }

  function applyEndOfMove(b, attacker, aside, dealt, m, ev) {
    if (m.eff && m.eff.recoil && dealt > 0) {
      const rec = Math.max(1, Math.floor(dealt * m.eff.recoil));
      attacker.hp = Math.max(0, attacker.hp - rec);
      ev.push({ t: 'text', s: P().displayName(attacker) + ' is hit with recoil!' });
      ev.push({ t: 'hp', side: aside.isPlayer ? 'player' : 'foe', hp: attacker.hp, max: attacker.stats.maxHp, dmg: rec });
      if (attacker.hp <= 0) ev.push({ t: 'faint', side: aside.isPlayer ? 'player' : 'foe', name: P().displayName(attacker) });
    }
    if (m.eff && m.eff.drain && dealt > 0) {
      const heal = Math.max(1, Math.floor(dealt * m.eff.drain));
      const before = attacker.hp;
      attacker.hp = Math.min(attacker.stats.maxHp, attacker.hp + heal);
      if (attacker.hp !== before) {
        ev.push({ t: 'text', s: P().displayName(attacker) + ' drained energy!' });
        ev.push({ t: 'hp', side: aside.isPlayer ? 'player' : 'foe', hp: attacker.hp, max: attacker.stats.maxHp });
      }
    }
  }

  function setStatus(mon, side, status, ev, targetName) {
    if (mon.status) return false;
    if (status === 'brn' && mon.types.indexOf('fire') >= 0) return false;
    if (status === 'frz' && mon.types.indexOf('ice') >= 0) return false;
    if ((status === 'par') && mon.types.indexOf('electric') >= 0 && false) return false;
    mon.status = status;
    if (status === 'slp') mon.statusCounter = 1 + rand(3);
    if (status === 'tox') mon.statusCounter = 1;
    const label = { brn: 'was burned!', par: 'is paralyzed! It may be unable to move!', psn: 'was poisoned!', tox: 'was badly poisoned!', slp: 'fell asleep!', frz: 'was frozen solid!' };
    ev.push({ t: 'status', side: side.isPlayer ? 'player' : 'foe', status });
    ev.push({ t: 'text', s: targetName + ' ' + label[status] });
    return true;
  }

  function applyEffect(b, attacker, aside, defender, dside, m, dealt, ev) {
    const e = m.eff; if (!e) return;
    const foeName = (dside.isPlayer ? '' : (b.kind === 'trainer' ? 'Foe ' : 'Wild ')) + P().displayName(defender);
    const selfName = (aside.isPlayer ? '' : (b.kind === 'trainer' ? 'Foe ' : 'Wild ')) + P().displayName(attacker);
    const roll = (c) => c == null ? true : chance(c);

    if (e.status && roll(e.chance)) {
      const tgt = (m.cat === 'status') ? defender : defender; // all our status moves target foe
      const tside = dside;
      setStatus(tgt, tside, e.status, ev, foeName);
    }
    const doStat = (spec, isSelf) => {
      const tgt = isSelf ? attacker : defender;
      const tside = isSelf ? aside : dside;
      const tname = isSelf ? selfName : foeName;
      const before = tside.stages[spec.stat];
      tside.stages[spec.stat] = Math.max(-6, Math.min(6, before + spec.stage));
      const delta = tside.stages[spec.stat] - before;
      if (delta === 0) { ev.push({ t: 'text', s: tname + '\'s ' + statLabel(spec.stat) + ' won\'t go ' + (spec.stage > 0 ? 'higher' : 'lower') + '!' }); return; }
      const word = spec.stage > 0 ? (spec.stage >= 2 ? 'sharply rose' : 'rose') : (spec.stage <= -2 ? 'harshly fell' : 'fell');
      ev.push({ t: 'stat', side: tside.isPlayer ? 'player' : 'foe', stat: spec.stat, delta });
      ev.push({ t: 'text', s: tname + '\'s ' + statLabel(spec.stat) + ' ' + word + '!' });
    };
    if (e.stat && roll(e.chance)) {
      const isSelf = e.target === 'self';
      doStat({ stat: e.stat, stage: e.stage }, isSelf);
      if (e.also) doStat({ stat: e.also.stat, stage: e.also.stage }, isSelf);
    }
    if (e.heal) {
      const before = attacker.hp;
      attacker.hp = Math.min(attacker.stats.maxHp, attacker.hp + Math.floor(attacker.stats.maxHp * e.heal));
      if (attacker.hp !== before) { ev.push({ t: 'text', s: selfName + ' regained health!' }); ev.push({ t: 'hp', side: aside.isPlayer ? 'player' : 'foe', hp: attacker.hp, max: attacker.stats.maxHp }); }
    }
    if (e.flinch && defender.hp > 0 && roll(e.flinch)) { dside.flinch = true; }
  }

  function statLabel(s) { return { atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', acc: 'accuracy', eva: 'evasiveness' }[s]; }

  function endOfTurn(b, side, ev) {
    const mon = active(side); if (mon.hp <= 0) return;
    const name = (side.isPlayer ? '' : (b.kind === 'trainer' ? 'Foe ' : 'Wild ')) + P().displayName(mon);
    if (mon.status && mon.ability === 'Shed Skin' && chance(30)) {
      mon.status = null; mon.statusCounter = 0;
      ev.push({ t: 'status', side: side.isPlayer ? 'player' : 'foe' });
      ev.push({ t: 'text', s: name + ' shed its skin and recovered!' });
    }
    if (mon.status === 'brn' || mon.status === 'psn') {
      const dmg = Math.max(1, Math.floor(mon.stats.maxHp / (mon.status === 'brn' ? 16 : 8)));
      mon.hp = Math.max(0, mon.hp - dmg);
      ev.push({ t: 'text', s: name + ' is hurt by its ' + (mon.status === 'brn' ? 'burn!' : 'poison!') });
      ev.push({ t: 'hp', side: side.isPlayer ? 'player' : 'foe', hp: mon.hp, max: mon.stats.maxHp, dmg });
    } else if (mon.status === 'tox') {
      const dmg = Math.max(1, Math.floor(mon.stats.maxHp * mon.statusCounter / 16));
      mon.statusCounter++;
      mon.hp = Math.max(0, mon.hp - dmg);
      ev.push({ t: 'text', s: name + ' is hurt by poison!' });
      ev.push({ t: 'hp', side: side.isPlayer ? 'player' : 'foe', hp: mon.hp, max: mon.stats.maxHp, dmg });
    }
    if (mon.hp <= 0) ev.push({ t: 'faint', side: side.isPlayer ? 'player' : 'foe', name: P().displayName(mon) });
  }

  // Award exp to the player's active mon when a foe faints.
  function awardExp(b, faintedFoe, ev) {
    const winner = active(b.player);
    if (winner.hp <= 0) return;
    const s = G.species(faintedFoe.species);
    const gain = Math.floor((s.exp * faintedFoe.level) / 5) * (b.kind === 'trainer' ? 1.5 : 1);
    ev.push({ t: 'text', s: P().displayName(winner) + ' gained ' + gain + ' EXP!' });
    const events = P().gainExp(winner, gain);
    events.forEach((e2) => {
      if (e2.type === 'level') ev.push({ t: 'text', s: P().displayName(winner) + ' grew to Lv. ' + e2.level + '!', level: true });
      else if (e2.type === 'learn') ev.push({ t: 'text', s: P().displayName(winner) + ' learned ' + G.move(e2.key).name + '!' });
      else if (e2.type === 'learnFull') ev.push({ t: 'learnprompt', mon: winner, key: e2.key });
      else if (e2.type === 'evolve') ev.push({ t: 'evolve', mon: winner, to: e2.to });
    });
  }

  // ---- Public turn resolution ----
  function playerMove(b, action, ev) {
    // returns true if the player's action consumes the turn (move) vs instant (switch/item handled outside)
    return action;
  }

  function doTurn(b, action) {
    const ev = [];
    b.turn++;
    const ply = b.player, foe = b.foe;
    ply.flinch = false; foe.flinch = false;

    // Non-attacking player actions resolve first, then foe attacks.
    let playerActed = false;
    if (action.type === 'switch') {
      const idx = action.index;
      if (idx !== ply.i && ply.party[idx] && ply.party[idx].hp > 0) {
        ev.push({ t: 'text', s: P().displayName(active(ply)) + ', come back!' });
        ply.i = idx; ply.stages = freshStages();
        ev.push({ t: 'switch', side: 'player', monIndex: idx });
        ev.push({ t: 'text', s: 'Go! ' + P().displayName(active(ply)) + '!' });
        entryFor(b, ply, foe, ev);
      }
      playerActed = true;
    } else if (action.type === 'item') {
      applyItem(b, action, ev);
      playerActed = true;
    } else if (action.type === 'ball') {
      const caught = tryCatch(b, action.item, ev);
      if (caught) { b.over = true; b.result = 'caught'; ev.push({ t: 'end', result: 'caught' }); return finalize(b, ev); }
      playerActed = true; // failed catch consumes turn
    } else if (action.type === 'run') {
      if (b.kind === 'trainer') { ev.push({ t: 'text', s: 'You can\'t run from a Trainer battle!' }); return { events: ev }; }
      b.runAttempts++;
      const pSpe = active(ply).stats.spe, fSpe = active(foe).stats.spe;
      const odds = pSpe > fSpe ? 100 : 50 + b.runAttempts * 15 + (pSpe - fSpe);
      if (chance(odds)) { ev.push({ t: 'text', s: 'Got away safely!' }); b.over = true; b.result = 'ran'; ev.push({ t: 'end', result: 'ran' }); return finalize(b, ev); }
      ev.push({ t: 'text', s: 'Can\'t escape!' });
      playerActed = true;
    }

    const foeAction = aiChoose(b);

    if (action.type === 'move' && !playerActed) {
      // Determine order by priority then speed.
      const pm = G.move(active(ply).moves[action.index].key);
      const fm = G.move(active(foe).moves[foeAction.index].key);
      const pPri = (pm.eff && pm.eff.priority) || 0;
      const fPri = (fm.eff && fm.eff.priority) || 0;
      let playerFirst;
      if (pPri !== fPri) playerFirst = pPri > fPri;
      else {
        const ps = effStat(active(ply), ply, 'spe'), fs = effStat(active(foe), foe, 'spe');
        playerFirst = ps === fs ? Math.random() < 0.5 : ps > fs;
      }
      const order = playerFirst
        ? [[ply, foe, action.index], [foe, ply, foeAction.index]]
        : [[foe, ply, foeAction.index], [ply, foe, action.index]];
      for (const [aside, dside, mi] of order) {
        if (b.over) break;
        if (active(aside).hp <= 0 || active(dside).hp <= 0) continue;
        pushMoveEvents(b, aside, dside, mi, ev);
        checkFaints(b, ev);
        if (b.over) break;
      }
    } else if (playerActed && !b.over) {
      // Foe still gets to attack after a switch/item/failed-catch/failed-run.
      if (active(foe).hp > 0 && active(ply).hp > 0) {
        pushMoveEvents(b, foe, ply, foeAction.index, ev);
        checkFaints(b, ev);
      }
    }

    if (b.over) return finalize(b, ev);

    // End-of-turn residual damage (player then foe).
    endOfTurn(b, ply, ev); checkFaints(b, ev);
    if (!b.over) { endOfTurn(b, foe, ev); checkFaints(b, ev); }

    if (b.over) return finalize(b, ev);
    return { events: ev, needsPlayerSwitch: active(ply).hp <= 0, needsFoeSwitch: active(foe).hp <= 0 };
  }

  function checkFaints(b, ev) {
    // Foe active fainted -> award exp, maybe next foe, else win.
    if (active(b.foe).hp <= 0) {
      const fainted = active(b.foe);
      awardExp(b, fainted, ev);
      const next = firstHealthy(b.foe);
      if (next >= 0 && next !== b.foe.i) {
        if (b.kind === 'trainer') {
          b.foe.i = next; b.foe.stages = freshStages();
          ev.push({ t: 'text', s: (b.foeName || 'Trainer') + ' sent out ' + P().displayName(active(b.foe)) + '!' });
          ev.push({ t: 'switch', side: 'foe', monIndex: next });
          entryFor(b, b.foe, b.player, ev);
        }
      } else if (!anyHealthy(b.foe)) {
        b.over = true; b.result = 'win';
        if (b.kind === 'trainer') ev.push({ t: 'text', s: 'You defeated ' + (b.foeName || 'the Trainer') + '!' });
        ev.push({ t: 'end', result: 'win' });
      }
    }
    if (active(b.player).hp <= 0 && !anyHealthy(b.player)) {
      b.over = true; b.result = 'lose';
      ev.push({ t: 'text', s: 'You have no Pokémon left!' });
      ev.push({ t: 'end', result: 'lose' });
    }
  }

  function forceSwitch(b, side, index) {
    const s = side === 'player' ? b.player : b.foe;
    s.i = index; s.stages = freshStages();
    return active(s);
  }

  function applyItem(b, action, ev) {
    const it = G.ITEMS[action.item];
    const mon = b.player.party[action.targetIndex != null ? action.targetIndex : b.player.i];
    if (!it || !mon) return;
    if (it.kind === 'heal') {
      const before = mon.hp;
      mon.hp = Math.min(mon.stats.maxHp, mon.hp + it.amount);
      if (it.cure) { mon.status = null; mon.statusCounter = 0; }
      ev.push({ t: 'text', s: 'Used ' + it.name + ' on ' + P().displayName(mon) + '.' });
      ev.push({ t: 'hp', side: 'player', hp: mon.hp, max: mon.stats.maxHp });
    } else if (it.kind === 'revive') {
      mon.hp = Math.max(1, Math.floor(mon.stats.maxHp * it.amount)); mon.status = null;
      ev.push({ t: 'text', s: P().displayName(mon) + ' was revived!' });
      ev.push({ t: 'hp', side: 'player', hp: mon.hp, max: mon.stats.maxHp });
    } else if (it.kind === 'cure') {
      if (it.status.indexOf(mon.status) >= 0) { mon.status = null; mon.statusCounter = 0; ev.push({ t: 'text', s: P().displayName(mon) + ' was cured!' }); }
    }
  }

  function tryCatch(b, ballKey, ev) {
    const foe = active(b.foe);
    const ball = G.ITEMS[ballKey] || { bonus: 1, name: 'Poké Ball' };
    ev.push({ t: 'text', s: 'You threw a ' + ball.name + '!' });
    ev.push({ t: 'ballthrow' });
    const s = G.species(foe.species);
    const statusBonus = (foe.status === 'slp' || foe.status === 'frz') ? 2.5 : (foe.status ? 1.5 : 1);
    const a = ((3 * foe.stats.maxHp - 2 * foe.hp) * s.catchRate * ball.bonus * statusBonus) / (3 * foe.stats.maxHp);
    let shakes = 0;
    if (b.dreamForest) shakes = 4; // Entree Forest: never fails
    else if (a >= 255) shakes = 4;
    else {
      const bVal = 1048560 / Math.sqrt(Math.sqrt(16711680 / a));
      for (let i = 0; i < 4; i++) { if (rand(65536) < bVal) shakes++; else break; }
    }
    ev.push({ t: 'shakes', n: Math.min(shakes, 3) });
    if (shakes >= 4) { ev.push({ t: 'text', s: 'Gotcha! ' + foe.species + ' was caught!' }); b.caught = foe; return true; }
    ev.push({ t: 'text', s: ['Oh no! It broke free!', 'Aww! So close!', 'Argh! Almost had it!'][Math.min(shakes, 2)] });
    return false;
  }

  function finalize(b, ev) { return { events: ev, over: true, result: b.result }; }

  G.battle = { create, doTurn, forceSwitch, active, firstHealthy, anyHealthy, tryCatch, stageMul, damage, entryEvents, typeEff: G.typeEff };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* tiles.js — tile definitions (collision / terrain / HM obstacles) and their
 * procedural drawing. Warps, signs and NPCs are defined in map data instead. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  // meta: solid (blocks walking), terrain: 'grass'|'water'|'waterfall'|'cut'|
  // 'boulder'|'ledge'|null. draw(ctx, px, py, ts, time)
  const T = {};
  function def(ch, meta, draw) { T[ch] = Object.assign({ ch, solid: false, terrain: null }, meta, { draw }); }

  const rr = (ctx, x, y, w, h, r) => G.sprites.roundRect(ctx, x, y, w, h, r);

  // --- ground / walkable ---
  def('.', {}, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#72b861'); });
  def('P', {}, (c, x, y, s) => { c.fillStyle = '#e6d3a0'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#dcc78f'); });
  def('f', {}, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); flower(c, x, y, s); });
  def('d', {}, (c, x, y, s) => { c.fillStyle = '#e8cf95'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#dcc084'); });
  def('%', {}, (c, x, y, s) => { c.fillStyle = '#dcc088'; c.fillRect(x, y, s, s); });
  def('C', {}, (c, x, y, s) => { c.fillStyle = '#6b6472'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#615a68'); });
  def('G', {}, (c, x, y, s) => { c.fillStyle = '#cdd6e6'; c.fillRect(x, y, s, s); c.strokeStyle = '#b7c2d6'; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, s - 1, s - 1); });
  def('M', {}, (c, x, y, s) => { c.fillStyle = '#f0e6d2'; c.fillRect(x, y, s, s); c.strokeStyle = '#e2d4ba'; c.strokeRect(x + .5, y + .5, s - 1, s - 1); });
  def('=', {}, (c, x, y, s) => { c.fillStyle = '#c69a63'; c.fillRect(x, y, s, s); c.fillStyle = '#b3854f'; for (let i = 0; i < s; i += 6) c.fillRect(x, y + i, s, 2); });

  // --- encounter terrain ---
  def(',', { terrain: 'grass' }, (c, x, y, s) => { c.fillStyle = '#5aa653'; c.fillRect(x, y, s, s); blades(c, x, y, s, '#4a9146'); });
  def('q', { terrain: 'grass' }, (c, x, y, s) => { c.fillStyle = '#d8b877'; c.fillRect(x, y, s, s); blades(c, x, y, s, '#c8a862'); });
  def('c', { terrain: 'grass' }, (c, x, y, s) => { c.fillStyle = '#5a5462'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#4d4753'); });

  // --- solid scenery ---
  def('#', { solid: true }, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); tree(c, x, y, s, '#2f8f4e', '#256f3d'); });
  def('T', { solid: true, terrain: 'cut' }, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); tree(c, x, y, s, '#3aa85e', '#2c8347'); c.fillStyle = '#f4d23c'; c.font = (s * 0.3) + 'px sans-serif'; });
  def('R', { solid: true }, (c, x, y, s) => { c.fillStyle = '#9a8f7d'; c.fillRect(x, y, s, s); c.fillStyle = '#847a68'; c.fillRect(x, y, s, s * 0.4); c.strokeStyle = '#6f6558'; c.strokeRect(x + .5, y + .5, s - 1, s - 1); });
  def('B', { solid: true, terrain: 'boulder' }, (c, x, y, s) => { c.fillStyle = '#e8cf95'; c.fillRect(x, y, s, s); c.fillStyle = '#9a8c74'; c.beginPath(); c.arc(x + s / 2, y + s / 2, s * 0.34, 0, 7); c.fill(); c.fillStyle = '#b0a488'; c.beginPath(); c.arc(x + s * 0.42, y + s * 0.42, s * 0.12, 0, 7); c.fill(); });
  def('H', { solid: true }, (c, x, y, s) => { c.fillStyle = '#d9d2c4'; c.fillRect(x, y, s, s); c.strokeStyle = '#b8ae9c'; c.strokeRect(x + .5, y + .5, s - 1, s - 1); });
  def('r', { solid: true }, (c, x, y, s) => { c.fillStyle = '#c9556a'; c.fillRect(x, y, s, s); c.fillStyle = '#b3435a'; c.fillRect(x, y, s, s * 0.5); });
  def('g', { solid: true }, (c, x, y, s) => { c.fillStyle = '#8fa0bd'; c.fillRect(x, y, s, s); c.strokeStyle = '#7688a6'; c.strokeRect(x + .5, y + .5, s - 1, s - 1); });
  def('n', { solid: true }, (c, x, y, s) => { c.fillStyle = '#b98a5a'; c.fillRect(x, y, s, s); c.fillStyle = '#a5794c'; c.fillRect(x, y + s * 0.6, s, s * 0.4); });
  def(' ', { solid: true }, (c, x, y, s) => { c.fillStyle = '#12131a'; c.fillRect(x, y, s, s); });

  // --- water / waterfall ---
  const drawWater = (c, x, y, s, time) => {
    c.fillStyle = '#4d90d5'; c.fillRect(x, y, s, s);
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2;
    const off = Math.sin((time || 0) / 400 + (x + y) * 0.05) * 2;
    c.beginPath(); c.moveTo(x + 2, y + s * 0.35 + off); c.lineTo(x + s - 2, y + s * 0.35 + off); c.stroke();
    c.beginPath(); c.moveTo(x + 2, y + s * 0.7 - off); c.lineTo(x + s - 2, y + s * 0.7 - off); c.stroke();
  };
  def('W', { solid: true, terrain: 'water' }, drawWater);
  def('~', { solid: true, terrain: 'water' }, drawWater);
  def('F', { solid: true, terrain: 'waterfall' }, (c, x, y, s, time) => {
    c.fillStyle = '#6fb0e6'; c.fillRect(x, y, s, s);
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 2;
    const o = ((time || 0) / 60) % s;
    for (let i = -s; i < s; i += 6) { c.beginPath(); c.moveTo(x + 3, y + ((i + o) % s + s) % s); c.lineTo(x + 3, y + ((i + o) % s + s) % s + 3); c.stroke(); }
    for (let gx = 6; gx < s; gx += 7) for (let i = -s; i < s; i += 8) { c.beginPath(); c.moveTo(x + gx, y + ((i + o) % s + s) % s); c.lineTo(x + gx, y + ((i + o) % s + s) % s + 3); c.stroke(); }
  });

  // --- doors / signs / ledges (walkability handled here; warps in map data) ---
  def('D', {}, (c, x, y, s) => { c.fillStyle = '#d9d2c4'; c.fillRect(x, y, s, s); c.fillStyle = '#5a4632'; rr(c, x + s * 0.22, y + s * 0.15, s * 0.56, s * 0.85, s * 0.06); c.fill(); c.fillStyle = '#c9a24a'; c.beginPath(); c.arc(x + s * 0.66, y + s * 0.58, s * 0.05, 0, 7); c.fill(); });
  def('^', {}, (c, x, y, s) => { c.fillStyle = '#9a8f7d'; c.fillRect(x, y, s, s); c.fillStyle = '#7a7062'; c.beginPath(); c.moveTo(x + s / 2, y + s * 0.2); c.lineTo(x + s * 0.8, y + s * 0.7); c.lineTo(x + s * 0.2, y + s * 0.7); c.closePath(); c.fill(); });
  def('S', { solid: true, terrain: 'sign' }, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); c.fillStyle = '#8a6a3f'; c.fillRect(x + s * 0.42, y + s * 0.5, s * 0.16, s * 0.4); c.fillStyle = '#c79a5a'; rr(c, x + s * 0.2, y + s * 0.2, s * 0.6, s * 0.42, 3); c.fill(); c.fillStyle = '#5a4632'; c.fillRect(x + s * 0.28, y + s * 0.3, s * 0.44, 2); c.fillRect(x + s * 0.28, y + s * 0.4, s * 0.34, 2); });
  def('L', { terrain: 'ledge' }, (c, x, y, s) => { c.fillStyle = '#7dc36a'; c.fillRect(x, y, s, s); c.fillStyle = '#5f9e4f'; c.fillRect(x, y + s * 0.7, s, s * 0.3); c.fillStyle = '#4d8a40'; c.fillRect(x, y + s * 0.7, s, 3); });

  // --- Entralink tiles ---
  def('e', {}, (c, x, y, s) => { c.fillStyle = '#463f6e'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#3d3760'); });
  def('E', {}, (c, x, y, s) => { c.fillStyle = '#575081'; c.fillRect(x, y, s, s); speckle(c, x, y, s, '#4c466f'); });
  def('k', {}, (c, x, y, s) => { c.fillStyle = '#355261'; c.fillRect(x, y, s, s); blades(c, x, y, s, '#457587'); });
  def('o', { solid: true }, (c, x, y, s) => {
    c.fillStyle = '#241f38'; c.fillRect(x, y, s, s);
    c.fillStyle = '#181426'; c.fillRect(x + s * 0.44, y + s * 0.55, s * 0.12, s * 0.35);
    c.fillStyle = '#2f2950'; c.beginPath(); c.arc(x + s / 2, y + s * 0.42, s * 0.36, 0, 7); c.fill();
    c.fillStyle = '#3a3462'; c.beginPath(); c.arc(x + s * 0.42, y + s * 0.36, s * 0.26, 0, 7); c.fill();
  });
  def('Y', { solid: true, terrain: 'entree' }, (c, x, y, s, time) => {
    c.fillStyle = '#463f6e'; c.fillRect(x, y, s, s);
    const pulse = 0.75 + 0.25 * Math.sin((time || 0) / 500);
    c.fillStyle = 'rgba(180,220,255,' + (0.25 * pulse) + ')'; c.beginPath(); c.arc(x + s / 2, y + s / 2, s * 0.55, 0, 7); c.fill();
    c.fillStyle = '#b9d2ea'; c.fillRect(x + s * 0.44, y + s * 0.6, s * 0.12, s * 0.35);
    c.fillStyle = '#cfe6ff'; c.beginPath(); c.arc(x + s / 2, y + s * 0.4, s * 0.34, 0, 7); c.fill();
    c.fillStyle = '#e8f4ff'; c.beginPath(); c.arc(x + s * 0.42, y + s * 0.34, s * 0.2, 0, 7); c.fill();
  });
  def('b', {}, (c, x, y, s) => {
    c.fillStyle = '#e8ecf6'; c.fillRect(x, y, s, s);
    c.fillStyle = '#c9d2e6'; for (let i = 2; i < s; i += 5) c.fillRect(x, y + i, s, 1);
    c.fillStyle = '#aab6d0'; c.fillRect(x, y, s, 2); c.fillRect(x, y + s - 2, s, 2);
  });
  def('v', {}, (c, x, y, s, time) => {
    c.fillStyle = '#463f6e'; c.fillRect(x, y, s, s);
    const p = 0.5 + 0.5 * Math.sin((time || 0) / 300);
    c.fillStyle = 'rgba(120,240,255,' + (0.15 + 0.15 * p) + ')'; c.beginPath(); c.arc(x + s / 2, y + s / 2, s * 0.3, 0, 7); c.fill();
    c.strokeStyle = 'rgba(120,240,255,' + (0.5 + 0.4 * p) + ')'; c.lineWidth = 2;
    c.beginPath(); c.arc(x + s / 2, y + s / 2, s * 0.32, 0, 7); c.stroke();
  });

  // helpers
  function speckle(c, x, y, s, col) { c.fillStyle = col; for (let i = 0; i < 4; i++) { const rx = x + (((x * 7 + i * 53) % s)), ry = y + (((y * 11 + i * 31) % s)); c.fillRect(rx, ry, 2, 2); } }
  function blades(c, x, y, s, col) { c.strokeStyle = col; c.lineWidth = 1.5; for (let i = 0; i < 5; i++) { const bx = x + 3 + i * (s / 5); c.beginPath(); c.moveTo(bx, y + s - 2); c.lineTo(bx - 1, y + s * 0.5); c.stroke(); c.beginPath(); c.moveTo(bx + 2, y + s - 2); c.lineTo(bx + 3, y + s * 0.55); c.stroke(); } }
  function flower(c, x, y, s) { const cols = ['#f77', '#fd7', '#f9f', '#7cf']; for (let i = 0; i < 2; i++) { const fx = x + 5 + i * (s * 0.5), fy = y + 6 + (i % 2) * (s * 0.4); c.fillStyle = cols[(x + y + i) % cols.length]; c.beginPath(); c.arc(fx, fy, 2.5, 0, 7); c.fill(); c.fillStyle = '#fe4'; c.fillRect(fx - 1, fy - 1, 2, 2); } }
  function tree(c, x, y, s, top, bot) { c.fillStyle = '#6a4a2a'; c.fillRect(x + s * 0.44, y + s * 0.55, s * 0.12, s * 0.35); c.fillStyle = bot; c.beginPath(); c.arc(x + s / 2, y + s * 0.42, s * 0.36, 0, 7); c.fill(); c.fillStyle = top; c.beginPath(); c.arc(x + s * 0.42, y + s * 0.36, s * 0.28, 0, 7); c.fill(); }

  G.tiles = { get: (ch) => T[ch] || T[' '], all: T };
})();
</script>
<script>/* sprites.js — Pokémon battle sprites (official art + procedural fallback)
 * and procedural overworld character drawing. Browser-only. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const CDN = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
  const cache = new Map();

  function seeded(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.max(0, Math.min(255, (n >> 16) + amt));
    let g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    let b = Math.max(0, Math.min(255, (n & 255) + amt));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function proceduralDataURL(dex, types, size) {
    size = size || 128;
    const key = 'p' + dex + ':' + size;
    if (cache.has(key)) return cache.get(key);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    const rnd = seeded(dex * 97 + 13);
    const base = G.TYPE_COLOR[(types && types[0]) || 'normal'] || '#9fa19f';
    const cx = size / 2, cy = size / 2 + size * 0.05, rx = size * 0.32, ry = size * 0.3;
    ctx.fillStyle = base; ctx.strokeStyle = shade(base, -50); ctx.lineWidth = Math.max(2, size * 0.03);
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) { const a = (i / 16) * Math.PI * 2; const w = 1 + (rnd() - 0.5) * 0.18; const x = cx + Math.cos(a) * rx * w, y = cy + Math.sin(a) * ry * w; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shade(base, 45); ctx.beginPath(); ctx.ellipse(cx, cy + ry * 0.35, rx * 0.5, ry * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    for (const d of [-1, 1]) { ctx.fillStyle = shade(base, -12); ctx.beginPath(); ctx.moveTo(cx + d * rx * 0.55, cy - ry * 0.7); ctx.lineTo(cx + d * rx * 0.95, cy - ry * 1.35); ctx.lineTo(cx + d * rx * 0.2, cy - ry * 0.95); ctx.closePath(); ctx.fill(); }
    const eyeY = cy - ry * 0.15, eyeDX = rx * 0.4;
    for (const d of [-1, 1]) { ctx.fillStyle = '#20242b'; ctx.beginPath(); ctx.arc(cx + d * eyeDX, eyeY, size * 0.055, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + d * eyeDX - size * 0.018, eyeY - size * 0.018, size * 0.018, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,120,140,0.5)'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + d * rx * 0.62, eyeY + ry * 0.28, size * 0.045, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = '#20242b'; ctx.lineWidth = Math.max(1.5, size * 0.02); ctx.beginPath(); ctx.arc(cx, eyeY + ry * 0.25, size * 0.07, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    const url = c.toDataURL(); cache.set(key, url); return url;
  }

  function bank() { try { return window.SPRITE_DATA || (window.parent && window.parent.SPRITE_DATA); } catch (e) { return null; } }

  // Returns an <img>. Prefers embedded authentic Black/White pixel sprites
  // (front, or back for the player's own Pokémon); otherwise draws a
  // procedural creature and upgrades to official art if the network allows.
  function monImg(mon, size, opts) {
    opts = opts || {};
    const dex = mon.dex, types = mon.types;
    const img = document.createElement('img');
    img.className = 'mon-sprite' + (opts.className ? ' ' + opts.className : '');
    img.width = img.height = size || 128;
    img.alt = mon.species || '';
    img.draggable = false;
    const b = bank();
    const embedded = b && ((opts.back && b.back && b.back[dex]) || (b.front && b.front[dex]));
    if (embedded) { img.src = embedded; img.classList.add('pixel'); return img; }
    img.src = proceduralDataURL(dex, types, (size || 128) * 1.5);
    if (dex && !window.OFFLINE_SPRITES) {
      const loader = new Image();
      loader.onload = () => { img.src = CDN + dex + '.png'; img.classList.add('official'); };
      loader.onerror = () => {};
      loader.src = CDN + dex + '.png';
    }
    return img;
  }

  // Draw a Pokémon sprite directly on the world canvas (Entree Forest, etc.).
  const tileImgCache = {};
  function monTileImage(dex) {
    if (tileImgCache[dex] !== undefined) return tileImgCache[dex];
    const b = bank();
    const src = b && b.front && b.front[dex];
    if (!src) { tileImgCache[dex] = null; return null; }
    const img = new Image();
    img.src = src;
    tileImgCache[dex] = img;
    return img;
  }
  function drawMonTile(ctx, dex, types, px, py, ts, time) {
    const bob = Math.sin((time || 0) / 320 + dex) * 1.5;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(px + ts / 2, py + ts * 0.92, ts * 0.32, ts * 0.1, 0, 0, 7); ctx.fill();
    const img = monTileImage(dex);
    if (img && img.complete && img.naturalWidth) {
      const prev = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = false;
      const size = ts * 1.5;
      ctx.drawImage(img, px - (size - ts) / 2, py - (size - ts) + bob, size, size);
      ctx.imageSmoothingEnabled = prev;
    } else {
      ctx.fillStyle = G.TYPE_COLOR[(types && types[0]) || 'normal'] || '#9fa19f';
      ctx.beginPath(); ctx.arc(px + ts / 2, py + ts * 0.5 + bob, ts * 0.34, 0, 7); ctx.fill();
    }
    // sleepy "z"
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold ' + Math.round(ts * 0.4) + 'px sans-serif';
    ctx.fillText('z', px + ts * 0.78, py + bob + ts * 0.05);
  }

  // Draw a top-down trainer/NPC directly on a canvas ctx (tile-sized).
  function drawCharacter(ctx, px, py, ts, opts) {
    opts = opts || {};
    const dir = opts.dir || 'down';
    const body = opts.body || '#e05a6b';
    const hair = opts.hair || '#3a2b20';
    const skin = opts.skin || '#f2c79b';
    const step = opts.step || 0;
    const cx = px + ts / 2;
    const headR = ts * 0.22;
    const headY = py + ts * 0.34;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, py + ts * 0.9, ts * 0.28, ts * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = body;
    roundRect(ctx, cx - ts * 0.2, py + ts * 0.5, ts * 0.4, ts * 0.34, ts * 0.08); ctx.fill();
    // legs (little step animation)
    ctx.fillStyle = shade(body, -40);
    const off = step === 1 ? ts * 0.04 : step === 2 ? -ts * 0.04 : 0;
    ctx.fillRect(cx - ts * 0.16, py + ts * 0.82, ts * 0.12, ts * 0.12 + off);
    ctx.fillRect(cx + ts * 0.04, py + ts * 0.82, ts * 0.12, ts * 0.12 - off);
    // head
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(cx, headY, headR, 0, Math.PI * 2); ctx.fill();
    // hair
    ctx.fillStyle = hair;
    ctx.beginPath(); ctx.arc(cx, headY - headR * 0.25, headR, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillRect(cx - headR, headY - headR * 0.25, headR * 2, headR * 0.5);
    // face direction (eyes)
    ctx.fillStyle = '#2a2530';
    if (dir === 'down') { dot(ctx, cx - headR * 0.4, headY + headR * 0.15, ts * 0.03); dot(ctx, cx + headR * 0.4, headY + headR * 0.15, ts * 0.03); }
    else if (dir === 'up') { /* back of head, no eyes */ }
    else if (dir === 'left') { dot(ctx, cx - headR * 0.5, headY + headR * 0.1, ts * 0.03); }
    else { dot(ctx, cx + headR * 0.5, headY + headR * 0.1, ts * 0.03); }
  }
  function dot(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  G.sprites = { monImg, proceduralDataURL, drawCharacter, drawMonTile, roundRect, cdnUrl: (dex) => CDN + dex + '.png' };
})();
</script>

  function build(id) {
    const m = MAPS[id];
    if (!m) return null;
    if (!m._built) {
      m.id = id;
      m.h = m.rows.length;
      m.w = Math.max.apply(null, m.rows.map((r) => r.length));
      m.grid = m.rows.map((r) => r.padEnd(m.w, '#').split(''));
      // Stamp sign tiles so they are interactable/solid.
      (m.signs || []).forEach((s) => { if (m.grid[s.y] && !G.tiles.get(m.grid[s.y][s.x]).terrain) m.grid[s.y][s.x] = 'S'; });
      m._built = true;
    }
    return m;
  }
  function tileAt(m, x, y) { return (x < 0 || y < 0 || y >= m.h || x >= m.w) ? G.tiles.get(' ') : G.tiles.get(m.grid[y][x]); }
  function charAt(m, x, y) { return (x < 0 || y < 0 || y >= m.h || x >= m.w) ? ' ' : m.grid[y][x]; }
  function setChar(m, x, y, ch) { if (y >= 0 && y < m.h && x >= 0 && x < m.w) m.grid[y][x] = ch; }

  function validate() {
    const errs = [];
    Object.keys(MAPS).forEach((id) => {
      const m = build(id);
      const lens = new Set(m.rows.map((r) => r.length));
      if (lens.size > 1) errs.push(id + ': rows differ in length ' + JSON.stringify([...lens]));
      (m.warps || []).concat(m.surfExits || []).forEach((w) => {
        if (!MAPS[w.to]) { errs.push(id + ': warp -> unknown map ' + w.to); return; }
        const t = build(w.to);
        if (w.tx < 0 || w.ty < 0 || w.tx >= t.w || w.ty >= t.h) { errs.push(id + '->' + w.to + ': target OOB ' + JSON.stringify([w.tx, w.ty])); return; }
        const tt = G.tiles.get(t.grid[w.ty][w.tx]);
        if (tt.solid && tt.terrain !== 'water') errs.push(id + '->' + w.to + ': lands on SOLID "' + t.grid[w.ty][w.tx] + '" at ' + JSON.stringify([w.tx, w.ty]));
      });
      (m.npcs || []).forEach((n) => {
        if (n.x < 0 || n.y < 0 || n.x >= m.w || n.y >= m.h) { errs.push(id + ': npc ' + n.id + ' OOB'); return; }
        const nt = G.tiles.get(m.grid[n.y][n.x]);
        if (nt.solid && nt.terrain !== 'water') errs.push(id + ': npc ' + n.id + ' on SOLID "' + m.grid[n.y][n.x] + '" at ' + JSON.stringify([n.x, n.y]));
      });
    });
    return errs;
  }

  G.maps = { MAPS, build, tileAt, charAt, setChar, validate };
})();
</script>
<script>/* audio.js — WebAudio SFX + tiny procedural chiptune music loops.
 * No assets. Muted until first user gesture. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  let ctx = null, enabled = true, musicGain = null, musicTimer = null, currentTrack = null;

  function ac() {
    if (!enabled) return null;
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { enabled = false; return null; } try { ctx = new AC(); } catch (e) { enabled = false; return null; } }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, dur, type, gain, when, dest) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + (when || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.08, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(dest || c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }

  const SFX = {
    cursor: () => tone(680, 0.05, 'square', 0.04),
    select: () => { tone(720, 0.06, 'square', 0.06); tone(960, 0.08, 'square', 0.05, 0.05); },
    cancel: () => tone(360, 0.08, 'square', 0.05),
    bump: () => tone(150, 0.08, 'sawtooth', 0.05),
    step: () => tone(220, 0.03, 'sine', 0.02),
    hit: () => { tone(300, 0.08, 'square', 0.07); tone(200, 0.1, 'square', 0.05, 0.03); },
    superhit: () => { tone(500, 0.06, 'square', 0.08); tone(700, 0.06, 'square', 0.08, 0.05); tone(900, 0.1, 'square', 0.08, 0.1); },
    weakhit: () => tone(240, 0.12, 'sine', 0.05),
    faint: () => { tone(400, 0.15, 'sawtooth', 0.06); tone(260, 0.25, 'sawtooth', 0.06, 0.12); },
    heal: () => { tone(660, 0.09, 'sine', 0.07); tone(880, 0.09, 'sine', 0.07, 0.09); tone(1175, 0.16, 'sine', 0.07, 0.18); },
    coin: () => { tone(988, 0.06, 'square', 0.06); tone(1319, 0.12, 'square', 0.06, 0.05); },
    ball: () => { tone(500, 0.06, 'triangle', 0.06); tone(400, 0.06, 'triangle', 0.06, 0.08); },
    catchgood: () => { tone(660, 0.1, 'square', 0.08); tone(830, 0.1, 'square', 0.08, 0.1); tone(990, 0.1, 'square', 0.08, 0.2); tone(1320, 0.3, 'square', 0.08, 0.3); },
    win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.08, i * 0.12)); },
    warp: () => { tone(400, 0.1, 'sine', 0.06); tone(800, 0.2, 'sine', 0.06, 0.08); },
    hm: () => { tone(523, 0.1, 'triangle', 0.07); tone(784, 0.2, 'triangle', 0.07, 0.1); },
    evolve: () => { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'sine', 0.07, i * 0.15)); },
  };
  function play(name) { if (SFX[name]) try { SFX[name](); } catch (e) {} }

  // --- music: loop a simple bassline+arp per track ---
  const TRACKS = {
    town:   { tempo: 300, bass: [131, 131, 165, 196], arp: [523, 659, 784, 659] },
    route:  { tempo: 260, bass: [147, 110, 147, 175], arp: [587, 740, 880, 740] },
    battle: { tempo: 200, bass: [110, 110, 98, 98], arp: [440, 554, 659, 554] },
    league: { tempo: 220, bass: [98, 98, 110, 123], arp: [392, 494, 587, 494] },
    victory:{ tempo: 240, bass: [131, 165, 196, 262], arp: [523, 659, 784, 1047] },
    entralink: { tempo: 340, bass: [82, 98, 73, 110], arp: [330, 392, 494, 392] },
  };
  function startMusic(name) {
    if (currentTrack === name) return;
    stopMusic();
    const c = ac(); if (!c) { currentTrack = name; return; }
    currentTrack = name;
    const tk = TRACKS[name] || TRACKS.town;
    musicGain = c.createGain(); musicGain.gain.value = 0.5; musicGain.connect(c.destination);
    let step = 0;
    const interval = tk.tempo;
    musicTimer = setInterval(() => {
      if (!enabled || !musicGain) return;
      const b = tk.bass[step % tk.bass.length];
      const a = tk.arp[step % tk.arp.length];
      tone(b, interval / 1000 * 0.9, 'triangle', 0.05, 0, musicGain);
      tone(a, interval / 1000 * 0.5, 'square', 0.03, 0, musicGain);
      if (step % 2 === 0) tone(a * 2, interval / 1000 * 0.3, 'square', 0.02, interval / 2000, musicGain);
      step++;
    }, interval);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } if (musicGain) { try { musicGain.disconnect(); } catch (e) {} musicGain = null; } currentTrack = null; }
  function setEnabled(v) { enabled = !!v; if (!v) stopMusic(); }
  function isEnabled() { return enabled; }

  G.audio = { play, startMusic, stopMusic, setEnabled, isEnabled, resume: () => ac() };
})();
</script>
<script>/* gameui.js — DOM UI primitives for the RPG: dialogue box, choice menu,
 * confirm, toast, screen fade. Navigable by keyboard/touch via G.input.
 * While any modal is open, G.gui.isBusy() is true so the world pauses. */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  let host;
  const stack = []; // open modal controllers

  function ensure() {
    if (!host) { host = document.getElementById('game-ui') || document.body; }
    return host;
  }
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (Array.isArray(kids) ? kids : kids != null ? [kids] : []).forEach((c) => c != null && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  }
  function isBusy() { return stack.length > 0; }

  // Typewriter dialogue. `lines` is an array of strings.
  function dialogue(lines, opts) {
    opts = opts || {};
    lines = Array.isArray(lines) ? lines : [lines];
    return new Promise((resolve) => {
      let idx = 0, typing = false, full = '', shown = 0, timer = null;
      const nameTag = opts.speaker ? el('div', { class: 'dlg-name' }, opts.speaker) : null;
      const textEl = el('div', { class: 'dlg-text' });
      const arrow = el('div', { class: 'dlg-arrow' }, '▼');
      const box = el('div', { class: 'dialogue' + (opts.className ? ' ' + opts.className : '') }, [nameTag, textEl, arrow]);
      const wrap = el('div', { class: 'ui-layer dlg-layer' }, box);
      ensure().appendChild(wrap);

      function type(line) {
        full = line; shown = 0; typing = true; arrow.style.opacity = 0;
        clearInterval(timer);
        timer = setInterval(() => {
          shown++; textEl.textContent = full.slice(0, shown);
          if (shown >= full.length) { clearInterval(timer); typing = false; arrow.style.opacity = 1; }
        }, opts.speed || 18);
      }
      function next() {
        if (typing) { clearInterval(timer); textEl.textContent = full; typing = false; arrow.style.opacity = 1; return; }
        idx++;
        if (idx >= lines.length) { close(); resolve(); return; }
        type(lines[idx]);
      }
      const ctrl = { press: (b) => { if (b === 'a' || b === 'b') next(); } };
      const off = () => {}; ctrl.off = off;
      stack.push(ctrl);
      const onPress = (b) => { if (stack[stack.length - 1] === ctrl) ctrl.press(b); };
      ctrl._unsub = G.input.on('press', onPress);
      box.addEventListener('click', () => next());
      function close() { ctrl._unsub(); const i = stack.indexOf(ctrl); if (i >= 0) stack.splice(i, 1); wrap.remove(); }
      type(lines[0]);
    });
  }

  // Vertical choice menu. items: [{label,value,disabled,hint}]. Returns value or null.
  function choice(items, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      let cur = 0;
      while (items[cur] && items[cur].disabled) cur++;
      const box = el('div', { class: 'choice-box ' + (opts.className || '') });
      if (opts.title) box.appendChild(el('div', { class: 'choice-title' }, opts.title));
      const list = el('div', { class: 'choice-list' });
      const rows = items.map((it, i) => {
        const r = el('div', { class: 'choice-item' + (it.disabled ? ' disabled' : ''), onclick: () => { if (!it.disabled) { cur = i; render(); pick(); } } }, [
          el('span', { class: 'choice-cursor' }, '▶'),
          el('span', { class: 'choice-label' }, it.label),
          it.hint != null ? el('span', { class: 'choice-hint' }, it.hint) : null,
        ]);
        list.appendChild(r); return r;
      });
      box.appendChild(list);
      const wrap = el('div', { class: 'ui-layer choice-layer ' + (opts.layerClass || '') }, box);
      ensure().appendChild(wrap);
      function render() { rows.forEach((r, i) => r.classList.toggle('sel', i === cur)); }
      function move(d) { let n = cur; for (let k = 0; k < items.length; k++) { n = (n + d + items.length) % items.length; if (!items[n].disabled) break; } cur = n; render(); G.audio && G.audio.play('cursor'); }
      function pick() { const it = items[cur]; if (it.disabled) return; close(); resolve(it.value); }
      const ctrl = { press: (b) => { if (b === 'up') move(-1); else if (b === 'down') move(1); else if (b === 'a') pick(); else if (b === 'b' && opts.cancelable !== false) { close(); resolve(opts.cancelValue !== undefined ? opts.cancelValue : null); } } };
      stack.push(ctrl);
      ctrl._unsub = G.input.on('press', (b) => { if (stack[stack.length - 1] === ctrl) ctrl.press(b); });
      function close() { ctrl._unsub(); const i = stack.indexOf(ctrl); if (i >= 0) stack.splice(i, 1); wrap.remove(); }
      render();
    });
  }

  async function confirm(msg, opts) {
    opts = opts || {};
    if (msg) await dialogueNoWaitShow(msg);
    return choice([{ label: opts.yes || 'Yes', value: true }, { label: opts.no || 'No', value: false }], { title: opts.title || msg, className: 'confirm-choice' });
  }
  function dialogueNoWaitShow() { return Promise.resolve(); }

  function toast(msg, opts) {
    opts = opts || {};
    const t = el('div', { class: 'game-toast ' + (opts.kind || '') }, msg);
    const layer = el('div', { class: 'ui-layer toast-layer' }, t);
    ensure().appendChild(layer);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => layer.remove(), 300); }, opts.duration || 1800);
  }

  // Full-screen fade. mode 'out' -> to black, 'in' -> from black.
  // A single shared layer so out+in pairs never strand a black overlay.
  let fadeEl = null;
  function fade(mode, ms) {
    ms = ms || 300;
    return new Promise((resolve) => {
      if (!fadeEl) {
        fadeEl = el('div', { class: 'fade-layer' });
        fadeEl.style.opacity = mode === 'out' ? '0' : '1';
        ensure().appendChild(fadeEl);
      }
      requestAnimationFrame(() => {
        fadeEl.style.transition = 'opacity ' + ms + 'ms ease';
        fadeEl.style.opacity = mode === 'out' ? '1' : '0';
      });
      setTimeout(() => {
        if (mode === 'in' && fadeEl) { fadeEl.remove(); fadeEl = null; }
        resolve();
      }, ms + 20);
    });
  }

  // Classic encounter flash before a battle: white/black strobes, then dark.
  function battleFlash() {
    return new Promise((resolve) => {
      const f = el('div', { class: 'battle-flash-layer' });
      ensure().appendChild(f);
      setTimeout(resolve, 480);
      setTimeout(() => {
        f.style.transition = 'opacity .25s ease';
        f.style.opacity = '0';
        setTimeout(() => f.remove(), 280);
      }, 560);
    });
  }

  G.gui = { el, dialogue, choice, confirm, toast, fade, battleFlash, isBusy };
})();
</script>
<script>/* save.js — persistence + preset saves (New Adventure, Champion quick-start). */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const KEY = 'unova_save_v1';

  function save(player) {
    try { localStorage.setItem(KEY, JSON.stringify(player)); return true; }
    catch (e) { console.warn('save failed', e); return false; }
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function hasSave() { return !!localStorage.getItem(KEY); }
  function wipe() { localStorage.removeItem(KEY); }

  // Fresh journey — you'll pick a starter from the Professor.
  function newAdventure(name) {
    const p = G.party.newPlayer();
    if (name) p.name = name.slice(0, 12);
    p.visitedTowns = ['nuvema'];
    return p;

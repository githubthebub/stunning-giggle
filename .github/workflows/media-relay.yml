name: media-relay
on:
  push:
    branches: ["claude/india-japan-anime-contest-q2ua5t"]
    paths: ["contest/assets/manifest.json"]
permissions:
  contents: write
concurrency:
  group: media-relay
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets listed in manifest
        run: |
          mkdir -p /tmp/relay
          cd /tmp/relay
          python3 "$GITHUB_WORKSPACE/.github/workflows/relay_fetch.py" "$GITHUB_WORKSPACE/contest/assets/manifest.json"
      - name: Publish as temporary release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/relay
          gh release delete media-relay --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          sleep 3
          gh release create media-relay assets.zip --prerelease \
            --title "media relay (temporary)" \
            --notes "Temporary transfer of AI-generated contest assets into the build environment. Safe to delete." \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"

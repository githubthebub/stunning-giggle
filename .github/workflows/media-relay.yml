name: media-relay
on:
  push:
    branches: ["claude/india-japan-anime-contest-q2ua5t"]
    paths: ["contest/assets/manifest.json"]
permissions:
  contents: write
concurrency:
  group: media-relay
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets listed in manifest
        run: |
          mkdir -p /tmp/relay
          cd /tmp/relay
          python3 "$GITHUB_WORKSPACE/.github/workflows/relay_fetch.py" "$GITHUB_WORKSPACE/contest/assets/manifest.json"
      - name: Push assets to orphan branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "media-relay"
          git config user.email "relay@localhost"
          git checkout --orphan media-relay-assets
          git rm -rf --quiet . || true
          cp /tmp/relay/files/* .
          git add -A
          git commit -m "relay assets (temporary transfer branch)"
          git push -f origin media-relay-assets
      - name: Clean up old release relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete media-relay --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true

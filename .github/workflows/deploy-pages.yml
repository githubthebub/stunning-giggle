name: Deploy to GitHub Pages

# The whole repo is a static site: the RPG at /, the Dream World at
# /dreamworld.html, the Card Dex at /pokedex/, Aura Atlas at /aura-atlas/,
# and the FeatherCut video editor at /editor/. Pages serves it over HTTPS,
# which the Card Dex camera and the editor's File System Access export
# both require.
#
# One-time setup: in the repo's Settings → Pages, set Source to
# "GitHub Actions" (the default GITHUB_TOKEN cannot enable Pages itself).
#
# Deploys run from the default branch and from the feature branches
# below; the most recent push wins. Because the feature branches are
# supersets of the default branch, deploying any of them serves everything.
on:
  push:
    branches:
      - claude/pokemon-dreamworld-jcu1u5
      - claude/premier-pro-storage-ram-jxrznh
      - claude/diaspora-psychology-game-anb6qi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

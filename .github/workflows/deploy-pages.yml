name: Deploy to GitHub Pages

# The whole repo is a static site: the RPG at /, the Dream World at
# /dreamworld.html, and the Card Dex at /pokedex/. Pages serves it over
# HTTPS, which is exactly what the Card Dex camera needs on phones.
#
# Publishing works by pushing the site to the `gh-pages` branch — GitHub
# serves Pages from that branch automatically, and this needs nothing
# beyond the default workflow token (no Pages settings, no PAT).
on:
  push:
    branches: [claude/pokemon-dreamworld-jcu1u5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA::7}" --allow-empty
          git push --force origin HEAD:gh-pages
